# Releases.
#
#   git tag v0.1.0 && git push --tags
#
# CI does the rest: static binaries for Linux and macOS on both architectures,
# a multi-architecture container image, checksums, and a changelog built from
# the commit messages.
version: 2

project_name: skifity

before:
  hooks:
    # The frontend is embedded in the binary, so it has to exist before any
    # of the builds start.
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run build
    - go mod download

builds:
  - id: skifity
    main: ./cmd/skifity
    binary: skifity
    env:
      # Pure Go all the way down: the SQLite driver needs no libc, so one
      # binary runs on Alpine, on Debian and on a distroless image.
      - CGO_ENABLED=0
    # Windows is here because there is no reason for it not to be: the binary
    # is pure Go with cgo off, os.UserConfigDir finds %AppData% on its own, and
    # somebody deploying from a Windows laptop needs the CLI as much as anybody.
    # The panel is not meant to run there — it installs k3s, which is Linux —
    # but the CLI and the MCP server are the same file.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      # The tag, v included, as `make build` reports it from git describe:
      # the version the panel shows is the one somebody types to upgrade.
      - -X skifity/internal/version.Version={{.Tag}}
      - -X skifity/internal/version.Commit={{.ShortCommit}}
      - -X skifity/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    # A gzipped copy of each binary for the panel's image to serve laptops
    # from /api/cli/download. See scripts/release-cli.sh.
    hooks:
      post:
        - cmd: sh scripts/release-cli.sh "{{ .Path }}" "{{ .Target }}" "{{ .Ext }}"
          dir: "."

archives:
  # The installer downloads a bare binary, not an archive, so the name it
  # expects is what the binary is published as.
  - id: binaries
    formats: [binary]
    # Spelled out rather than left to a default: the installer downloads this
    # exact name. No .exe here: a bare binary keeps its own extension, so
    # Windows gets skifity-windows-amd64.exe, and adding one again published
    # skifity-windows-amd64.exe.exe in a dry run.
    name_template: "skifity-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # The installer and the uninstaller are part of the release too, so they
  # are in checksums.txt, and with it in the provenance that vouches for
  # every file listed there.
  extra_files:
    - glob: installer/install.sh
    - glob: installer/uninstall.sh

# The image is published to the repository this release is cut from.
#
# It used to name a namespace nobody here owns — so a release would either fail
# or, worse, tell every installer to pull from a name somebody else could
# register. The workflow sets IMAGE_REPO from GITHUB_REPOSITORY, lowercased,
# which is right wherever it is released from and needs no decision here.
dockers_v2:
  - id: panel
    images:
      - "{{ .Env.IMAGE_REPO }}"
    # The tag with its v is the one that matters: the installer pulls
    # <image>:<RELEASED_VERSION> and the panel upgrades to <image>:<what was
    # typed>, and both are spelled v0.1.0. {{ .Version }} alone drops the v,
    # so an install of the first release would have pulled a tag nobody
    # published. The bare number stays for whoever expects it.
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.release
    # The other platforms' CLIs, gzipped by scripts/release-cli.sh, one
    # directory per image platform.
    extra_files:
      - dist/cli
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Skifity
      org.opencontainers.image.description: Self-hosted apps, powered by Kubernetes.
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.source: "{{ .Env.REPO_URL }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'

release:
  # A tag such as v0.1.0-alpha.1 is published as a pre-release.
  prerelease: auto
  # Attached to every release, so that
  #
  #   https://github.com/<repo>/releases/latest/download/install.sh
  #
  # is always the newest release's installer, and the README's install
  # command never names a version. Each one installs the release it is
  # attached to: RELEASED_VERSION inside it is this tag, which release.yml
  # checks before anything is published.
  extra_files:
    - glob: installer/install.sh
    - glob: installer/uninstall.sh
  footer: |
    ## Installing

    The newest release, whichever that is:

    ```sh
    curl -fsSL {{ .Env.REPO_URL }}/releases/latest/download/install.sh | sudo sh
    ```

    This release exactly:

    ```sh
    curl -fsSL {{ .Env.REPO_URL }}/releases/download/{{ .Tag }}/install.sh | sudo sh
    ```

    Each installer installs the release it is attached to, with the Kubernetes
    objects that release's image was built with.

    Already running Skifity? Upgrade from Settings, or:

    ```sh
    kubectl -n skifity-system set image deployment/skifity-panel \
      panel={{ .Env.IMAGE_REPO }}:{{ .Tag }}
    ```
