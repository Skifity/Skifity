# The Skifity HTTP API, described for machines.
#
# Written by hand, beside the router in api.go. internal/api/openapi_test.go
# walks that router and fails on every route this file does not describe and on
# every route it describes that nothing answers, so a new route is not finished
# until it is here. The panel serves this file as JSON at /api/openapi.json,
# with info.version replaced by the binary's own.
#
# Schemas follow the Go types' JSON tags exactly. A field tagged omitempty or
# omitzero is left out of `required`, because the panel leaves it out of the
# answer.

openapi: 3.1.0

info:
  title: Skifity API
  version: development
  summary: Self-hosted apps, powered by Kubernetes.
  description: |
    The API the panel, the `skifity` CLI and the MCP server all use. Anything the
    panel can do, a request here can do.

    **Authentication.** Send an API token as `Authorization: Bearer skf_...`.
    Create one in the panel under Account, then API tokens. A browser session
    works too; it is the `skifity_session` cookie (`__Host-skifity_session` on
    HTTPS), and a request that changes something then also carries the
    session's CSRF token in the `X-Skifity-CSRF` header. A token needs no CSRF
    header. A few actions refuse a token and want a person who has just typed
    their password; those list only the session scheme.

    **Answers.** Lists come back as `{"items": [...], "total": n}`. Every
    failure has the same shape: an `error` object with a stable `code`, a
    `title`, and the `cause`, `impact` and `fix` in words to act on.

    **Streams.** The event stream, and an app's logs followed live, are
    server-sent events (`text/event-stream`).

    **Roles.** A team member is an owner, an admin, a member or a viewer. A
    viewer reads everything a member can and changes nothing. Routes marked as
    for panel administrators want an account that administers the whole
    panel, whatever its role in a team.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0

servers:
  - url: /
    description: The panel this description was read from.

# Everything needs a token or a session unless it says otherwise.
security:
  - bearerToken: []
  - sessionCookie: []

tags:
  - name: Panel
    description: Health, version, first-run setup, the CLI binary and this description.
  - name: Auth
    description: Signing in and out, single sign-on, and accepting an invitation.
  - name: Account
    description: The signed-in person, their sessions, two-factor authentication and API tokens.
  - name: Teams
    description: Teams, their members and invitations, the audit log and the export.
  - name: Projects
    description: Projects and the environments in them.
  - name: Servers
    description: The machines in the cluster, and the cluster itself.
  - name: Operations
    description: Long-running work, such as adding a server, followed step by step.
  - name: Git
    description: Git connections, reading a repository before creating an app, and push webhooks.
  - name: Notifications
    description: Where a team's alerts are sent.
  - name: Apps
    description: Creating, configuring, watching and protecting apps.
  - name: Deployments
    description: Deploying, rolling back and promoting versions of an app.
  - name: Variables
    description: Environment variables, per app and shared across a project.
  - name: Secret managers
    description: >-
      Connections to the Vault, Infisical, Doppler or AWS Secrets Manager a team
      already runs, so a variable can be read from there instead of stored here.
  - name: Domains
    description: The hostnames an app answers on.
  - name: Scaling
    description: Instances, autoscaling, and an app's other processes.
  - name: Volumes
    description: Persistent storage attached to an app.
  - name: Databases
    description: Managed databases, and linking them to apps.
  - name: Backups
    description: Backups of databases, volumes and the panel itself, and putting them back.
  - name: Templates
    description: The one-click catalogue.
  - name: Plugins
    description: Installing, configuring and removing plugins. Panel administrators only.
  - name: Settings
    description: Panel-wide settings, components, upgrades and the master key. Panel administrators only.
  - name: Events
    description: The server-sent event stream the panel updates itself from.
  - name: MCP
    description: The panel's own MCP server, for an assistant that cannot run the binary.

paths:

  # --- open: health, setup, signing in ---

  /api/health:
    get:
      operationId: health
      tags: [Panel]
      summary: Is the panel working
      description: >-
        Liveness. It does not ask the cluster, so a cluster that is unwell does
        not get the panel restarted by the probe that is watching it.
      security: []
      responses:
        '200':
          description: The panel is working.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: The panel cannot read its own database.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default: {$ref: '#/components/responses/Error'}

  /api/ready:
    get:
      operationId: ready
      tags: [Panel]
      summary: Should the panel receive traffic
      description: Readiness. It checks the database and whether the cluster answers.
      security: []
      responses:
        '200':
          description: Ready. A cluster that does not answer is reported in checks and does not make it unready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
        '503':
          description: Not ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
        default: {$ref: '#/components/responses/Error'}

  /api/meta:
    get:
      operationId: meta
      tags: [Panel]
      summary: Product, version and what the sign-in page needs
      security: []
      responses:
        '200':
          description: What this panel is.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Meta'}
        default: {$ref: '#/components/responses/Error'}

  /api/cli/download:
    get:
      operationId: downloadCLI
      tags: [Panel]
      summary: Download the command line tool
      description: >-
        The panel hands out the binary it is itself running, which is also the
        CLI. With no platform named, or with the panel's own, that is the
        running binary. Anything else is a cross-built copy, when the panel has
        one. Sent gzip-compressed to a client that accepts it.
      security: []
      parameters:
        - name: os
          in: query
          description: The operating system. The panel's own when left out.
          schema: {type: string, enum: [linux, darwin, windows]}
        - name: arch
          in: query
          description: The processor. The panel's own when left out.
          schema: {type: string, enum: [amd64, arm64]}
      responses:
        '200':
          description: The binary.
          headers:
            Content-Disposition:
              description: The file name, such as skifity-darwin-arm64, for a platform other than the panel's.
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        default: {$ref: '#/components/responses/Error'}

  /api/openapi.json:
    get:
      operationId: openAPI
      tags: [Panel]
      summary: This description
      description: >-
        The OpenAPI description of every route, as JSON, with info.version set
        to the panel's own version. It describes the source and holds no data.
      security: []
      responses:
        '200':
          description: An OpenAPI 3.1 document.
          content:
            application/json:
              schema: {type: object}
        default: {$ref: '#/components/responses/Error'}

  /api/setup/status:
    get:
      operationId: setupStatus
      tags: [Panel]
      summary: Whether first-run setup is still to be done
      security: []
      responses:
        '200':
          description: Whether the panel has an account yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
        default: {$ref: '#/components/responses/Error'}

  /api/setup:
    post:
      operationId: completeSetup
      tags: [Panel]
      summary: Create the first administrator
      description: >-
        Creates the first administrator, their team, a first project with a
        production environment, and signs them in. It needs the one-time setup
        token the installer printed, and refuses once any account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '201':
          description: >-
            The administrator is signed in: the session cookie is set. The
            recovery key is shown here and must be kept; it opens every secret
            the panel stores.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupResult'}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in with an email address and password
      description: >-
        Sets the session cookie. An account with two-factor authentication
        answers totp_required first; send the same request again with
        totp_code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed in, or a second factor is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/SignedIn'}
                  - {$ref: '#/components/schemas/TOTPRequired'}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Send a link to reset a forgotten password
      description: >-
        Open. Answers the same whether or not the address has an account, and
        sends the mail afterwards. Limited per caller and per account; only the
        newest link works, for 30 minutes. Needs the panel's mail server and
        Panel URL (GET /api/meta says password_reset).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: {type: string}
      responses:
        '202':
          description: If an account uses the address, a link is on its way.
          content:
            application/json:
              schema:
                type: object
                required: [ok, note]
                properties:
                  ok: {type: boolean}
                  note: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Choose a new password through a reset link
      description: >-
        Open, authenticated by the link's token. Ends every session the account
        had; nobody is signed in by it, and two-factor is still asked for at
        the next sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: Ends this session and clears its cookies. Without a session it does nothing and still answers ok.
      security: []
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/sso/start:
    get:
      operationId: ssoStart
      tags: [Auth]
      summary: Start signing in with the identity provider
      description: A browser navigation, not an API call. It redirects to the provider.
      security: []
      parameters:
        - name: next
          in: query
          description: A path on this panel to land on afterwards.
          schema: {type: string}
      responses:
        '302':
          description: To the identity provider.
          headers:
            Location:
              schema: {type: string, format: uri}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/sso/callback:
    get:
      operationId: ssoCallback
      tags: [Auth]
      summary: Where the identity provider sends the browser back
      description: >-
        A browser navigation. It always redirects: into the panel, signed in,
        or to the sign-in page with sso_error in the query.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302':
          description: Back into the panel.
          headers:
            Location:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/passkey/begin:
    post:
      operationId: beginPasskeySignIn
      tags: [Auth]
      summary: Start signing in with a passkey
      description: >-
        Open. Answers the options to pass to navigator.credentials.get: a
        single-use challenge, good for five minutes, that asks for a
        discoverable passkey with user verification. Sets a short-lived
        HttpOnly cookie that ties the challenge to this browser. Only when
        GET /api/meta says passkeys.available: the panel has to be on HTTPS at
        a domain, or on localhost.
      security: []
      requestBody:
        required: true
        description: An empty object.
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: The request options, in the form the WebAuthn JSON serialisation uses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyRequestOptions'}
        default: {$ref: '#/components/responses/Error'}

  /api/auth/passkey/finish:
    post:
      operationId: finishPasskeySignIn
      tags: [Auth]
      summary: Finish signing in with a passkey
      description: >-
        Open, authenticated by the passkey's signature over the challenge this
        browser was given. Sets the same session cookie as signing in with a
        password. The signature, origin, relying party, challenge, user
        verification and signature counter are all checked; a refusal says
        auth.passkey_refused whatever the reason, and is limited like a wrong
        password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyAssertion'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedIn'}
        default: {$ref: '#/components/responses/Error'}

  /api/invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/invitationToken'
    get:
      operationId: lookupInvitation
      tags: [Auth]
      summary: Read an invitation
      description: >-
        For somebody who has no account yet. The token in the link is the
        credential. An expired, used or withdrawn invitation answers the same
        way as one that never existed.
      security: []
      responses:
        '200':
          description: Who is invited, to which team, as what.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationLookup'}
        default: {$ref: '#/components/responses/Error'}

  /api/invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/invitationToken'
    post:
      operationId: acceptInvitation
      tags: [Auth]
      summary: Accept an invitation and create the account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptInvitationRequest'}
      responses:
        '200':
          description: The account exists, is in the team, and is signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignedIn'}
        default: {$ref: '#/components/responses/Error'}

  /api/webhooks/git/{sourceID}:
    parameters:
      - $ref: '#/components/parameters/sourceID'
    post:
      operationId: gitWebhook
      tags: [Git]
      summary: Receive a push from a Git host
      description: >-
        Called by GitHub, GitLab, Gitea or Bitbucket, not by a person. It is
        authenticated by the connection's webhook secret instead of a token,
        checked the way the connection's kind signs: X-Hub-Signature-256 from
        GitHub and Gitea, X-Gitea-Signature from older Gitea, X-Gitlab-Token
        from GitLab, X-Hub-Signature (sha256=) from Bitbucket. A push deploys
        the apps that build from the branch; a pull request makes, updates or
        removes a preview. A Bitbucket push that moved several refs is answered
        for all of them at once.
      security: []
      requestBody:
        required: true
        description: The Git host's own payload, up to 5 MiB.
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: A ping, or an event the panel does not act on.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ignored, pong]}
        '202':
          description: What the event started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookResult'}
        default: {$ref: '#/components/responses/Error'}

  # --- the signed-in person ---

  /api/me:
    get:
      operationId: me
      tags: [Account]
      summary: Who is signed in, and their teams
      description: A token made for one team sees only that team.
      responses:
        '200':
          description: The signed-in person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMe
      tags: [Account]
      summary: Change your name, language or theme
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMeRequest'}
      responses:
        '200':
          description: The account as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/password:
    post:
      operationId: changePassword
      tags: [Account]
      summary: Change your password
      description: Every other session is signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/sessions:
    get:
      operationId: listSessions
      tags: [Account]
      summary: The devices you are signed in on
      responses:
        '200':
          description: Your sessions, this one marked current.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeOtherSessions
      tags: [Account]
      summary: Sign out every other device
      responses:
        '200':
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked]
                properties:
                  ok: {type: boolean, const: true}
                  revoked: {type: integer}
        default: {$ref: '#/components/responses/Error'}

  /api/me/sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    delete:
      operationId: revokeSession
      tags: [Account]
      summary: Sign out one device
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/tokens:
    get:
      operationId: listTokens
      tags: [Account]
      summary: Your API tokens
      description: Never the secret, which is shown once, when a token is made.
      responses:
        '200':
          description: Your tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createToken
      tags: [Account]
      summary: Create an API token
      description: >-
        A token is made for one team and can do no more than its owner's role
        there. Made from a signed-in session within the last few minutes of
        typing the password; a token cannot make another.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTokenRequest'}
      responses:
        '201':
          description: The token, and its secret, which is not shown again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedToken'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/tokens/{tokenID}:
    parameters:
      - $ref: '#/components/parameters/tokenID'
    delete:
      operationId: revokeToken
      tags: [Account]
      summary: Revoke an API token
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/reauth:
    post:
      operationId: reauth
      tags: [Account]
      summary: Prove it is you again
      description: >-
        Re-checks the password, and the second factor when there is one, so
        the actions that want a recent sign-in can go ahead. A browser session
        only.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReauthRequest'}
      responses:
        '200':
          description: Confirmed, or a second factor is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/OK'}
                  - {$ref: '#/components/schemas/TOTPRequired'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/sso:
    get:
      operationId: getSSOLink
      tags: [Account]
      summary: The identity provider accounts linked to yours
      responses:
        '200':
          description: Whether single sign-on is set up, and what is linked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSOLink'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: unlinkSSO
      tags: [Account]
      summary: Unlink the identity provider
      description: Refused for an account with no password, which would have no way in left. Wants a recent sign-in.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Unlinked.
        default: {$ref: '#/components/responses/Error'}

  /api/me/sso/link:
    post:
      operationId: startSSOLink
      tags: [Account]
      summary: Start linking the identity provider to your account
      description: Answers with the provider's address to send the browser to. Wants a recent sign-in.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
        default: {$ref: '#/components/responses/Error'}

  /api/me/passkeys:
    get:
      operationId: listPasskeys
      tags: [Account]
      summary: Your passkeys
      description: Listed even when the panel cannot use passkeys at the moment, so they can be removed.
      responses:
        '200':
          description: Your passkeys, oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addPasskey
      tags: [Account]
      summary: Finish adding a passkey
      description: >-
        Sends the browser's answer to the options from
        POST /api/me/passkeys/register, with a name to recognise the passkey
        by. The challenge is bound to this session and works once. Wants a
        recent sign-in.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddPasskeyRequest'}
      responses:
        '201':
          description: The passkey as stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passkey'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/passkeys/register:
    post:
      operationId: beginPasskeyRegistration
      tags: [Account]
      summary: Start adding a passkey
      description: >-
        Answers the options to pass to navigator.credentials.create: a
        discoverable credential with user verification, no attestation, and
        the account's passkeys excluded. Good for five minutes, in this
        session. Wants a recent sign-in.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The creation options, in the form the WebAuthn JSON serialisation uses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyCreationOptions'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/passkeys/{passkeyID}:
    parameters:
      - $ref: '#/components/parameters/passkeyID'
    patch:
      operationId: renamePasskey
      tags: [Account]
      summary: Rename a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenamePasskeyRequest'}
      responses:
        '200':
          description: The passkey as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passkey'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removePasskey
      tags: [Account]
      summary: Remove a passkey
      description: >-
        Refused for the last passkey of an account with no password and no
        single sign-on, which would have no way in left. Wants a recent
        sign-in.
      security:
        - sessionCookie: []
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/totp:
    post:
      operationId: startTOTP
      tags: [Account]
      summary: Start setting up two-factor authentication
      description: >-
        Answers the secret, the otpauth URI for a QR code and eight recovery
        codes. Nothing is switched on until the first code is confirmed. Wants
        a recent sign-in.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The secret and the recovery codes, shown this once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPSetup'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: disableTOTP
      tags: [Account]
      summary: Turn two-factor authentication off
      description: Wants a recent sign-in.
      security:
        - sessionCookie: []
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/me/totp/confirm:
    post:
      operationId: confirmTOTP
      tags: [Account]
      summary: Confirm the first code and turn two-factor authentication on
      description: Every other session is signed out. Wants a recent sign-in.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPConfirmRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  # --- teams ---

  /api/teams:
    get:
      operationId: listTeams
      tags: [Teams]
      summary: The teams you are in
      description: A token made for one team sees only that team.
      responses:
        '200':
          description: Your teams, each with your role in it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTeam
      tags: [Teams]
      summary: Create a team
      description: You become its owner. Refused to a token made for one team.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamRequest'}
      responses:
        '201':
          description: The team.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: getTeam
      tags: [Teams]
      summary: A team, and your place in it
      responses:
        '200':
          description: The team, with your role and any limit to projects.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateTeam
      tags: [Teams]
      summary: Rename a team, or require a second factor in it
      description: >-
        Admin. The slug does not change, because it is part of every namespace
        name. Requiring a second factor is refused to somebody who signed in
        without one, who would be locked out by it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTeamRequest'}
      responses:
        '200':
          description: The team as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/members:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listMembers
      tags: [Teams]
      summary: Who is in the team
      responses:
        '200':
          description: The members and their roles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addMember
      tags: [Teams]
      summary: Add somebody who has an account, or change their role
      description: >-
        Admin. Nobody can grant a role above their own, and the last owner
        cannot be demoted. Leaving projects out lifts any limit to projects.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/userID'
    delete:
      operationId: removeMember
      tags: [Teams]
      summary: Remove somebody from the team
      description: Admin. Only an owner removes an owner, and never the last one.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/invitations:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listInvitations
      tags: [Teams]
      summary: The invitations that have not been accepted
      description: Admin.
      responses:
        '200':
          description: The team's invitations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: invite
      tags: [Teams]
      summary: Invite somebody who has no account
      description: Admin. The link is valid for seven days and works once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteRequest'}
      responses:
        '201':
          description: The invitation, and the link to send.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedInvitation'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/invitations/{invitationID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/invitationID'
    delete:
      operationId: revokeInvitation
      tags: [Teams]
      summary: Withdraw an invitation
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/audit:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listAudit
      tags: [Teams]
      summary: The audit log
      description: Admin. Who did what, when and from where, newest first. Entries are kept for ninety days.
      parameters:
        - {name: action, in: query, description: 'Only this action, such as app.deploy_started.', schema: {type: string}}
        - {name: target_id, in: query, description: 'Only entries about this id.', schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventList'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/export:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: exportTeam
      tags: [Teams]
      summary: Everything the team has, in one document
      description: >-
        Admin. Every project, environment, app, domain, variable, volume,
        schedule, process and database, with each app's Kubernetes objects as
        YAML. The value of a secret variable is never in it. Refused to a token
        with scopes.
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamExport'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/projects:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listProjects
      tags: [Projects]
      summary: The team's projects
      description: A member limited to some projects sees those.
      responses:
        '200':
          description: The projects.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: Member. It starts with a production environment.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: The project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/servers:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listServers
      tags: [Servers]
      summary: The team's servers
      responses:
        '200':
          description: The servers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addServer
      tags: [Servers]
      summary: Add a server
      description: >-
        Panel administrators only. The panel signs in once with the password or
        key, installs a key of its own, and joins the machine to the cluster.
        It answers at once with the operation to follow.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddServerRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/cluster:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: clusterSummary
      tags: [Servers]
      summary: The cluster, as this team sees it
      description: >-
        The team's own servers and the capacity it shares. A panel
        administrator sees every node. A cluster that cannot be reached is an
        answer with reachable false, not an error.
      responses:
        '200':
          description: The cluster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterSummary'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/detect:
    parameters:
      - $ref: '#/components/parameters/teamID'
    post:
      operationId: detect
      tags: [Git]
      summary: Read a repository and say what it is
      description: >-
        Member. The language, the builder, the port, the databases it will want
        and the services of a Compose file, before any app exists. A private
        repository needs one of the team's Git connections.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DetectRequest'}
      responses:
        '200':
          description: What the repository is.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Detection'
                  - type: object
                    properties:
                      truncated: {type: boolean, description: 'The repository was too large to read whole.'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/detect-upload:
    parameters:
      - $ref: '#/components/parameters/teamID'
    post:
      operationId: detectUpload
      tags: [Git]
      summary: Read a folder and say what it is
      description: Member. The same as detect, for a folder sent as a .tar.gz rather than a repository. Nothing is stored.
      requestBody:
        required: true
        content:
          application/gzip:
            schema: {type: string, contentMediaType: application/gzip}
      responses:
        '200':
          description: What the folder is.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Detection'
                  - type: object
                    required: [files]
                    properties:
                      files: {type: integer, description: 'How many files the archive holds.'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/templates:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listTeamTemplates
      tags: [Templates]
      summary: The catalogue as a team sees it
      description: >-
        Viewer, including a member limited to some projects. The templates of
        the team's own catalogues that pass every check, each naming its
        catalogue, then the built-in ones. An id may appear twice, once per
        catalogue; install names the catalogue to say which.
      responses:
        '200':
          description: The team's templates, then the built-in ones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateList'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/template-catalogues:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listTemplateCatalogues
      tags: [Templates]
      summary: The team's own template catalogues
      description: >-
        Viewer, not limited to projects. Each with when it was last downloaded,
        why the last refresh failed if it did, how many of its templates can be
        installed and why each of the others cannot. Never the value of the
        header it is fetched with.
      responses:
        '200':
          description: The catalogues, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateCatalogueList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addTemplateCatalogue
      tags: [Templates]
      summary: Add a template catalogue
      description: >-
        Admin. The address is downloaded and read before anything is kept, through
        the same guard as every address the panel is given, and its templates are
        held to the checks the built-in ones are. The header's value is sealed and
        never answered.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddTemplateCatalogueRequest'}
      responses:
        '201':
          description: The catalogue as it was read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateCatalogue'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/template-catalogues/{catalogueID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/catalogueID'
    delete:
      operationId: removeTemplateCatalogue
      tags: [Templates]
      summary: Remove a template catalogue
      description: Admin. Apps installed from it stay, and are no longer offered updates from it.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/template-catalogues/{catalogueID}/refresh:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/catalogueID'
    post:
      operationId: refreshTemplateCatalogue
      tags: [Templates]
      summary: Download a template catalogue again
      description: >-
        Admin. Also done every day. A download that fails or does not read is
        recorded on the catalogue and answered as an error, and the copy it had
        is kept and still installed from.
      responses:
        '200':
          description: The catalogue as it now reads.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateCatalogue'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/registries:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listRegistries
      tags: [Teams]
      summary: The private registries the team pulls from
      description: Viewer, not limited to projects. Hosts and usernames; never a password.
      responses:
        '200':
          description: The credentials, by host.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryCredentialList'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setRegistry
      tags: [Teams]
      summary: Save the credentials for a registry host
      description: >-
        Admin. The registry is asked first, the way docker login asks, and
        credentials it turns down are refused. One the panel cannot reach is
        saved and marked unchecked.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetRegistryRequest'}
      responses:
        '200':
          description: The credential as saved, and whether the registry was asked.
          content:
            application/json:
              schema:
                type: object
                required: [registry, checked]
                properties:
                  registry: {$ref: '#/components/schemas/RegistryCredential'}
                  checked: {type: boolean}
                  unchecked_because: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/registries/{registryID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/registryID'
    delete:
      operationId: deleteRegistry
      tags: [Teams]
      summary: Remove a registry's credentials
      description: Admin. Each app stops pulling with them from its next deploy.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/certificates:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listCertificates
      tags: [Teams]
      summary: The certificates the team brought for its own hostnames
      description: >-
        Viewer, not limited to projects. Names, hostnames, issuers, dates and
        which domains each one serves. Never a private key.
      responses:
        '200':
          description: The certificates, by name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: saveCertificate
      tags: [Teams]
      summary: Upload a certificate, or a new version of one
      description: >-
        Admin. The chain and its private key, PEM. Refused unless the key
        belongs to the certificate, the certificates form one chain (the
        order is put right), it is valid now, its key is RSA of 2048 bits or
        more, ECDSA P-256 or P-384, or Ed25519, it names at least one DNS
        name, and none of its names is another team's or the panel's. The key
        is sealed and never sent back. A name that exists is replaced, and
        every app whose hostnames either version covers is re-applied in the
        background.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveCertificateRequest'}
      responses:
        '201':
          description: The certificate was added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedCertificate'}
        '200':
          description: A certificate of the same name was replaced.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedCertificate'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/certificates/{certificateID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/certificateID'
    delete:
      operationId: deleteCertificate
      tags: [Teams]
      summary: Remove a certificate
      description: >-
        Admin. Its hostnames go back to Let's Encrypt, or to another of the
        team's certificates that covers them; the apps are re-applied in the
        background and its Secret leaves their namespaces.
      responses:
        '200':
          description: Removed, and how many apps are being re-applied.
          content:
            application/json:
              schema:
                type: object
                required: [ok, updating]
                properties:
                  ok: {type: boolean}
                  updating: {type: integer}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/git-sources:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listGitSources
      tags: [Git]
      summary: The team's Git connections
      description: Names and hosts. Never a token.
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitSourceList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createGitSource
      tags: [Git]
      summary: Connect a Git host
      description: >-
        Admin. The answer carries the webhook secret, which is not shown again
        here. A Bitbucket token is checked with Bitbucket before it is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGitSourceRequest'}
      responses:
        '201':
          description: The connection, and where its pushes are delivered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedGitSource'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/git-sources/{sourceID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/sourceID'
    delete:
      operationId: deleteGitSource
      tags: [Git]
      summary: Remove a Git connection
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/git-sources/{sourceID}/repositories:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/sourceID'
      - {name: q, in: query, required: false, description: 'Only the repositories whose name has this in it.', schema: {type: string, maxLength: 100}}
    get:
      operationId: listGitRepositories
      tags: [Git]
      summary: The repositories a Git connection can read
      description: Member, including one limited to projects. At most 300, the most recently active first; truncated says whether there were more.
      responses:
        '200':
          description: The repositories.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [full_name, url, default_branch, private]
                      properties:
                        full_name: {type: string}
                        url: {type: string}
                        default_branch: {type: string}
                        private: {type: boolean}
                  truncated: {type: boolean}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/git-sources/{sourceID}/branches:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/sourceID'
      - {name: repo, in: query, required: true, description: 'The repository, as owner/name.', schema: {type: string}}
      - {name: q, in: query, required: false, description: 'Only the branches whose name has this in it.', schema: {type: string, maxLength: 100}}
    get:
      operationId: listGitBranches
      tags: [Git]
      summary: The branches of one repository
      description: Member, including one limited to projects. At most 300.
      responses:
        '200':
          description: The branches.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name]
                      properties:
                        name: {type: string}
                  truncated: {type: boolean}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/git-sources/{sourceID}/webhook:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/sourceID'
    get:
      operationId: getGitSourceWebhook
      tags: [Git]
      summary: Where a repository delivers pushes, and the secret it signs them with
      description: Admin. For a Git host the panel could not register a webhook with by itself. Audited.
      responses:
        '200':
          description: The webhook address and secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitSourceWebhook'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/notifications/kinds:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listNotificationKinds
      tags: [Notifications]
      summary: The kinds of channel that can be added
      description: Admin. The built-in kinds, and any a plugin provides, with the plugin's own form.
      responses:
        '200':
          description: The kinds.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelKindList'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/notifications:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listNotificationChannels
      tags: [Notifications]
      summary: The team's notification channels
      responses:
        '200':
          description: The channels. Their settings are sealed and not returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannelList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createNotificationChannel
      tags: [Notifications]
      summary: Add a notification channel
      description: Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateChannelRequest'}
      responses:
        '201':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/notifications/{channelID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/channelID'
    get:
      operationId: getNotificationChannel
      tags: [Notifications]
      summary: A notification channel and its settings, for changing it
      description: >-
        Admin. The settings that are not secret come back as they are; the
        secret ones are named in `secrets` and their values are never returned.
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannelDetail'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateNotificationChannel
      tags: [Notifications]
      summary: Change a notification channel
      description: >-
        Admin. The whole channel as the form shows it; its kind cannot change.
        A secret setting sent empty, or left out, keeps what is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChannelRequest'}
      responses:
        '200':
          description: The channel as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteNotificationChannel
      tags: [Notifications]
      summary: Remove a notification channel
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/notifications/{channelID}/test:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/channelID'
    post:
      operationId: testNotificationChannel
      tags: [Notifications]
      summary: Send a test message
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  # --- secret managers ---

  /api/teams/{teamID}/secret-managers:
    parameters:
      - $ref: '#/components/parameters/teamID'
    get:
      operationId: listSecretManagers
      tags: [Secret managers]
      summary: The team's secret manager connections
      description: >-
        Anybody in the team, including a member limited to some projects, who
        picks one for a variable. Names, kinds, settings and limits; what a
        connection signs in with is never returned. A member limited to some
        projects is shown only the connections one of their projects may read
        through, and of each connection's projects only their own.
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretManagerList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSecretManager
      tags: [Secret managers]
      summary: Connect a secret manager
      description: >-
        Admin. The connection signs in before it is saved, reading no secret,
        and is refused with the reason when it cannot. Its credentials are
        sealed and never returned. `allowed_paths` and `allowed_project_ids`
        limit what it may be used for; left out, it is every path and every
        project.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSecretManagerRequest'}
      responses:
        '201':
          description: The connection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretManager'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/secret-managers/{connectionID}:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/connectionID'
    patch:
      operationId: updateSecretManager
      tags: [Secret managers]
      summary: Change a connection's settings, credentials, limits or periodic refresh
      description: >-
        Admin. New settings or credentials sign in before they replace what
        worked. Credentials left out are kept. New limits that would leave
        variables which read the connection now outside them are refused with
        `secrets.limits_break_references` (409), naming the variables, unless
        `force` is true; the answer to a forced change lists them under
        `stopped_resolving`. A change of limits is audited as
        `secret_manager.limited`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSecretManagerRequest'}
      responses:
        '200':
          description: The connection as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretManager'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSecretManager
      tags: [Secret managers]
      summary: Remove a connection
      description: Admin. Refused, naming them, while any variable is read from it.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/teams/{teamID}/secret-managers/{connectionID}/test:
    parameters:
      - $ref: '#/components/parameters/teamID'
      - $ref: '#/components/parameters/connectionID'
    post:
      operationId: testSecretManager
      tags: [Secret managers]
      summary: Check that a connection still signs in
      description: >-
        Admin. Vault's token lookup, Infisical's login, Doppler's token
        details, or AWS's GetCallerIdentity: nothing is read.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  # --- servers ---

  /api/servers/{serverID}:
    parameters:
      - $ref: '#/components/parameters/serverID'
    get:
      operationId: getServer
      tags: [Servers]
      summary: A server, and the latest operation on it
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerDetail'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateServer
      tags: [Servers]
      summary: Rename a server
      description: Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateServerRequest'}
      responses:
        '200':
          description: The server as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Server'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeServer
      tags: [Servers]
      summary: Drain a server and take it out of the cluster
      description: >-
        Panel administrators only. A control plane server is removed only
        when three remain after it, since fewer cannot keep the cluster's
        quorum. A server the panel did not install cannot be removed this way.
      parameters:
        - {name: wipe, in: query, description: 'Also uninstall k3s from the machine.', schema: {type: boolean}}
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/retry:
    parameters:
      - $ref: '#/components/parameters/serverID'
    post:
      operationId: retryServer
      tags: [Servers]
      summary: Retry adding a server from the step that failed
      description: Panel administrators only.
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/promote:
    parameters:
      - $ref: '#/components/parameters/serverID'
    post:
      operationId: promoteServer
      tags: [Servers]
      summary: Make a server a control plane server
      description: Panel administrators only. Needs at least three servers.
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/metrics:
    parameters:
      - $ref: '#/components/parameters/serverID'
    get:
      operationId: serverMetrics
      tags: [Servers]
      summary: A server's live numbers
      responses:
        '200':
          description: The node as the cluster reports it, with the last disk reading.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeInfo'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/usage:
    parameters:
      - $ref: '#/components/parameters/serverID'
    get:
      operationId: serverUsage
      tags: [Servers]
      summary: A server's usage over time
      parameters:
        - $ref: '#/components/parameters/metricsRange'
      responses:
        '200':
          description: Shares of CPU, memory and disk, the highest in each bucket.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerUsage'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/alerts:
    parameters:
      - $ref: '#/components/parameters/serverID'
    get:
      operationId: getServerAlerts
      tags: [Servers]
      summary: The thresholds a server is watched against
      responses:
        '200':
          description: The thresholds, and which are going off now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerAlerts'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setServerAlerts
      tags: [Servers]
      summary: Change a server's thresholds
      description: Admin. A percentage from 50 to 100, or 0 for off.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServerAlerts'}
      responses:
        '200':
          description: The thresholds as they are now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServerAlerts'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/hardening:
    parameters:
      - $ref: '#/components/parameters/serverID'
    get:
      operationId: getServerHardening
      tags: [Servers]
      summary: How a server stands up to the internet
      description: >-
        Panel administrator. Signs in to the server over SSH with the key
        Skifity installed and reads, changing nothing: whether SSH takes
        passwords, whether root can sign in with one, fail2ban, automatic
        security updates, the firewall, and a pending reboot. Not for a
        server Skifity did not add.
      responses:
        '200':
          description: The findings, worst first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HardeningReport'}
        default: {$ref: '#/components/responses/Error'}

  /api/servers/{serverID}/hardening/ssh-passwords-off:
    parameters:
      - $ref: '#/components/parameters/serverID'
    post:
      operationId: turnOffSSHPasswords
      tags: [Servers]
      summary: Make a server's SSH take keys only
      description: >-
        Panel administrator. Writes a drop-in that turns off password and
        keyboard-interactive sign-in and root with a password, checks it with
        sshd -t and that it took, then reloads SSH. Refused, with nothing
        changed, when the daemon does not accept keys or does not read its
        drop-in directory.
      responses:
        '200':
          description: The server checked again after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HardeningReport'}
        default: {$ref: '#/components/responses/Error'}

  # --- projects and environments ---

  /api/projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      operationId: getProject
      tags: [Projects]
      summary: A project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Rename a project, or change its description
      description: Member.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProjectRequest'}
      responses:
        '200':
          description: The project as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project and everything in it
      description: Admin. Every environment's namespace is removed from the cluster with it.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/projects/{projectID}/environments:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      operationId: listEnvironments
      tags: [Projects]
      summary: A project's environments
      responses:
        '200':
          description: The environments, previews included.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createEnvironment
      tags: [Projects]
      summary: Create an environment
      description: Member. It is a namespace of its own, with its own quota and network policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEnvironmentRequest'}
      responses:
        '201':
          description: The environment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        default: {$ref: '#/components/responses/Error'}

  /api/projects/{projectID}/variables:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      operationId: listSharedVariables
      tags: [Variables]
      summary: A project's shared variables
      description: Every app in the project reads them. A secret's value is never returned.
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedVariableList'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setSharedVariable
      tags: [Variables]
      summary: Set a shared variable
      description: Member. Every app in the project is rolled out with it; nothing is rebuilt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetVariableRequest'}
      responses:
        '200':
          description: The variable, without its value.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedVariable'}
        default: {$ref: '#/components/responses/Error'}

  /api/projects/{projectID}/variables/batch:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      operationId: changeSharedVariables
      tags: [Variables]
      summary: Set and remove several shared variables at once
      description: Member. All of them or none, and one rollout of each app. A shared variable cannot be read at build time.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeVariablesRequest'}
      responses:
        '200':
          description: What was set, without values, and what was removed.
          content:
            application/json:
              schema:
                type: object
                required: [set, unset]
                properties:
                  set:
                    type: array
                    items: {$ref: '#/components/schemas/Variable'}
                  unset:
                    type: [array, 'null']
                    items: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/projects/{projectID}/variables/{key}:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/key'
    delete:
      operationId: deleteSharedVariable
      tags: [Variables]
      summary: Remove a shared variable
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/projects/{projectID}/canvas:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      operationId: projectCanvas
      tags: [Projects]
      summary: A project's apps and databases, and what uses what
      responses:
        '200':
          description: Boxes and arrows, the arrow from an app to the database it uses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectCanvas'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}:
    parameters:
      - $ref: '#/components/parameters/envID'
    get:
      operationId: getEnvironment
      tags: [Projects]
      summary: An environment
      responses:
        '200':
          description: The environment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateEnvironment
      tags: [Projects]
      summary: Change how strictly an environment confines its apps, or what its previews copy
      description: Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateEnvironmentRequest'}
      responses:
        '200':
          description: The environment as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteEnvironment
      tags: [Projects]
      summary: Delete an environment and everything in it
      description: Admin. Its namespace is removed from the cluster.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}/clone:
    parameters:
      - $ref: '#/components/parameters/envID'
    post:
      operationId: cloneEnvironment
      tags: [Projects]
      summary: Copy an environment into a new one beside it
      description: >-
        Member. The same apps, settings, variables, files, processes and
        schedules, every secret resealed for the copy, and a new, empty
        database of each kind linked the same way. A database's data, a
        volume's contents, custom domains and public ports stay with the
        original, and the copy does not deploy on push until that is turned
        on. A preview cannot be cloned.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CloneEnvironmentRequest'}
      responses:
        '201':
          description: The new environment, what was made in it, and what was left behind.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClonedEnvironment'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}/quota:
    parameters:
      - $ref: '#/components/parameters/envID'
    get:
      operationId: environmentQuota
      tags: [Projects]
      summary: How much of an environment's ceiling is used
      responses:
        '200':
          description: Each limit and what has been used against it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentQuota'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}/apps:
    parameters:
      - $ref: '#/components/parameters/envID'
    get:
      operationId: listApps
      tags: [Apps]
      summary: The apps in an environment
      responses:
        '200':
          description: The apps.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createApp
      tags: [Apps]
      summary: Create an app
      description: >-
        Member. From a Git repository, an image, or code sent afterwards with
        `skifity up`. Variables, databases and processes given here exist
        before the first deploy, so the app never starts once without them.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAppRequest'}
      responses:
        '201':
          description: The app, and whatever was made with it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedApp'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}/stack:
    parameters:
      - $ref: '#/components/parameters/envID'
    post:
      operationId: createStack
      tags: [Apps]
      summary: Create an app for each service of a Compose file
      description: Member. All of them or none. Up to twenty services.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StackRequest'}
      responses:
        '201':
          description: The apps, and what was changed on the way.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedStack'}
        default: {$ref: '#/components/responses/Error'}

  /api/environments/{envID}/databases:
    parameters:
      - $ref: '#/components/parameters/envID'
    get:
      operationId: listDatabases
      tags: [Databases]
      summary: The databases in an environment
      responses:
        '200':
          description: The databases.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatabaseList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDatabase
      tags: [Databases]
      summary: Create a managed database
      description: Member. Its operator is installed on first use. It answers at once, while the database is still being made.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDatabaseRequest'}
      responses:
        '202':
          description: The database, being created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Database'}
        default: {$ref: '#/components/responses/Error'}

  # --- apps ---

  /api/apps/{appID}:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getApp
      tags: [Apps]
      summary: An app
      responses:
        '200':
          description: The app, with its deploy lock and its maintenance notice when it has either.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppDetail'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateApp
      tags: [Apps]
      summary: Change an app's settings
      description: >-
        Member. Only the fields sent change. A runtime setting is applied by a
        rollout and never rebuilds the app.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAppRequest'}
      responses:
        '200':
          description: The app as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/App'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteApp
      tags: [Apps]
      summary: Delete an app
      description: Member. Its objects are removed from the cluster.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/status:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appStatus
      tags: [Apps]
      summary: Whether an app is running, its instances and its addresses
      description: A cluster that cannot be reached is phase unknown, not an error.
      responses:
        '200':
          description: The app's live state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppRuntimeStatus'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/metrics:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appMetrics
      tags: [Apps]
      summary: An app's usage and requests over time
      parameters:
        - $ref: '#/components/parameters/metricsRange'
      responses:
        '200':
          description: >-
            CPU, memory, readiness and restarts, and the requests that reached the app through the
            ingress, in at most 120 buckets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppMetrics'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/alerts:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getAppAlerts
      tags: [Apps]
      summary: The thresholds an app is watched against
      responses:
        '200':
          description: The thresholds, and which are going off now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppAlerts'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setAppAlerts
      tags: [Apps]
      summary: Change an app's thresholds
      description: >-
        Member. Memory and CPU are a percentage from 50 to 100, restarts from 1 to 100, server errors a
        percentage from 1 to 100; 0 turns any of them off. server_errors_pct may be left out, and then
        keeps the value it had.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppAlerts'}
      responses:
        '200':
          description: The thresholds as they are now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppAlerts'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/firewall:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getFirewall
      tags: [Apps]
      summary: The rules in front of an app
      responses:
        '200':
          description: The rules, and whether they can be enforced.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Firewall'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setFirewall
      tags: [Apps]
      summary: Replace the rules in front of an app
      description: Admin. A rule on a visitor's country or network is refused while those lookups are switched off.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetFirewallRequest'}
      responses:
        '200':
          description: The rules as they are now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Firewall'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/password:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getPassword
      tags: [Apps]
      summary: Whether an app asks visitors for a password
      responses:
        '200':
          description: The username, never the password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppPassword'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setPassword
      tags: [Apps]
      summary: Put an app behind a username and password
      description: Admin. HTTP basic authentication in front of every domain the app has.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetAppPasswordRequest'}
      responses:
        '200':
          description: The protection as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppPassword'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removePassword
      tags: [Apps]
      summary: Take an app out from behind its password
      description: Admin.
      responses:
        '200':
          description: The protection as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppPassword'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/deploy:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: deployApp
      tags: [Deployments]
      summary: Deploy an app
      description: >-
        Member. It answers at once with the deployment; follow it with the
        event stream or its logs. When nothing that goes into the image has
        changed, it rolls out without building.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeployRequest'}
      responses:
        '202':
          description: The deployment, queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/lock:
    parameters:
      - $ref: '#/components/parameters/appID'
    put:
      operationId: lockDeploys
      tags: [Deployments]
      summary: Stop every deploy and rollback of an app
      description: Member. Until somebody unlocks it, from anywhere, pushes included. A reason is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 200, description: 'Why, so whoever finds it locked knows who to ask.'}
      responses:
        '200':
          description: The lock.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeployLock'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: unlockDeploys
      tags: [Deployments]
      summary: Let an app deploy again
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/template:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getAppTemplate
      tags: [Templates]
      summary: Which template an app came from, and whether it has a newer image
      responses:
        '200':
          description: The template, or from_template false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppTemplateStatus'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/template/update:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: updateAppTemplate
      tags: [Templates]
      summary: Move an app to its template's current image
      description: >-
        Member. The app's volumes and linked databases are backed up first,
        unless skip_backup, and the deploy follows in the background once they
        have finished.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateUpdateRequest'}
      responses:
        '200':
          description: Nothing to back up, so the deploy has started.
          content:
            application/json:
              schema:
                type: object
                required: [deployment]
                properties:
                  deployment: {$ref: '#/components/schemas/Deployment'}
        '202':
          description: The backups that are running first.
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items: {type: string, description: 'A backup id.'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/maintenance:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getMaintenance
      tags: [Apps]
      summary: Whether visitors see a maintenance notice
      responses:
        '200':
          description: The notice, when there is one, and the addresses that still reach the app.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: startMaintenance
      tags: [Apps]
      summary: Show visitors a notice instead of the app
      description: Member. The app keeps running, and the addresses allowed still reach it. It needs a domain and a deployed version.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceRequest'}
      responses:
        '200':
          description: The notice as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceStatus'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: endMaintenance
      tags: [Apps]
      summary: Show visitors the app again
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/source:
    parameters:
      - $ref: '#/components/parameters/appID'
    put:
      operationId: uploadSource
      tags: [Deployments]
      summary: Send the code of an app that has no repository
      description: >-
        Member. What `skifity up` sends: the folder as a .tar.gz. Only for an
        app whose source is upload. The next deploy builds it.
      requestBody:
        required: true
        content:
          application/gzip:
            schema: {type: string, contentMediaType: application/gzip}
      responses:
        '201':
          description: What was stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSummary'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/deployments:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listDeployments
      tags: [Deployments]
      summary: An app's deployment history
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        '200':
          description: Newest first, each saying whether it can still be rolled back to.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentList'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/deployments/{deploymentID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/deploymentID'
    get:
      operationId: getDeployment
      tags: [Deployments]
      summary: A deployment
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/deployments/{deploymentID}/logs:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/deploymentID'
    get:
      operationId: deploymentLogs
      tags: [Deployments]
      summary: A deployment's build output
      description: Ask again with since set to the last seq to read on; finished says when to stop.
      parameters:
        - {name: since, in: query, description: 'Only lines after this seq.', schema: {type: integer, default: 0}}
        - {name: limit, in: query, description: 'At most this many lines; 0 is all of them.', schema: {type: integer, default: 0}}
      responses:
        '200':
          description: The lines, and whether there will be more.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentLogs'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/deployments/{deploymentID}/cancel:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/deploymentID'
    post:
      operationId: cancelDeployment
      tags: [Deployments]
      summary: Stop a build or rollout that is under way
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/rollback/{deploymentID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/deploymentID'
    post:
      operationId: rollback
      tags: [Deployments]
      summary: Go back to a previous version
      description: >-
        Member. Restores that version's image and the settings it ran with.
        Variables, domains and volumes stay as they are now; the plan route
        says exactly what changes.
      responses:
        '202':
          description: The rollback, as a new deployment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/rollback/{deploymentID}/plan:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/deploymentID'
    get:
      operationId: rollbackPlan
      tags: [Deployments]
      summary: What rolling back to a version would change
      responses:
        '200':
          description: Each setting it would put back, from what to what, and what it leaves alone.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RollbackPlan'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/promote:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: promoteTargets
      tags: [Deployments]
      summary: The same app in the project's other environments
      description: Where a version of this app could be promoted to.
      responses:
        '200':
          description: The apps a version could be promoted to.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromoteTargetList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: promote
      tags: [Deployments]
      summary: Run another environment's version of this app here
      description: >-
        Member, on this app. The image that environment built is run as it is;
        nothing is rebuilt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteRequest'}
      responses:
        '202':
          description: The deployment that runs it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/logs:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appLogs
      tags: [Apps]
      summary: An app's logs
      description: >-
        The recent lines as JSON, or with follow=true a server-sent event
        stream: one `log` event per line, its data a JSON string, and an
        `error` event if reading stops. Anything that looks like a credential
        is scrubbed from every line.
      parameters:
        - {name: follow, in: query, description: 'Keep the stream open and send lines as they come.', schema: {type: boolean}}
        - {name: previous, in: query, description: 'The container that ran before the last restart, which is where a crash is explained.', schema: {type: boolean}}
        - {name: tail, in: query, description: 'How many lines back to start.', schema: {type: integer, minimum: 1, maximum: 10000, default: 200}}
        - {name: process, in: query, description: 'One of the app''s other processes, by name. The web process when left out.', schema: {type: string}}
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppLogs'}
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/run:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: runCommand
      tags: [Apps]
      summary: Run a command once in the app's image
      description: >-
        Admin. With the app's own variables, which is where a migration runs.
        It answers as soon as the command has started; read its output from
        the run's logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {type: string}
      responses:
        '202':
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [run, note]
                properties:
                  run: {type: string, description: 'The run''s name, for its logs.'}
                  note: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/runs/{runID}/logs:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/runID'
    get:
      operationId: runLogs
      tags: [Apps]
      summary: A one-off command's output
      parameters:
        - {name: follow, in: query, description: 'Wait for the command to finish, and say how it ended.', schema: {type: boolean}}
      responses:
        '200':
          description: The output.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunLogs'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/jobs:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listAppJobs
      tags: [Apps]
      summary: An app's scheduled commands
      responses:
        '200':
          description: The scheduled commands.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppJobList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAppJob
      tags: [Apps]
      summary: Run a command on a schedule
      description: Admin. Five cron fields, in UTC.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppJobRequest'}
      responses:
        '201':
          description: The scheduled command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppJob'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/jobs/{jobID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/jobID'
    patch:
      operationId: updateAppJob
      tags: [Apps]
      summary: Change a scheduled command
      description: >-
        Admin. The whole scheduled command is sent again, not only what
        changes, and enabled is true when it is left out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppJobRequest'}
      responses:
        '200':
          description: The scheduled command as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppJob'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteAppJob
      tags: [Apps]
      summary: Remove a scheduled command
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/restart:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: restartApp
      tags: [Apps]
      summary: Restart an app's instances, one at a time
      description: Member. Nothing else changes.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/variables:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listVariables
      tags: [Variables]
      summary: An app's variables
      description: A secret's value, and its preview value, are never returned.
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariableList'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setVariable
      tags: [Variables]
      summary: Set one variable
      description: >-
        Member. A runtime variable is rolled out; a build-time one takes effect
        at the next build, and the answer says which.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetVariableRequest'}
      responses:
        '200':
          description: The variable, without its value.
          content:
            application/json:
              schema:
                type: object
                required: [variable, requires_rebuild]
                properties:
                  variable: {$ref: '#/components/schemas/Variable'}
                  requires_rebuild: {type: boolean}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/variables/batch:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: changeVariables
      tags: [Variables]
      summary: Set and remove several variables at once
      description: Member. All of them or none, and one rollout for the lot. A pasted .env, or `skifity env import`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeVariablesRequest'}
      responses:
        '200':
          description: What was set, without values, and what was removed.
          content:
            application/json:
              schema:
                type: object
                required: [set, unset, requires_rebuild]
                properties:
                  set:
                    type: array
                    items: {$ref: '#/components/schemas/Variable'}
                  unset:
                    type: [array, 'null']
                    items: {type: string}
                  requires_rebuild: {type: boolean}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/variables/refresh:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: refreshVariables
      tags: [Variables]
      summary: Read an app's variables from their secret managers again
      description: >-
        Member. When any changed since it last reached the app, the app is
        rolled out with the new values; when one the build reads changed, the
        running version is built again with it, and the answer says which.
        Nothing changes when nothing did. A variable that cannot be read fails
        the refresh with a problem naming it, and the app keeps what it has.
      responses:
        '200':
          description: What changed, by name, and what was done.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VariablesRefresh'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/variables/{key}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/key'
    delete:
      operationId: deleteVariable
      tags: [Variables]
      summary: Remove a variable
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/variables/{key}/preview:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/key'
    put:
      operationId: setVariablePreview
      tags: [Variables]
      summary: Say what a pull request's preview gets for a variable
      description: >-
        Member. The app's own value, a value of its own (the test key rather
        than the live one), or nothing at all. The app itself does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VariablePreviewRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/domains:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listDomains
      tags: [Domains]
      summary: The hostnames an app answers on
      responses:
        '200':
          description: The domains, each of your own with where its DNS has to point.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addDomain
      tags: [Domains]
      summary: Add a domain
      description: >-
        Member. A certificate is requested once its DNS points here. The panel's own hostname is refused.
        A domain whose DNS does not point here yet is still added: the answer says what its DNS said.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddDomainRequest'}
      responses:
        '201':
          description: The domain, pending until it is served, and what its DNS said when it was added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddedDomain'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/domains/{domainID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/domainID'
    delete:
      operationId: deleteDomain
      tags: [Domains]
      summary: Remove a domain
      description: >-
        Member. The automatic domain cannot be removed. A domain that
        redirected to this one serves the app again.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: setDomainRedirect
      tags: [Domains]
      summary: Redirect a domain to another of the app's, or stop
      description: >-
        Member. A permanent (308) redirect, path and query kept, to another
        hostname of the same app that serves it; empty serves the app on this
        hostname again. A redirect to a redirect, or redirecting a hostname
        others redirect to, is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_to]
              additionalProperties: false
              properties:
                redirect_to: {type: string, description: 'Another of the app''s hostnames, or empty.'}
      responses:
        '200':
          description: The domain as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/previews:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: startPreview
      tags: [Deployments]
      summary: Preview a branch without a pull request
      description: >-
        Member. The same preview a pull request from the branch would get — a
        copy of the app in a preview environment of its own, with its own
        databases — built from the branch's tip. Asked again, the same preview
        is deployed again; a pull request opened from the branch later updates
        it. Only an app built from a Git repository, and not a preview itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewBranchRequest'}
      responses:
        '201':
          description: The preview and the deployment building it.
          content:
            application/json:
              schema:
                type: object
                required: [environment_id, app_id, deployment_id]
                properties:
                  environment_id: {type: string}
                  app_id: {type: string, description: 'The preview''s copy of the app.'}
                  deployment_id: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/previews/close:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: closePreview
      tags: [Deployments]
      summary: Remove a branch's preview
      description: Member. As deleting the branch does, databases and all.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreviewBranchRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/domains/{domainID}/check:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/domainID'
    post:
      operationId: checkDomainDNS
      tags: [Domains]
      summary: Check whether a domain's DNS points here
      description: >-
        Member. Looks the hostname's A, AAAA and CNAME records up now and compares them with the cluster's
        addresses. No record is an answer (missing); a resolver that does not answer is
        domain.dns_lookup_failed. Nothing is changed either way.
      responses:
        '200':
          description: What the hostname's DNS says, against where it has to point.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSCheck'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/scaling:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getScaling
      tags: [Scaling]
      summary: How many instances an app runs
      responses:
        '200':
          description: The scaling settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scaling'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setScaling
      tags: [Scaling]
      summary: Change how many instances an app runs
      description: >-
        Member. Only the fields sent change. Scale to zero installs KEDA on
        first use. With more than one instance, the answer carries what may
        break.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetScalingRequest'}
      responses:
        '200':
          description: The settings as they are now, and the scaling risks found.
          content:
            application/json:
              schema:
                type: object
                required: [scaling, warnings]
                properties:
                  scaling: {$ref: '#/components/schemas/Scaling'}
                  warnings:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/ScalingFinding'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/scaling/readiness:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: scalingReadiness
      tags: [Scaling]
      summary: What would break if an app ran more than one instance
      responses:
        '200':
          description: What was found. An empty list is an app with nothing known to break.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScalingFindingList'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/processes:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listProcesses
      tags: [Scaling]
      summary: An app's other processes
      description: The workers and clocks that run beside it on the same image.
      responses:
        '200':
          description: The processes, with how many instances are ready when the cluster says.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessList'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/processes/{process}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/process'
    put:
      operationId: setProcess
      tags: [Scaling]
      summary: Add a process, or change its command or instances
      description: Member. Up to ten per app.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetProcessRequest'}
      responses:
        '200':
          description: The process as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppProcess'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteProcess
      tags: [Scaling]
      summary: Stop and remove a process
      description: Member.
      responses:
        '204':
          description: Removed.
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/jobs/{jobID}/run:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/jobID'
    post:
      operationId: runAppJobNow
      tags: [Apps]
      summary: Run a scheduled command now, outside its schedule
      description: >-
        Admin. Runs the command the schedule holds, as a one-off run; a command
        in the request is ignored. Follow its output at
        /api/apps/{appID}/runs/{runID}/logs.
      responses:
        '202':
          description: The run has started.
          content:
            application/json:
              schema:
                type: object
                required: [run, note]
                properties:
                  run: {type: string}
                  note: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/ports:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listPorts
      tags: [Domains]
      summary: The ports an app takes connections on that are not HTTP
      description: Viewer. Each is open on every server, at its public port.
      responses:
        '200':
          description: The ports, with the team's servers' addresses at each.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppPortList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: addPort
      tags: [Domains]
      summary: Open a TCP or UDP port on every server
      description: >-
        Member. A public port and protocol are open for one app on the whole
        panel; one that is taken is refused. The firewall does not apply to
        these, because it reads HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddPortRequest'}
      responses:
        '201':
          description: The port, and where it is reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppPortWithAddresses'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/ports/{portID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/portID'
    delete:
      operationId: deletePort
      tags: [Domains]
      summary: Close a public port
      description: Member.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/files:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listFiles
      tags: [Variables]
      summary: The files an app reads
      description: Viewer. Each is mounted read-only at its path in every container the app runs. A secret file's content is never sent back.
      responses:
        '200':
          description: The files, by path.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppFileList'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setFile
      tags: [Variables]
      summary: Save a file at a path, or replace the one there
      description: >-
        Member. Rolls the app out, never rebuilds it. At most 256 KiB, and an
        app's files together at most 900 KiB. Leaving is_secret out keeps a
        secret file secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetFileRequest'}
      responses:
        '200':
          description: The file as saved, without its content.
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: {$ref: '#/components/schemas/AppFile'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/files/{fileID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/fileID'
    delete:
      operationId: deleteFile
      tags: [Variables]
      summary: Remove a file
      description: Member. Rolls the app out without it.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: listVolumes
      tags: [Volumes]
      summary: An app's volumes
      responses:
        '200':
          description: The volumes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolumeList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createVolume
      tags: [Volumes]
      summary: Attach a volume
      description: Member.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVolumeRequest'}
      responses:
        '201':
          description: The volume.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Volume'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes/{volumeID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/volumeID'
    delete:
      operationId: deleteVolume
      tags: [Volumes]
      summary: Delete a volume and what is on it
      description: Admin.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes/{volumeID}/backups:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/volumeID'
    get:
      operationId: listVolumeBackups
      tags: [Backups]
      summary: A volume's backups
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        '200':
          description: The backups, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createVolumeBackup
      tags: [Backups]
      summary: Back a volume up now
      description: Member. Needs backup storage under Settings.
      responses:
        '202':
          description: The backup, under way.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backup'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes/{volumeID}/backups/{backupID}/verify:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/volumeID'
      - $ref: '#/components/parameters/backupID'
    post:
      operationId: verifyVolumeBackup
      tags: [Backups]
      summary: Check that a volume backup can be read back
      description: Member. It is downloaded, opened and read through in the background, and the outcome is recorded on it.
      responses:
        '202': {$ref: '#/components/responses/VerificationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes/{volumeID}/restore/{backupID}:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/volumeID'
      - $ref: '#/components/parameters/backupID'
    post:
      operationId: restoreVolumeBackup
      tags: [Backups]
      summary: Put a backup back into the volume it came from
      description: Admin. The app is stopped while it runs.
      parameters:
        - $ref: '#/components/parameters/overwrite'
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/volumes/{volumeID}/backup-policy:
    parameters:
      - $ref: '#/components/parameters/appID'
      - $ref: '#/components/parameters/volumeID'
    get:
      operationId: getVolumeBackupPolicy
      tags: [Backups]
      summary: A volume's backup schedule
      description: A volume with no schedule answers the defaults, disabled.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setVolumeBackupPolicy
      tags: [Backups]
      summary: Change a volume's backup schedule
      description: Admin. Turning it on checks that backup storage works first.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetBackupPolicyRequest'}
      responses:
        '200':
          description: The schedule as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/advanced:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appAdvanced
      tags: [Apps]
      summary: An app's Kubernetes objects
      description: Member. The one place the panel shows them, as YAML.
      responses:
        '200':
          description: The namespace, the object name and the manifests.
          content:
            application/json:
              schema:
                type: object
                required: [namespace, name, manifests]
                properties:
                  namespace: {type: string}
                  name: {type: string}
                  manifests: {type: string, description: 'Multi-document YAML.'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/vulnerabilities:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: getVulnerabilities
      tags: [Apps]
      summary: The known vulnerabilities in the image an app runs
      description: >-
        Viewer. The newest report on the app's image, with a count per severity and the most severe
        findings, and the newest scan when it is still running or failed. Images are scanned with Trivy
        when they are built or deployed and again on a daily schedule.
      responses:
        '200':
          description: The report, and how scanning is set up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VulnerabilityReport'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/vulnerabilities/scan:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: scanApp
      tags: [Apps]
      summary: Scan the image an app runs now
      description: >-
        Member. Queues a scan of the image of the app's newest successful deployment and answers at once;
        read the report from the route above when it has finished. When a scan of the app is already
        queued or running, that one is answered instead of starting another. scan.disabled when scanning
        is switched off, scan.no_image for an app that has never been deployed.
      responses:
        '202':
          description: The scan, queued or already running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageScan'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/drift:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appDrift
      tags: [Apps]
      summary: What was changed in the cluster outside the panel
      description: >-
        Viewer. Reads the cluster now and compares the app's objects with what
        the panel applies, on the fields the panel sets. A field somebody else
        changed says who changed it, from the object's managed fields. A
        Secret's values are never sent.
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriftReport'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setDriftRepair
      tags: [Apps]
      summary: Put the app back by itself when it is changed outside the panel
      description: Member. Off unless turned on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto_repair]
              properties:
                auto_repair: {type: boolean}
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                type: object
                required: [auto_repair]
                properties:
                  auto_repair: {type: boolean}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/drift/repair:
    parameters:
      - $ref: '#/components/parameters/appID'
    post:
      operationId: repairDrift
      tags: [Apps]
      summary: Put the app's objects back as the panel applies them
      description: >-
        Member. The apply a change to a variable makes: nothing is built and no
        deployment is recorded. It waits for a rollout when the change was to
        the running version, and answers the comparison afterwards.
      responses:
        '200':
          description: The comparison, after putting it back.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriftReport'}
        default: {$ref: '#/components/responses/Error'}

  /api/apps/{appID}/events:
    parameters:
      - $ref: '#/components/parameters/appID'
    get:
      operationId: appEvents
      tags: [Apps]
      summary: What Kubernetes said about the app's objects
      description: >-
        Viewer. The events of the app's pods, ReplicaSets, Deployments,
        volumes, Ingress and autoscaler, newest first, with repeats folded into
        a count and the common warnings explained. Kubernetes keeps them for
        about an hour.
      parameters:
        - $ref: '#/components/parameters/eventType'
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectEventList'}
        default: {$ref: '#/components/responses/Error'}

  # --- databases ---

  /api/databases/{databaseID}:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    get:
      operationId: getDatabase
      tags: [Databases]
      summary: A database, and the apps linked to it
      description: Its status is refreshed from the cluster on the way.
      responses:
        '200':
          description: The database and its links.
          content:
            application/json:
              schema:
                type: object
                required: [database, links]
                properties:
                  database: {$ref: '#/components/schemas/Database'}
                  links:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/DatabaseLink'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteDatabase
      tags: [Databases]
      summary: Delete a database and its storage
      description: Admin. Refused while an app is linked to it, unless force.
      parameters:
        - {name: force, in: query, description: 'Delete it even though apps are linked to it.', schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/credentials:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    get:
      operationId: databaseCredentials
      tags: [Databases]
      summary: How to connect to a database, password included
      description: Admin. Audited. Refused to a token with scopes.
      responses:
        '200':
          description: The connection details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatabaseCredentials'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/tunnel:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    post:
      operationId: databaseTunnel
      tags: [Databases]
      summary: A connection to the database itself, through the panel
      description: >-
        Admin. What `skifity db connect` opens. The request carries
        `Upgrade: skifity-db-tunnel`; after the switch the connection carries
        the database's own protocol in both directions. It is closed when the
        credential that opened it stops being allowed, and after twelve hours.
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: {type: string, const: skifity-db-tunnel}
      responses:
        '101':
          description: Switched. The connection is now the database's.
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/link:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    post:
      operationId: linkDatabase
      tags: [Databases]
      summary: Give an app the database's connection string
      description: Member, on both. As a secret variable, in the same environment only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkDatabaseRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/link/{appID}:
    parameters:
      - $ref: '#/components/parameters/databaseID'
      - $ref: '#/components/parameters/appID'
    delete:
      operationId: unlinkDatabase
      tags: [Databases]
      summary: Take the connection string away from an app
      description: Member, on both.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/backups:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    get:
      operationId: listBackups
      tags: [Backups]
      summary: A database's backups
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        '200':
          description: The backups, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBackup
      tags: [Backups]
      summary: Back a database up now
      description: >-
        Member. Needs backup storage under Settings. Refused with backup.not_offered for an engine Skifity
        does not back up (dragonfly, clickhouse and memcached; GET /api/database-engines says which).
      responses:
        '202':
          description: The backup, under way.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backup'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/backups/{backupID}/verify:
    parameters:
      - $ref: '#/components/parameters/databaseID'
      - $ref: '#/components/parameters/backupID'
    post:
      operationId: verifyDatabaseBackup
      tags: [Backups]
      summary: Check that a database backup can be read back
      description: Member. It is downloaded, opened and read through in the background, and the outcome is recorded on it.
      responses:
        '202': {$ref: '#/components/responses/VerificationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/backup-policy:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    get:
      operationId: getBackupPolicy
      tags: [Backups]
      summary: A database's backup schedule
      description: A database with no schedule answers the defaults, disabled.
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setBackupPolicy
      tags: [Backups]
      summary: Change a database's backup schedule
      description: >-
        Admin. Turning it on checks that backup storage works first, and is refused with backup.not_offered
        for an engine Skifity does not back up.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetBackupPolicyRequest'}
      responses:
        '200':
          description: The schedule as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/restore/{backupID}:
    parameters:
      - $ref: '#/components/parameters/databaseID'
      - $ref: '#/components/parameters/backupID'
    post:
      operationId: restoreBackup
      tags: [Backups]
      summary: Put a backup back into the database it came from
      description: >-
        Admin. Only a backup that finished, of an engine Skifity backs up. A Redis or Valkey backup is
        loaded into a temporary server of the same image, which the database then replicates from until it
        holds all of it; a backup loaded by a server newer than the database is refused before anything
        changes.
      parameters:
        - $ref: '#/components/parameters/overwrite'
      responses:
        '202': {$ref: '#/components/responses/OperationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/databases/{databaseID}/events:
    parameters:
      - $ref: '#/components/parameters/databaseID'
    get:
      operationId: databaseEvents
      tags: [Databases]
      summary: What Kubernetes said about the database's objects
      description: Viewer. Its StatefulSet or cluster, their pods and their volumes, as for an app.
      parameters:
        - $ref: '#/components/parameters/eventType'
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectEventList'}
        default: {$ref: '#/components/responses/Error'}

  # --- operations ---

  /api/operations/{operationID}:
    parameters:
      - $ref: '#/components/parameters/operationID'
    get:
      operationId: getOperation
      tags: [Operations]
      summary: A long-running operation and its steps
      description: Follow it live on the event stream, under the topic operation:{id}.
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}

  /api/operations/{operationID}/cancel:
    parameters:
      - $ref: '#/components/parameters/operationID'
    post:
      operationId: cancelOperation
      tags: [Operations]
      summary: Stop an operation that is running
      description: Admin of the operation's team.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  # --- plugins ---

  /api/plugins:
    get:
      operationId: listPlugins
      tags: [Plugins]
      summary: The installed plugins
      description: Panel administrators only.
      responses:
        '200':
          description: The plugins, with their settings. A secret setting's value is never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: installPlugin
      tags: [Plugins]
      summary: Install a plugin
      description: >-
        Panel administrators, signed in; a token cannot install one. The
        permissions sent are the ones inspect showed, and the install is
        refused when the manifest now asks for anything else.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallPluginRequest'}
      responses:
        '201':
          description: The plugin, running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        default: {$ref: '#/components/responses/Error'}

  /api/plugins/store:
    get:
      operationId: storeCatalogue
      tags: [Plugins]
      summary: The plugin store's catalogue
      description: Panel administrators only. Read from the configured store, and checked against its signing key when one is set.
      responses:
        '200':
          description: The catalogue, and which of its plugins are installed here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginStoreCatalogue'}
        default: {$ref: '#/components/responses/Error'}

  /api/plugins/inspect:
    post:
      operationId: inspectPlugin
      tags: [Plugins]
      summary: Read a manifest and say what installing it would allow
      description: Panel administrators only. Nothing is installed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InspectPluginRequest'}
      responses:
        '200':
          description: The manifest and the permissions it asks for.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginInspection'}
        default: {$ref: '#/components/responses/Error'}

  /api/plugins/{pluginID}:
    parameters:
      - $ref: '#/components/parameters/pluginID'
    patch:
      operationId: updatePlugin
      tags: [Plugins]
      summary: Switch a plugin on or off, or change its settings
      description: Panel administrators, signed in; a token cannot change one.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePluginRequest'}
      responses:
        '200':
          description: The plugin as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: uninstallPlugin
      tags: [Plugins]
      summary: Remove a plugin
      description: Panel administrators, signed in. Its token is revoked and its namespace removed.
      security:
        - sessionCookie: []
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  # --- templates ---

  /api/database-engines:
    get:
      operationId: listDatabaseEngines
      tags: [Databases]
      summary: The engines a database can be
      description: >-
        Every engine, the versions offered for each and the default, the port its connection string names,
        the variable a linked app reads it from, and whether Skifity backs it up. The form to create a
        database is built from this.
      responses:
        '200':
          description: Every engine, in the order they are offered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatabaseEngineList'}
        default: {$ref: '#/components/responses/Error'}

  /api/templates:
    get:
      operationId: listTemplates
      tags: [Templates]
      summary: The one-click catalogue
      responses:
        '200':
          description: Every template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateList'}
        default: {$ref: '#/components/responses/Error'}

  /api/templates/{templateID}/icon:
    parameters:
      - $ref: '#/components/parameters/templateID'
    get:
      operationId: templateIcon
      tags: [Templates]
      summary: A template's logo
      description: >-
        Served from inside the binary, never from another site, and cached for a
        day. With catalogue, a logo of one of that team's catalogues, which the
        panel fetched from the catalogue's own host when it fetched the catalogue.
      parameters:
        - name: catalogue
          in: query
          description: The team catalogue the template is in. Left out for the built-in one.
          schema: {type: string}
      responses:
        '200':
          description: The logo.
          content:
            image/svg+xml:
              schema: {type: string}
            image/png:
              schema: {type: string, contentMediaType: image/png}
            image/webp:
              schema: {type: string, contentMediaType: image/webp}
        '404':
          description: The template has no logo. Plain text, for an img tag that cannot read an error.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/templates/{templateID}/install:
    parameters:
      - $ref: '#/components/parameters/templateID'
    post:
      operationId: installTemplate
      tags: [Templates]
      summary: Install a template into an environment
      description: >-
        Member, in the environment named in the body. Its databases are made first,
        then its apps. catalogue_id names the team catalogue the template is in; it
        is looked for among the catalogues of the environment's team, so another
        team's is not found.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallTemplateRequest'}
      responses:
        '201':
          description: What was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstalledTemplate'}
        default: {$ref: '#/components/responses/Error'}

  # --- live updates ---

  /api/events:
    get:
      operationId: eventStream
      tags: [Events]
      summary: Everything happening, as server-sent events
      description: >-
        Subscribe to the topics you may see: `team:{id}`, `operation:{id}`,
        `deployment:{id}` and `app-logs:{appId}`. Each event has an id; a
        client that reconnects with Last-Event-ID, or since, is sent what it
        missed. A `desync` event says the client fell behind and events were
        dropped, so it should read again what it shows. A comment line is sent
        every 25 seconds to keep proxies from closing the stream.
      parameters:
        - name: topics
          in: query
          required: true
          description: Comma-separated topics, such as team:team_123,deployment:dep_456.
          schema: {type: string}
        - name: since
          in: query
          description: Resume after this event id, when Last-Event-ID is not sent.
          schema: {type: integer}
        - name: Last-Event-ID
          in: header
          description: The last event id seen. A browser sends it by itself on reconnecting.
          schema: {type: string}
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  # --- the MCP server ---

  /api/mcp:
    post:
      operationId: mcp
      tags: [MCP]
      summary: Send an MCP message
      description: >-
        The same MCP server `skifity mcp` runs, over streamable HTTP, stateless.
        An API token only; a browser session is refused. Each tool call makes
        ordinary API requests with the same token, so it can do what the token
        can and nothing else. The request accepts both application/json and
        text/event-stream.
      security:
        - bearerToken: []
      requestBody:
        required: true
        description: A JSON-RPC 2.0 message.
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: The JSON-RPC answer.
          content:
            application/json:
              schema: {type: object}
        '202':
          description: A notification or a response was received; there is nothing to answer.
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: mcpStream
      tags: [MCP]
      summary: Ask for a standing stream from the MCP server
      description: >-
        The server is stateless and holds no stream open, so it answers 405,
        which is how the MCP protocol has a server say so. An API token only.
      security:
        - bearerToken: []
      responses:
        '405':
          description: No standing stream. Every message is a POST.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: mcpEndSession
      tags: [MCP]
      summary: End an MCP session
      description: >-
        The server is stateless and keeps no session to end, so it answers 405.
        An API token only.
      security:
        - bearerToken: []
      responses:
        '405':
          description: There is no session to end.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  # --- panel administration ---

  /api/settings:
    get:
      operationId: listSettings
      tags: [Settings]
      summary: Every panel-wide setting
      description: Panel administrators only. A secret setting says whether it is set, never its value.
      responses:
        '200':
          description: The settings, with what the page needs to draw each one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingList'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Change panel-wide settings
      description: Panel administrators only. An empty value clears a setting.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSettingsRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/components:
    get:
      operationId: listComponents
      tags: [Settings]
      summary: The optional parts of the cluster, and whether each is installed
      description: Panel administrators only.
      responses:
        '200':
          description: The components.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComponentList'}
        default: {$ref: '#/components/responses/Error'}

  /api/components/{name}/install:
    parameters:
      - $ref: '#/components/parameters/componentName'
    post:
      operationId: installComponent
      tags: [Settings]
      summary: Install a component
      description: Panel administrators only. A component installed with Helm is refused, with the documentation for it.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/components/{name}/upgrade:
    parameters:
      - $ref: '#/components/parameters/componentName'
    post:
      operationId: upgradeComponent
      tags: [Settings]
      summary: Upgrade an installed component to the version this panel installs
      description: Panel administrators only.
      responses:
        '200':
          description: The component as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterComponent'}
        default: {$ref: '#/components/responses/Error'}

  /api/k3s/upgrade:
    get:
      operationId: k3sUpgradePlan
      tags: [Settings]
      summary: The k3s version of every server, and what an upgrade would do
      description: Panel administrators only.
      parameters:
        - {name: version, in: query, description: 'A k3s release to plan an upgrade to, such as v1.31.4+k3s1.', schema: {type: string}}
      responses:
        '200':
          description: The servers, the releases, and the plan when a version was asked about.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/K3sUpgradeOverview'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: startK3sUpgrade
      tags: [Settings]
      summary: Upgrade k3s on every server, one at a time
      description: >-
        Panel administrators only. Refused while anything blocks it, which
        includes having no backup of the panel from the last day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, description: 'The k3s release, such as v1.31.4+k3s1.'}
      responses:
        '200':
          description: Every server already runs that version; nothing was started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/K3sUpgradePlan'}
        '202':
          description: The upgrade has started, in this order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/K3sUpgradePlan'}
        default: {$ref: '#/components/responses/Error'}

  /api/security/rotate-key:
    post:
      operationId: rotateMasterKey
      tags: [Settings]
      summary: Rotate the master key and rewrap every secret
      description: >-
        Panel administrators, signed in within the last few minutes; a token
        cannot. The old key is kept when any secret failed to rewrap, so that
        secret can still be read.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The new key, how many secrets moved to it, and the new recovery key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KeyRotation'}
        default: {$ref: '#/components/responses/Error'}

  /api/security/recovery-key:
    get:
      operationId: recoveryKey
      tags: [Settings]
      summary: The recovery key
      description: >-
        Panel administrators, signed in within the last few minutes; a token
        cannot. It is the master key: anybody with it can open every secret the
        panel stores. Audited.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The recovery key.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_key, warning]
                properties:
                  recovery_key: {type: string}
                  warning: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /api/security/recovery-key/saved:
    post:
      operationId: recoveryKeySaved
      tags: [Settings]
      summary: Say the recovery key has been kept somewhere safe
      description: Panel administrators only. The panel stops asking.
      responses:
        '200': {$ref: '#/components/responses/OK'}
        default: {$ref: '#/components/responses/Error'}

  /api/upgrade:
    get:
      operationId: upgradeStatus
      tags: [Settings]
      summary: The version running
      description: Panel administrators only. The panel does not check for updates; nothing is sent anywhere.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeStatus'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: upgrade
      tags: [Settings]
      summary: Upgrade the panel
      description: >-
        Panel administrators only. The panel's own database is copied first,
        then its image is changed and it restarts. The answer, sent before it
        stops, says how to go back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: string, description: 'A release tag, such as v1.2.0.'}
      responses:
        '202':
          description: The upgrade has started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpgradeStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/panel/backups:
    get:
      operationId: listPanelBackups
      tags: [Backups]
      summary: Backups of the panel's own database
      description: Panel administrators only. The thirty newest.
      responses:
        '200':
          description: The backups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Backup'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: backUpPanel
      tags: [Backups]
      summary: Back the panel's own database up now
      description: Panel administrators only. It answers when the copy is stored.
      responses:
        '201':
          description: The backup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backup'}
        default: {$ref: '#/components/responses/Error'}

  /api/panel/backups/{backupID}/verify:
    parameters:
      - $ref: '#/components/parameters/backupID'
    post:
      operationId: verifyPanelBackup
      tags: [Backups]
      summary: Check that a backup of the panel can be read back
      description: Panel administrators only.
      responses:
        '202': {$ref: '#/components/responses/VerificationStarted'}
        default: {$ref: '#/components/responses/Error'}

  /api/metrics:
    get:
      operationId: metrics
      tags: [Settings]
      summary: The panel's own metrics, for Prometheus
      description: Panel administrators only. Scrape it with an API token.
      responses:
        '200':
          description: The Prometheus text exposition format.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

components:

  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: skf_...
      description: >-
        An API token, made in the panel under Account, then API tokens. It is
        made for one team, can do no more than its owner's role in that team,
        and may be narrowed further with scopes. It needs no CSRF header.
    sessionCookie:
      type: apiKey
      in: cookie
      name: skifity_session
      description: >-
        A browser session, set by signing in. On HTTPS the cookie is
        `__Host-skifity_session`. A request that changes something also sends
        the session's CSRF token, which signing in returns as csrf_token, in
        the X-Skifity-CSRF header.

  parameters:
    teamID: {name: teamID, in: path, required: true, description: 'A team''s id.', schema: {type: string}}
    userID: {name: userID, in: path, required: true, description: 'A user''s id.', schema: {type: string}}
    invitationID: {name: invitationID, in: path, required: true, description: 'An invitation''s id.', schema: {type: string}}
    invitationToken: {name: token, in: path, required: true, description: 'The token from the invitation link.', schema: {type: string, minLength: 20}}
    sessionID: {name: sessionID, in: path, required: true, description: 'A session''s id.', schema: {type: string}}
    tokenID: {name: tokenID, in: path, required: true, description: 'An API token''s id.', schema: {type: string}}
    passkeyID: {name: passkeyID, in: path, required: true, description: 'A passkey''s id.', schema: {type: string}}
    projectID: {name: projectID, in: path, required: true, description: 'A project''s id.', schema: {type: string}}
    envID: {name: envID, in: path, required: true, description: 'An environment''s id.', schema: {type: string}}
    fileID: {name: fileID, in: path, required: true, description: 'A file''s id.', schema: {type: string}}
    registryID: {name: registryID, in: path, required: true, description: 'A registry credential''s id.', schema: {type: string}}
    certificateID: {name: certificateID, in: path, required: true, description: 'A team certificate''s id.', schema: {type: string}}
    portID: {name: portID, in: path, required: true, description: 'A public port''s id.', schema: {type: string}}
    appID: {name: appID, in: path, required: true, description: 'An app''s id.', schema: {type: string}}
    deploymentID: {name: deploymentID, in: path, required: true, description: 'A deployment''s id.', schema: {type: string}}
    domainID: {name: domainID, in: path, required: true, description: 'A domain''s id.', schema: {type: string}}
    volumeID: {name: volumeID, in: path, required: true, description: 'A volume''s id.', schema: {type: string}}
    backupID: {name: backupID, in: path, required: true, description: 'A backup''s id.', schema: {type: string}}
    jobID: {name: jobID, in: path, required: true, description: 'A scheduled command''s id.', schema: {type: string}}
    runID: {name: runID, in: path, required: true, description: 'A one-off command''s name, as starting it returned.', schema: {type: string}}
    process:
      name: process
      in: path
      required: true
      description: A process's name, such as worker. Lower case letters, digits and hyphens.
      schema: {type: string}
    key: {name: key, in: path, required: true, description: 'A variable''s name.', schema: {type: string}}
    databaseID: {name: databaseID, in: path, required: true, description: 'A database''s id.', schema: {type: string}}
    serverID: {name: serverID, in: path, required: true, description: 'A server''s id.', schema: {type: string}}
    operationID: {name: operationID, in: path, required: true, description: 'An operation''s id.', schema: {type: string}}
    sourceID: {name: sourceID, in: path, required: true, description: 'A Git connection''s id.', schema: {type: string}}
    channelID: {name: channelID, in: path, required: true, description: 'A notification channel''s id.', schema: {type: string}}
    connectionID: {name: connectionID, in: path, required: true, description: 'A secret manager connection''s id, or its name.', schema: {type: string}}
    pluginID: {name: pluginID, in: path, required: true, description: 'A plugin''s id, reverse-DNS, such as com.example.backup.', schema: {type: string}}
    templateID: {name: templateID, in: path, required: true, description: 'A template''s id, such as uptime-kuma.', schema: {type: string}}
    catalogueID: {name: catalogueID, in: path, required: true, description: 'A team template catalogue''s id.', schema: {type: string}}
    componentName: {name: name, in: path, required: true, description: 'A component''s name, such as keda.', schema: {type: string}}
    metricsRange:
      name: range
      in: query
      description: How far back to look.
      schema: {type: string, enum: [1h, 6h, 24h, 72h], default: 6h}
    eventType:
      name: type
      in: query
      description: Keep only the events of this type, in any case. Left out, both.
      schema: {type: string, enum: [Normal, Warning]}
    overwrite:
      name: overwrite
      in: query
      description: Replace what is there now. A restore is refused over existing data without it.
      schema: {type: boolean}

  responses:
    Error:
      description: >-
        What went wrong, what it means and what to do. The code is stable; the
        sentences are English, and args carries the values in them so the
        panel can say the same thing in another language.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    OK:
      description: Done. There is nothing else to say.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OK'}
    OperationStarted:
      description: The work has started. Follow the operation it returns.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Operation'}
    VerificationStarted:
      description: The check has started. Its outcome is recorded on the backup as verified_at or verify_error.
      content:
        application/json:
          schema:
            type: object
            required: [backup_id]
            properties:
              backup_id: {type: string}

  schemas:

    # --- the shapes every answer shares ---

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Problem'}

    Problem:
      type: object
      description: A failure with its explanation. See internal/errdoc.
      required: [code, title, severity, retryable, at]
      properties:
        code: {type: string, description: 'Stable and machine-readable, such as deploy.build_failed.'}
        title: {type: string}
        cause: {type: string, description: 'What actually went wrong.'}
        impact: {type: string, description: 'What is and is not working because of it.'}
        fix: {type: string, description: 'What to do about it.'}
        args:
          type: object
          description: The values in each sentence, in order, for a translation to put in the same places.
          properties:
            title: {type: array, items: {type: string}}
            cause: {type: array, items: {type: string}}
            impact: {type: array, items: {type: string}}
            fix: {type: array, items: {type: string}}
        docs_path: {type: string, description: 'A page of the documentation the panel serves, such as /docs/troubleshooting#a-deployment-failed.'}
        severity: {type: string, enum: [error, warning, info]}
        retryable: {type: boolean, description: 'Whether trying again might work.'}
        context:
          type: object
          description: Structured detail, such as the host or the exit code. Never a secret.
          additionalProperties: {type: string}
        at: {type: string, format: date-time}

    OK:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean, const: true}

    Role:
      type: string
      enum: [owner, admin, member, viewer]
      description: A role in a team. Each can do everything the ones after it can.

    # --- the panel ---

    Health:
      type: object
      required: [status, product, version, commit, uptime_seconds, checks]
      properties:
        status: {type: string, enum: [ok, degraded]}
        product: {type: string}
        version: {type: string}
        commit: {type: string}
        uptime_seconds: {type: integer}
        checks: {type: object, description: 'The database and the number of event subscribers.'}

    Ready:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not-ready]}
        checks: {type: object, description: 'The database and the cluster, each with ok and an error when it is not.'}

    Meta:
      type: object
      required: [product, version, commit, tagline, locales, dev_mode, sso, server_now, cli_platform, cli_platforms, passkeys]
      properties:
        product: {type: string}
        version: {type: string}
        commit: {type: string}
        tagline: {type: string}
        locales:
          type: array
          items: {type: string}
        dev_mode: {type: boolean}
        sso:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean}
            label: {type: string, description: 'What the sign-in button says.'}
        server_now: {type: string, format: date-time}
        cli_platform: {type: string, description: 'The platform this binary was built for, such as linux/amd64.'}
        cli_platforms:
          type: array
          description: Every platform the CLI can be downloaded for from this panel, its own first.
          items: {type: string}
        password_reset: {type: boolean, description: 'Whether the sign-in page can offer a reset link by email.'}
        passkeys:
          type: object
          required: [available]
          properties:
            available: {type: boolean, description: 'Whether a browser would offer passkeys at this panel''s address: HTTPS at a domain, or localhost.'}

    SetupStatus:
      type: object
      required: [needs_setup, product, version]
      properties:
        needs_setup: {type: boolean}
        product: {type: string}
        version: {type: string}

    SetupRequest:
      type: object
      required: [token, email, password]
      additionalProperties: false
      properties:
        token: {type: string, description: 'The one-time setup token the installer printed.'}
        email: {type: string, format: email}
        name: {type: string}
        password: {type: string, format: password}
        team_name: {type: string, description: 'My team when left empty.'}
        locale: {type: string}

    SetupResult:
      type: object
      required: [user, team, csrf_token, recovery_key]
      properties:
        user: {$ref: '#/components/schemas/User'}
        team: {$ref: '#/components/schemas/Team'}
        csrf_token: {type: string}
        recovery_key: {type: string, description: 'Opens every secret the panel stores. Keep it offline.'}

    # --- signing in and the account ---

    User:
      type: object
      required: [id, email, name, totp_enabled, is_admin, disabled, locale, theme, recovery_saved, created_at, updated_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        totp_enabled: {type: boolean}
        is_admin: {type: boolean, description: 'Administers the whole panel.'}
        disabled: {type: boolean}
        locale: {type: string}
        theme: {type: string}
        recovery_saved: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        totp_code: {type: string, description: 'The two-factor code, or a recovery code, when the first answer asked for one.'}

    SignedIn:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string, description: 'Send it as X-Skifity-CSRF on every request that changes something.'}
        expires_at: {type: string, format: date-time}

    TOTPRequired:
      type: object
      required: [totp_required]
      properties:
        totp_required: {type: boolean, const: true}

    ReauthRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: {type: string, format: password}
        totp_code: {type: string}

    Me:
      type: object
      required: [user, teams, recovery_saved, recovery_codes_left, strong_auth]
      properties:
        user: {$ref: '#/components/schemas/User'}
        teams:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Team'}
        recovery_saved: {type: boolean}
        recovery_codes_left: {type: integer, description: 'Unused two-factor recovery codes.'}
        strong_auth: {type: boolean, description: 'Whether this sign-in would satisfy a team that requires a second factor.'}

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        locale: {type: string, enum: ['', en, id, hi, ru, zh-CN]}
        theme: {type: string, enum: [light, dark, system]}

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, format: password}

    Session:
      type: object
      required: [id, user_id, ip, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id: {type: string}
        user_id: {type: string}
        ip: {type: string}
        user_agent: {type: string}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        method: {type: string, enum: [password, totp, sso, passkey], description: 'How it was signed into.'}
        current: {type: boolean, description: 'This is the session making the request.'}

    SessionList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Session'}}
        total: {type: integer}

    TOTPSetup:
      type: object
      required: [secret, uri, recovery_codes]
      properties:
        secret: {type: string}
        uri: {type: string, description: 'An otpauth URI, for a QR code.'}
        recovery_codes: {type: array, items: {type: string}}

    TOTPConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string}

    APIToken:
      type: object
      required: [id, user_id, team_id, name, prefix, scopes, created_at]
      properties:
        id: {type: string}
        user_id: {type: string}
        team_id: {type: string}
        name: {type: string}
        prefix: {type: string, description: 'The start of the secret, to recognise it by.'}
        scopes: {type: string, description: 'Comma-separated. Empty is everything its owner can do.'}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    APITokenList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/APIToken'}}
        total: {type: integer}

    CreateTokenRequest:
      type: object
      required: [name, team_id]
      additionalProperties: false
      properties:
        name: {type: string}
        team_id: {type: string}
        scopes:
          type: string
          description: >-
            Comma-separated. read or write for everything, or a resource and a
            direction such as apps:read or backups:write, or none. Empty is
            everything its owner can do.
        ttl_hours: {type: integer, minimum: 0, description: 'Hours until it expires. It does not expire when left out.'}

    CreatedToken:
      type: object
      required: [token, secret, note]
      properties:
        token: {$ref: '#/components/schemas/APIToken'}
        secret: {type: string, description: 'The token itself, shown this once.'}
        note: {type: string}

    Passkey:
      type: object
      required: [id, rp_id, backup_eligible, backup_state, name, created_at]
      properties:
        id: {type: string}
        rp_id: {type: string, description: 'The hostname the passkey was made for.'}
        backup_eligible: {type: boolean, description: 'A synced passkey: the platform or password manager may copy it to the person''s other devices.'}
        backup_state: {type: boolean, description: 'Whether it has been copied.'}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        elsewhere: {type: boolean, description: 'Made for an address the panel no longer answers on, so a browser will not offer it here.'}

    PasskeyList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Passkey'}}
        total: {type: integer}

    AddPasskeyRequest:
      type: object
      required: [name, credential]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        credential:
          type: object
          description: The PublicKeyCredential from navigator.credentials.create, in its JSON serialisation (RegistrationResponseJSON).

    RenamePasskeyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 64}

    PasskeyCreationOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: PublicKeyCredentialCreationOptions, with the challenge, the user id and credential ids in base64url.

    PasskeyRequestOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: PublicKeyCredentialRequestOptions, with the challenge in base64url and no allowCredentials.

    PasskeyAssertion:
      type: object
      description: The PublicKeyCredential from navigator.credentials.get, in its JSON serialisation (AuthenticationResponseJSON).
      required: [id, rawId, type, response]
      properties:
        id: {type: string}
        rawId: {type: string}
        type: {type: string, const: public-key}
        authenticatorAttachment: {type: string}
        clientExtensionResults: {type: object}
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON: {type: string}
            authenticatorData: {type: string}
            signature: {type: string}
            userHandle: {type: string}

    Identity:
      type: object
      required: [issuer, email, created_at]
      properties:
        issuer: {type: string}
        email: {type: string}
        created_at: {type: string}

    SSOLink:
      type: object
      required: [available, linked, can_unlink]
      properties:
        available: {type: boolean, description: 'Whether an identity provider is configured.'}
        label: {type: string}
        linked:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Identity'}
        can_unlink: {type: boolean, description: 'False for an account with no password, which would have no way in left.'}

    InvitationLookup:
      type: object
      required: [email, team_name, role]
      properties:
        email: {type: string}
        team_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}

    AcceptInvitationRequest:
      type: object
      required: [name, password]
      additionalProperties: false
      properties:
        name: {type: string}
        password: {type: string, format: password}

    # --- teams ---

    Team:
      type: object
      required: [id, name, slug, created_at, require_strong_auth]
      properties:
        id: {type: string}
        name: {type: string}
        slug: {type: string}
        created_at: {type: string, format: date-time}
        role: {$ref: '#/components/schemas/Role'}
        scoped: {type: boolean, description: 'Your membership is limited to some of the team''s projects.'}
        projects:
          type: array
          description: The projects it is limited to.
          items: {type: string}
        require_strong_auth: {type: boolean, description: 'Everybody signs in with a second factor or single sign-on.'}

    TeamList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Team'}}
        total: {type: integer}

    CreateTeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}

    UpdateTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: 'Unchanged when empty.'}
        require_strong_auth: {type: boolean}

    Member:
      type: object
      required: [user, role, scoped]
      properties:
        user: {$ref: '#/components/schemas/User'}
        role: {$ref: '#/components/schemas/Role'}
        scoped: {type: boolean}
        projects: {type: array, items: {type: string}}

    MemberList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Member'}}
        total: {type: integer}

    AddMemberRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        projects:
          type: array
          description: Limit a member or a viewer to these projects. The whole team when left out.
          items: {type: string}

    InviteRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: {type: string, format: email}
        role:
          type: string
          enum: [owner, admin, member, viewer]
          default: member
        projects:
          type: array
          description: Limit a member or a viewer to these projects. The whole team when left out.
          items: {type: string}

    Invitation:
      type: object
      required: [id, team_id, email, role, expires_at, created_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        email: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        projects: {type: array, items: {type: string}}
        invited_by: {type: string}
        expires_at: {type: string, format: date-time}
        accepted_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    InvitationList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Invitation'}}
        total: {type: integer}

    CreatedInvitation:
      type: object
      required: [invitation, url]
      properties:
        invitation: {$ref: '#/components/schemas/Invitation'}
        url: {type: string, description: 'The link to send. It is shown this once.'}

    AuditEvent:
      type: object
      required: [id, team_id, actor_id, actor_label, action, target_type, target_id, target_label, ip, user_agent, metadata, at]
      properties:
        id: {type: string}
        team_id: {type: string}
        actor_id: {type: string}
        actor_label: {type: string}
        action: {type: string, description: 'Such as app.deploy_started.'}
        target_type: {type: string}
        target_id: {type: string}
        target_label: {type: string}
        ip: {type: string}
        user_agent: {type: string}
        metadata: {type: string}
        at: {type: string, format: date-time}

    AuditEventList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        total: {type: integer}

    TeamExport:
      type: object
      required: [product, version, exported_at, note, secrets, team, servers, secret_managers, projects]
      properties:
        product: {type: string}
        version: {type: string}
        exported_at: {type: string, format: date-time}
        note: {type: string}
        secrets: {type: string, description: 'Where the values of secret variables are, since they are not here.'}
        team: {$ref: '#/components/schemas/Team'}
        servers:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Server'}
        secret_managers:
          type: array
          items: {$ref: '#/components/schemas/SecretManager'}
        projects:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Project'
              - type: object
                required: [shared_variables, environments]
                properties:
                  shared_variables:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/SharedVariable'}
                  environments:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/ExportedEnvironment'}

    ExportedEnvironment:
      allOf:
        - $ref: '#/components/schemas/Environment'
        - type: object
          required: [apps, databases]
          properties:
            apps:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/ExportedApp'}
            databases:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/Database'}

    ExportedApp:
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          required: [domains, variables, volumes, schedules, processes]
          properties:
            domains:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/Domain'}
            variables:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/Variable'}
            volumes:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/Volume'}
            schedules:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/AppJob'}
            processes:
              type: [array, 'null']
              items: {$ref: '#/components/schemas/AppProcess'}
            manifests: {type: string, description: 'The app''s Kubernetes objects, as multi-document YAML.'}
            manifest_error: {type: string, description: 'Why the manifests could not be rendered.'}

    # --- projects and environments ---

    Project:
      type: object
      required: [id, team_id, name, slug, description, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ProjectList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Project'}}
        total: {type: integer}

    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        description: {type: string}

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        description: {type: string}

    Environment:
      type: object
      required: [id, project_id, name, slug, kind, namespace, pod_security, preview_stack, created_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        slug: {type: string}
        kind: {type: string, enum: [standard, preview]}
        namespace: {type: string, description: 'The Kubernetes namespace. Shown under Advanced in the panel.'}
        source_ref: {type: string, description: 'The pull request a preview is of.'}
        pod_security: {type: string, enum: [restricted, baseline], description: 'The Pod Security level its namespace enforces.'}
        from_fork: {type: boolean, description: 'A preview of a pull request from a fork, which is given no secret.'}
        preview_stack: {type: boolean, description: 'A preview of one app here copies every app here.'}
        created_at: {type: string, format: date-time}

    EnvironmentList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Environment'}}
        total: {type: integer}

    CloneEnvironmentRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, description: 'The copy''s name, such as staging.'}
        deploy: {type: boolean, description: 'Deploy each app once everything is copied.'}

    ClonedEnvironment:
      type: object
      required: [environment, apps, databases, notes]
      properties:
        environment: {$ref: '#/components/schemas/Environment'}
        apps: {type: array, items: {$ref: '#/components/schemas/App'}}
        databases: {type: array, items: {$ref: '#/components/schemas/Database'}}
        notes:
          type: array
          description: What the copy does not have, one app or database at a time.
          items:
            type: object
            required: [name, code]
            properties:
              name: {type: string}
              code: {type: string, enum: [volumes_empty, domains_kept, ports_kept, push_deploy_off, database_skipped, deploy_failed]}
              detail: {type: string, description: 'Why, for deploy_failed.'}

    CreateEnvironmentRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}

    UpdateEnvironmentRequest:
      type: object
      additionalProperties: false
      properties:
        pod_security: {type: string, enum: [restricted, baseline]}
        preview_stack: {type: boolean}

    EnvironmentQuota:
      type: object
      required: [found, items]
      properties:
        found: {type: boolean}
        items:
          type: [array, 'null']
          items:
            type: object
            required: [resource, used, hard, used_value, hard_value, percent]
            properties:
              resource: {type: string}
              used: {type: string}
              hard: {type: string}
              used_value: {type: integer}
              hard_value: {type: integer}
              percent: {type: integer}

    ProjectCanvas:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, kind, name, status, environment]
            properties:
              id: {type: string}
              kind: {type: string, enum: [app, database]}
              name: {type: string}
              status: {type: string}
              detail: {type: string, description: 'A database''s engine.'}
              urls: {type: array, items: {type: string}}
              environment: {type: string, description: 'The environment''s slug.'}
        edges:
          type: array
          items:
            type: object
            required: [from, to, label]
            properties:
              from: {type: string, description: 'The app.'}
              to: {type: string, description: 'The database it uses.'}
              label: {type: string, description: 'The variable it reads the connection from.'}

    # --- servers and the cluster ---

    Server:
      type: object
      required: [id, team_id, name, host, ssh_port, ssh_user, host_key, role, status, status_detail, node_name,
                 external_ip, internal_ip, os_info, arch, cpu_cores, memory_mb, disk_gb, labels, adopted, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string}
        host: {type: string}
        ssh_port: {type: integer}
        ssh_user: {type: string}
        host_key: {type: string, description: 'The SSH host key recorded the first time the panel connected.'}
        role: {type: string, description: 'control-plane or worker.'}
        status: {type: string, enum: [pending, provisioning, ready, not_ready, failed, removing]}
        status_detail: {type: string}
        node_name: {type: string}
        external_ip: {type: string}
        internal_ip: {type: string}
        os_info: {type: string}
        arch: {type: string}
        cpu_cores: {type: integer}
        memory_mb: {type: integer}
        disk_gb: {type: integer}
        labels: {type: string}
        adopted: {type: boolean, description: 'A node the panel found in the cluster rather than installed. The actions that need SSH are refused.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}

    ServerList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Server'}}
        total: {type: integer}

    ServerDetail:
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          properties:
            operation: {$ref: '#/components/schemas/Operation'}

    AddServerRequest:
      type: object
      required: [host]
      additionalProperties: false
      description: A password or a private key is needed. It is used once to install a key of the panel's own, and not stored.
      properties:
        name: {type: string, description: 'The host when left empty.'}
        host: {type: string, description: 'An IP address or a hostname.'}
        ssh_port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        ssh_user: {type: string, default: root}
        password: {type: string, format: password}
        private_key: {type: string}
        passphrase: {type: string, format: password}
        location: {type: string, description: 'Becomes a node label, so apps can be steered.'}
        size: {type: string, description: 'Becomes a node label.'}
        control_plane: {type: boolean, description: 'Join as a control plane member, for high availability.'}

    UpdateServerRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        location: {type: string, description: 'Accepted, and not changed here.'}
        size: {type: string, description: 'Accepted, and not changed here.'}

    NodeInfo:
      type: object
      required: [name, ready, roles, internal_ip, external_ip, os, architecture, kubelet_version, cpu_capacity_m,
                 memory_capacity_mb, cpu_used_m, memory_used_mb, usage_known, pod_count, schedulable]
      properties:
        name: {type: string}
        ready: {type: boolean}
        reason: {type: string}
        roles: {type: [array, 'null'], items: {type: string}}
        internal_ip: {type: string}
        external_ip: {type: string}
        os: {type: string}
        architecture: {type: string}
        kubelet_version: {type: string}
        cpu_capacity_m: {type: integer}
        memory_capacity_mb: {type: integer}
        cpu_used_m: {type: integer}
        memory_used_mb: {type: integer}
        usage_known: {type: boolean, description: 'False when there was no reading, and the used numbers mean nothing.'}
        pod_count: {type: integer}
        labels: {type: object, additionalProperties: {type: string}}
        schedulable: {type: boolean}
        disk_used_mb: {type: integer}
        disk_capacity_mb: {type: integer}

    ClusterSummary:
      type: object
      required: [reachable, nodes, ready_nodes, total_cpu_m, total_memory_mb, used_cpu_m, used_memory_mb, high_availability]
      properties:
        reachable: {type: boolean}
        kubernetes_version: {type: string}
        nodes:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/NodeInfo'}
        ready_nodes: {type: integer}
        total_cpu_m: {type: integer}
        total_memory_mb: {type: integer}
        used_cpu_m: {type: integer}
        used_memory_mb: {type: integer}
        high_availability: {type: boolean}
        message: {type: string, description: 'Why the cluster could not be reached.'}

    ServerUsage:
      type: object
      required: [range, bucket_seconds, points]
      properties:
        range: {type: string}
        bucket_seconds: {type: integer}
        points:
          type: array
          items:
            type: object
            required: [at, pods]
            properties:
              at: {type: string, format: date-time}
              cpu_pct: {type: integer}
              memory_pct: {type: integer}
              disk_pct: {type: integer, description: 'Missing where the disk could not be read.'}
              pods: {type: integer}
        disk:
          type: object
          description: The last disk reading.
          required: [used_mb, capacity_mb, at]
          properties:
            used_mb: {type: integer}
            capacity_mb: {type: integer}
            at: {type: string, format: date-time}

    HardeningReport:
      type: object
      required: [server_id, checked_at, findings, can_turn_off_passwords]
      properties:
        server_id: {type: string}
        checked_at: {type: string, format: date-time}
        can_turn_off_passwords: {type: boolean, description: 'SSH still takes a password, and the panel can safely stop it.'}
        findings:
          type: array
          items:
            type: object
            required: [code, state, level, detail]
            properties:
              code: {type: string, enum: [ssh_passwords, ssh_root, fail2ban, auto_updates, firewall, reboot]}
              state: {type: string, description: 'Which answer the check gave, such as on, off or absent.'}
              level: {type: string, enum: [risk, warn, ok]}
              detail: {type: string}
              fix: {type: string}
              firewall: {type: string, description: 'The firewall found: ufw, firewalld or iptables.'}

    ServerAlerts:
      type: object
      required: [disk_pct, memory_pct, cpu_pct]
      additionalProperties: false
      properties:
        disk_pct: {type: integer, description: '50 to 100, or 0 for off.'}
        memory_pct: {type: integer}
        cpu_pct: {type: integer}
        firing:
          type: [array, 'null']
          readOnly: true
          description: Which thresholds are going off now.
          items: {type: string}

    Operation:
      type: object
      description: Long-running work, such as adding a server or restoring a backup.
      required: [id, team_id, kind, target_type, target_id, status, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        kind: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed, cancelled]}
        error_code: {type: string}
        error_message: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        steps:
          type: array
          items: {$ref: '#/components/schemas/OperationStep'}

    OperationStep:
      type: object
      required: [id, operation_id, seq, key, status, message]
      properties:
        id: {type: string}
        operation_id: {type: string}
        seq: {type: integer}
        key: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed, skipped]}
        message: {type: string, description: 'In English.'}
        message_key: {type: string, description: 'Names the same sentence in the panel''s locale.'}
        message_args: {type: array, items: {type: string}}
        notes:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: {type: string}
              key: {type: string}
              args: {type: array, items: {type: string}}
        detail: {type: string, description: 'What a failed step hit.'}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}

    # --- Git ---

    GitSource:
      type: object
      required: [id, team_id, kind, name, base_url, account, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        kind: {type: string, enum: [github_pat, gitlab, gitea, bitbucket, generic]}
        name: {type: string}
        base_url: {type: string, description: 'https://bitbucket.org for every Bitbucket connection.'}
        account: {type: string, description: 'The user or organisation; for Bitbucket, the workspace.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    GitSourceList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GitSource'}}
        total: {type: integer}

    CreateGitSourceRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [github_pat, gitlab, gitea, bitbucket, generic]}
        name: {type: string, description: 'The kind when left empty.'}
        base_url: {type: string, description: 'For a host of your own, such as https://git.example.com. Bitbucket takes none: it is bitbucket.org.'}
        account: {type: string, description: 'For Bitbucket, the workspace: needed with an access token, and it narrows an API token to one workspace.'}
        token: {type: string, format: password, description: 'A personal access token; for Bitbucket, an API token or an access token. Needed for every kind but generic. Never shown again.'}
        email:
          type: string
          format: password
          description: >-
            Bitbucket only: the Atlassian account email an API token belongs
            to, to send the token with Basic auth. Left empty, the token is sent
            as a bearer token, which is how an access token is sent. Sealed
            with the token and never shown again.

    CreatedGitSource:
      type: object
      required: [source, webhook_url, webhook_secret]
      properties:
        source: {$ref: '#/components/schemas/GitSource'}
        webhook_url: {type: string}
        webhook_secret: {type: string}

    GitSourceWebhook:
      type: object
      required: [url, secret, secret_is_token]
      properties:
        url: {type: string}
        secret: {type: string}
        secret_is_token: {type: boolean, description: 'An older connection signs with its token, which is not shown.'}

    WebhookResult:
      type: object
      required: [status]
      properties:
        status: {type: string}
        deployments:
          type: array
          description: The deployments started.
          items: {type: string}
        skipped:
          type: array
          description: The apps that were not deployed, and why.
          items: {type: string}

    DetectRequest:
      type: object
      required: [repo_url]
      additionalProperties: false
      properties:
        repo_url: {type: string}
        branch: {type: string}
        root_dir: {type: string}
        git_source_id: {type: string, description: 'One of the team''s Git connections, for a private repository.'}

    Detection:
      type: object
      description: What the panel worked out about some code. The notes explain each decision.
      required: [builder, language, framework, port, confidence]
      properties:
        builder: {type: string, enum: [dockerfile, railpack, nixpacks, compose, static, image]}
        language: {type: string}
        framework: {type: string}
        port: {type: integer}
        start_command: {type: string}
        health_path: {type: string}
        dockerfile_path: {type: string}
        static_dir: {type: string}
        build_command: {type: string}
        confidence: {type: string, description: 'high when a marker file decided it, low for a guess.'}
        notes: {type: array, description: 'In English.', items: {type: string}}
        note_codes:
          type: array
          description: The same notes, as codes the panel translates.
          items:
            type: object
            required: [code]
            properties:
              code: {type: string}
              params: {type: object, additionalProperties: {type: string}}
        compose:
          type: array
          description: The services of a Compose file, to choose from.
          items: {$ref: '#/components/schemas/ComposeService'}
        compose_warnings: {type: array, items: {type: string}}
        needs:
          type: array
          description: What the app will reach for once it runs.
          items:
            type: object
            required: [kind, provided]
            properties:
              kind: {type: string, enum: [database, ephemeral, variables]}
              engine: {type: string}
              provided: {type: boolean, description: 'This panel can create it.'}
              evidence: {type: string}
              source: {type: string}
              variable: {type: string}
              variables: {type: array, items: {type: string}}
        advisories:
          type: array
          description: Critical vulnerabilities in the framework versions installed.
          items:
            type: object
            required: [package, version, id, fixed_in, url]
            properties:
              package: {type: string}
              version: {type: string}
              id: {type: string}
              fixed_in: {type: string}
              url: {type: string}
        preview_seed: {type: string}
        release_command: {type: string}
        processes:
          type: array
          items:
            type: object
            required: [name, command]
            properties:
              name: {type: string}
              command: {type: string}
        env_template: {type: string, description: 'The settings the app expects, as a .env to start from.'}

    ComposeService:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        image: {type: string}
        build: {type: string}
        dockerfile: {type: string}
        command: {type: string}
        ports: {type: array, items: {type: integer}}
        expose: {type: array, items: {type: integer}}
        environment: {type: object, additionalProperties: {type: string}}
        volumes: {type: array, items: {type: string}}
        depends_on: {type: array, items: {type: string}}
        unsupported: {type: array, items: {type: string}}

    # --- notifications ---

    NotificationChannel:
      type: object
      required: [id, team_id, kind, name, events, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        kind: {type: string}
        name: {type: string}
        events: {type: string, description: 'Comma-separated. Empty is every event.'}
        enabled: {type: boolean}
        scoped:
          type: boolean
          description: >-
            Limited to `projects`. An event about an app, a database or a
            backup reaches it only when it belongs to one of them; an event
            about a server, or the panel itself, reaches every channel.
        projects: {type: array, items: {type: string}, description: 'The project ids a scoped channel follows.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SecretManager:
      type: object
      required: [id, team_id, name, kind, settings, allowed_paths, allowed_project_ids, refresh_minutes, refresh_failures, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [vault, infisical, doppler, aws]}
        settings:
          type: object
          additionalProperties: {type: string}
          description: >-
            What is not secret. Vault: address, mount, namespace, auth (token
            or approle), approle_mount. Infisical: site_url, project_id,
            environment. Doppler: none. AWS: region, endpoint.
        allowed_paths:
          type: array
          items: {type: string}
          description: >-
            The path prefixes a variable may read through it, normalised: a
            Vault path under the mount, an Infisical /folder, a Doppler name
            prefix (upper case), an AWS secret name or ARN prefix. A path is
            allowed at a prefix or under it at a / (an _ for Doppler), never
            as a string prefix. Empty is every path.
        allowed_project_ids:
          type: array
          items: {type: string}
          description: >-
            The projects whose variables may read through it. Empty is every
            project. The id of a project deleted since stays, so the
            connection stays limited.
        stopped_resolving:
          type: array
          items: {type: string}
          description: 'Only in the answer to a forced change of limits: the variables, as app/KEY or project/KEY, the new limits refuse.'
        credentials: {type: array, items: {type: string}, description: 'The names of what it signs in with; never their values.'}
        used_by: {type: integer, description: 'How many variables read it.'}
        refresh_minutes: {type: integer, description: 'How often the apps that read it are refreshed. 0 is never.'}
        next_refresh_at: {type: string, format: date-time}
        last_refresh_at: {type: string, format: date-time}
        refresh_failures: {type: integer, description: 'Periodic refreshes in a row that failed; each doubles the wait, up to a day.'}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SecretManagerList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecretManager'}}
        total: {type: integer}

    CreateSecretManagerRequest:
      type: object
      required: [name, kind, credentials]
      additionalProperties: false
      properties:
        name: {type: string, description: 'Lower-case letters, digits, - and _. How a reference names it.'}
        kind: {type: string, enum: [vault, infisical, doppler, aws]}
        settings: {type: object, additionalProperties: {type: string}}
        credentials:
          type: object
          additionalProperties: {type: string}
          description: >-
            Vault: token, or role_id and secret_id. Infisical: client_id and
            client_secret. Doppler: token. AWS: access_key_id,
            secret_access_key, and session_token when it has one.
        refresh_minutes: {type: integer, description: '0, or 5 to 1440.'}
        allowed_paths:
          type: array
          items: {type: string}
          description: >-
            Path prefixes to limit it to, written as a reference's path is. A
            trailing /* is the prefix itself, and a Vault prefix may start with
            <mount>/data/ as a policy writes it. Any other * is refused. Left
            out or empty, every path.
        allowed_project_ids:
          type: array
          items: {type: string}
          description: 'Project ids of the team to limit it to. Left out or empty, every project.'

    UpdateSecretManagerRequest:
      type: object
      additionalProperties: false
      properties:
        settings: {type: object, additionalProperties: {type: string}, description: 'Only the settings named change; an empty one goes back to its default.'}
        credentials: {type: object, additionalProperties: {type: string}}
        refresh_minutes: {type: integer, description: '0, or 5 to 1440.'}
        allowed_paths:
          type: array
          items: {type: string}
          description: 'Replaces the path limits when given; an empty list is every path. Left out, they stay.'
        allowed_project_ids:
          type: array
          items: {type: string}
          description: 'Replaces the project limits when given; an empty list is every project. Left out, they stay.'
        force:
          type: boolean
          description: >-
            Save limits even though variables that read the connection now
            would be outside them; they stop resolving at their app's next
            deploy, sync or refresh. Without it such a change is refused with
            secrets.limits_break_references.

    NotificationChannelDetail:
      allOf:
        - $ref: '#/components/schemas/NotificationChannel'
        - type: object
          required: [config, secrets]
          properties:
            config: {type: object, additionalProperties: {type: string}, description: 'The settings that are not secret.'}
            secrets: {type: array, items: {type: string}, description: 'The secret settings that are stored. Their values are never returned.'}

    NotificationChannelList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NotificationChannel'}}
        total: {type: integer}

    ChannelKind:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string}
        name: {type: string}
        description: {type: string}
        provider: {type: string, description: 'The plugin behind it.'}
        fields:
          type: array
          description: >-
            The form. A built-in kind's fields have an empty label and no help:
            the panel has them translated. A kind a plugin provides carries its
            own words.
          items:
            type: object
            required: [key, label]
            properties:
              key: {type: string}
              label: {type: string}
              help: {type: string}
              kind: {type: string}
              options: {type: array, items: {type: string}}
              secret: {type: boolean}
              required: {type: boolean}

    ChannelKindList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ChannelKind'}}
        total: {type: integer}

    CreateChannelRequest:
      type: object
      required: [kind, config]
      additionalProperties: false
      properties:
        kind: {type: string, description: 'telegram, discord, slack, mattermost, teams, ntfy, pushover, gotify, webhook, email, or one a plugin provides.'}
        name: {type: string}
        config: {type: object, additionalProperties: {type: string}, description: 'The kind''s own settings. Sealed when stored.'}
        events: {type: array, items: {type: string}}
        projects: {type: array, items: {type: string}, description: 'Limits the channel to these projects. Absent is every project; an empty list is refused.'}

    UpdateChannelRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: 'Empty keeps the current name.'}
        events: {type: array, items: {type: string}, description: 'Empty is every event, as when a channel is created.'}
        enabled: {type: boolean, description: 'Absent keeps it as it is.'}
        projects: {type: array, items: {type: string}, description: 'Limits the channel to these projects. Absent is every project; an empty list is refused.'}
        config:
          type: object
          additionalProperties: {type: string}
          description: >-
            Changes to the kind's settings. A key left out is kept, a secret
            sent empty is kept, and any other setting sent empty is cleared.
            Absent keeps every setting.

    # --- apps ---

    App:
      type: object
      required: [id, environment_id, name, slug, source_type, repo_url, branch, root_dir, builder, dockerfile_path,
                 build_command, static_dir, image, port, health_path, health_check, health_start_seconds,
                 health_timeout_seconds, start_command, release_command, replicas,
                 autoscale, min_replicas, max_replicas, cpu_target, memory_target, scale_to_zero, cpu_request_m,
                 cpu_limit_m, mem_request_mb, mem_limit_mb, auto_deploy, preview_deploys, watch_paths, internal,
                 preview_seed, status, created_at, updated_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        name: {type: string}
        slug: {type: string}
        source_type: {type: string, enum: [git, image, upload]}
        git_source_id: {type: string}
        repo_url: {type: string}
        branch: {type: string}
        root_dir: {type: string}
        builder: {type: string, description: 'auto, or the builder to use.'}
        dockerfile_path: {type: string}
        build_command: {type: string, description: 'What produces a front end''s output.'}
        static_dir: {type: string, description: 'The directory served for a static site.'}
        image: {type: string}
        port: {type: integer}
        health_path: {type: string}
        health_check:
          type: string
          enum: [http, tcp, none]
          description: >-
            http asks health_path, tcp checks the port is open, none checks nothing: an instance gets traffic as
            soon as its process starts, and one that stops answering keeps it.
        health_start_seconds: {type: integer, description: 'How long a new instance may take to answer before it is restarted.'}
        health_timeout_seconds: {type: integer, description: 'How long one health check waits for an answer.'}
        start_command: {type: string}
        release_command: {type: string, description: 'Runs after the build and before traffic reaches the new version.'}
        replicas: {type: integer}
        autoscale: {type: boolean}
        min_replicas: {type: integer}
        max_replicas: {type: integer}
        cpu_target: {type: integer}
        memory_target: {type: integer}
        scale_to_zero: {type: boolean}
        cpu_request_m: {type: integer}
        cpu_limit_m: {type: integer}
        mem_request_mb: {type: integer}
        mem_limit_mb: {type: integer}
        auto_deploy: {type: boolean, description: 'Deploy on push.'}
        preview_deploys: {type: boolean, description: 'A preview for each pull request.'}
        watch_paths: {type: string, description: 'One pattern per line that a push has to touch to deploy. Empty is every push.'}
        deploy_trigger: {type: string, enum: [branch, tag], description: 'What deploys the app on a push: its branch, or a tag matching tag_pattern.'}
        tag_pattern: {type: string, description: 'The tags that deploy it, as a path.Match pattern such as v*.'}
        run_as_user: {type: integer, description: 'The uid an image that names its user runs as; 0 when the image decides.'}
        internal: {type: boolean, description: 'Reached by name from its environment only. No address of its own.'}
        preview_seed: {type: string, description: 'Runs once in each new preview.'}
        seeded_at: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        vulnerabilities:
          $ref: '#/components/schemas/ScanCounts'
          description: 'What the newest scan of its image counted. Only in an environment''s list of apps, and only for an app that has been scanned.'

    AppList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/App'}}
        total: {type: integer}

    AppDetail:
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          properties:
            deploy_lock: {$ref: '#/components/schemas/DeployLock'}
            maintenance: {$ref: '#/components/schemas/Maintenance'}

    CreateAppRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string}
        source_type:
          type: string
          enum: [git, image, upload]
          description: image when an image is given, git otherwise.
        git_source_id: {type: string}
        repo_url: {type: string, description: 'Needed for git.'}
        branch: {type: string}
        root_dir: {type: string}
        builder: {type: string, default: auto}
        dockerfile_path: {type: string}
        build_command: {type: string}
        static_dir: {type: string}
        image: {type: string, description: 'Needed for image, such as nginx:1.27.'}
        port: {type: integer}
        health_path: {type: string}
        health_check:
          type: string
          enum: [http, tcp, none]
          description: http when a health_path is given, tcp otherwise. http needs a health_path.
        health_start_seconds: {type: integer, minimum: 10, maximum: 1800, default: 120}
        health_timeout_seconds: {type: integer, minimum: 1, maximum: 60, default: 3}
        start_command: {type: string}
        release_command: {type: string}
        preview_seed: {type: string}
        watch_paths: {type: string}
        deploy_trigger: {type: string, enum: [branch, tag]}
        tag_pattern: {type: string}
        internal: {type: boolean}
        deploy: {type: boolean, description: 'Deploy it straight away.'}
        variables:
          type: object
          description: Set before the first deploy. Each is decided secret or not by the same rule as everywhere else.
          additionalProperties: {type: string}
        databases:
          type: array
          maxItems: 4
          description: Created in the same environment and linked before the first deploy.
          items:
            type: object
            required: [engine]
            additionalProperties: false
            properties:
              engine: {type: string, enum: [postgres, mysql, mariadb, mongodb, redis, valkey, dragonfly, clickhouse, memcached]}
              variable: {type: string, description: 'The variable the app reads the connection from. The engine''s default when left out.'}
        processes:
          type: array
          description: Workers and the like, to run beside it on its image.
          items:
            type: object
            required: [name, command]
            additionalProperties: false
            properties:
              name: {type: string}
              command: {type: string}
              instances: {type: integer, default: 1}

    CreatedApp:
      type: object
      required: [app, webhook]
      properties:
        app: {$ref: '#/components/schemas/App'}
        webhook: {$ref: '#/components/schemas/WebhookStatus'}
        databases:
          type: array
          description: What happened to each database asked for. One that failed does not undo the app.
          items:
            type: object
            required: [engine, variable]
            properties:
              engine: {type: string}
              variable: {type: string}
              database_id: {type: string}
              name: {type: string}
              error: {type: string}
        deployment: {$ref: '#/components/schemas/Deployment'}

    WebhookStatus:
      type: object
      required: [registered]
      properties:
        registered: {type: boolean, description: 'Pushes will reach the panel with nothing more to set up.'}
        url: {type: string, description: 'Where the Git host should deliver, when somebody has to add it.'}
        reason: {type: string, description: 'Why it could not be registered.'}

    StackRequest:
      type: object
      required: [services]
      additionalProperties: false
      properties:
        repo_url: {type: string}
        git_source_id: {type: string}
        branch: {type: string}
        root_dir: {type: string}
        services:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ComposeService'}
        deploy: {type: boolean}

    CreatedStack:
      type: object
      required: [apps, notes]
      properties:
        apps:
          type: array
          items: {$ref: '#/components/schemas/App'}
        notes:
          type: array
          description: What was changed from the Compose file on the way.
          items:
            type: object
            required: [service, code]
            properties:
              service: {type: string}
              code: {type: string}
              value: {type: string}
        webhook: {$ref: '#/components/schemas/WebhookStatus'}
        deployments:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Deployment'}

    UpdateAppRequest:
      type: object
      additionalProperties: false
      description: Only the fields sent change.
      properties:
        name: {type: string}
        branch: {type: string}
        root_dir: {type: string}
        builder: {type: string}
        dockerfile_path: {type: string}
        image: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        health_path: {type: string, description: 'Changing it without health_check makes the check follow it: http with a path, tcp without, unless the check is none.'}
        health_check: {type: string, enum: [http, tcp, none], description: 'http needs a health_path.'}
        health_start_seconds: {type: integer, minimum: 10, maximum: 1800}
        health_timeout_seconds: {type: integer, minimum: 1, maximum: 60}
        build_command: {type: string}
        static_dir: {type: string}
        start_command: {type: string}
        release_command: {type: string}
        preview_seed: {type: string}
        watch_paths: {type: string}
        deploy_trigger: {type: string, enum: [branch, tag]}
        tag_pattern: {type: string}
        run_as_user: {type: integer, minimum: 0, maximum: 2147483647, description: 'The uid for an image that names its user, so it runs at the strict confinement level; 0 leaves it to the image. Refused for an app built here, which runs as 1000.'}
        internal: {type: boolean}
        auto_deploy: {type: boolean}
        preview_deploys: {type: boolean}
        cpu_request_m: {type: integer, minimum: 10}
        cpu_limit_m: {type: integer}
        mem_request_mb: {type: integer, minimum: 16}
        mem_limit_mb: {type: integer}

    DeployLock:
      type: object
      required: [app_id, reason, locked_by, locked_at]
      properties:
        app_id: {type: string}
        reason: {type: string}
        locked_by: {type: string, description: 'Who locked it, by email address.'}
        locked_at: {type: string, format: date-time}

    DriftReport:
      type: object
      required: [status, items, checked_at, auto_repair]
      properties:
        status:
          type: string
          enum: [in_sync, drifted, missing, not_deployed, applying]
          description: 'drifted is an object changed, missing an object deleted, not_deployed nothing to compare yet, applying a deploy or a sync in progress, compared once it has finished.'
        items:
          type: array
          items: {$ref: '#/components/schemas/DriftItem'}
        checked_at: {type: string, format: date-time}
        since: {type: string, format: date-time, description: 'When the watcher first found it not matching, while it still does not.'}
        auto_repair: {type: boolean, description: 'Whether the watcher puts it back by itself.'}

    DriftItem:
      type: object
      required: [kind, name, change]
      properties:
        kind: {type: string, description: 'The Kubernetes kind, such as Deployment.'}
        name: {type: string}
        path: {type: string, description: 'The field, such as spec.template.spec.containers[name=web].image. Empty for a deleted object.'}
        change: {type: string, enum: [changed, removed, deleted]}
        panel: {type: string, description: 'What the panel applies, as text.'}
        live: {type: string, description: 'What the cluster holds, as text.'}
        hidden: {type: boolean, description: 'A Secret''s value differs, and neither value is sent.'}
        changed_by: {type: string, description: 'The tool that changed it, as the managed fields record it: kubectl-edit, kubectl-patch.'}
        changed_at: {type: string, format: date-time}

    ObjectEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ObjectEvent'}

    ObjectEvent:
      type: object
      required: [type, reason, kind, name, message, count, first_seen, last_seen]
      properties:
        type: {type: string, enum: [Normal, Warning]}
        reason: {type: string, description: 'Kubernetes'' own, such as FailedScheduling or BackOff.'}
        kind: {type: string}
        name: {type: string}
        message: {type: string, description: 'The cluster''s words, with the app''s secrets taken out.'}
        count: {type: integer, description: 'How many times, repeats folded together.'}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        explanation: {type: string, description: 'What it means and what to do, when the panel knows.'}
        explanation_code: {type: string, description: 'The key the panel finds its own words under, events.explain.<code>.'}
        explanation_args:
          type: array
          items: {type: string}
          description: 'The values in the explanation, in order.'

    InstanceInfo:
      type: object
      required: [name, status, ready, restarts, node, cpu_m, memory_mb, usage_known]
      properties:
        name: {type: string}
        status: {type: string}
        ready: {type: boolean}
        restarts: {type: integer}
        node: {type: string}
        started_at: {type: string, format: date-time}
        message: {type: string}
        cpu_m: {type: integer}
        memory_mb: {type: integer}
        usage_known: {type: boolean}

    AppRuntimeStatus:
      type: object
      required: [phase, desired_replicas, ready_replicas, instances]
      properties:
        phase: {type: string, description: 'Such as running, deploying, sleeping, stopped or unknown.'}
        detail: {type: string}
        desired_replicas: {type: integer}
        ready_replicas: {type: integer}
        instances:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/InstanceInfo'}
        image: {type: string}
        urls: {type: array, items: {type: string}}
        internal_address: {type: string, description: 'How the environment''s other apps reach an internal app, such as api:8080.'}

    AppMetrics:
      type: object
      required: [range, bucket_seconds, limits, points]
      properties:
        range: {type: string}
        bucket_seconds: {type: integer}
        limits:
          type: object
          description: Per instance, which is what the peaks are a share of.
          required: [cpu_m, memory_mb]
          properties:
            cpu_m: {type: integer}
            memory_mb: {type: integer}
        points:
          type: array
          items:
            type: object
            required: [at, cpu_m, memory_mb, cpu_peak_pct, memory_peak_pct, ready, desired, restarts, usage_known]
            properties:
              at: {type: string, format: date-time}
              cpu_m: {type: integer}
              memory_mb: {type: integer}
              cpu_peak_pct: {type: integer}
              memory_peak_pct: {type: integer}
              ready: {type: integer}
              desired: {type: integer}
              restarts: {type: integer}
              usage_known: {type: boolean}
        traffic:
          type: object
          description: >-
            The requests that reached the app through the ingress, counted from Traefik's metrics once a
            minute and kept for three days. Requests the firewall, maintenance or a password answered
            never reached the app and are not counted.
          required: [source, routed, points]
          properties:
            source:
              type: string
              enum: [no_cluster, starting, reading, no_traefik, unreachable]
              description: >-
                Whether the ingress could be read on the watcher's last pass: reading when it could;
                starting before the second read, the first being only something to compare with;
                no_traefik when no Traefik runs in kube-system; unreachable when Traefik did not
                answer on its metrics port; no_cluster when the panel has no cluster.
            routed:
              type: boolean
              description: Whether the app has a port and a domain, so that anything reaches it through the ingress.
            points:
              type: array
              items:
                type: object
                required: [at, minutes, requests, status_2xx, status_3xx, status_4xx, status_5xx, p50_ms, p95_ms, partial]
                properties:
                  at: {type: string, format: date-time}
                  minutes: {type: integer, description: 'Minutes counted in the bucket; a rate is requests / minutes.'}
                  requests: {type: integer}
                  status_2xx: {type: integer}
                  status_3xx: {type: integer}
                  status_4xx: {type: integer}
                  status_5xx: {type: integer}
                  p50_ms:
                    type: [number, 'null']
                    description: The minutes' medians averaged by their requests, in milliseconds.
                  p95_ms:
                    type: [number, 'null']
                    description: The slowest minute's 95th percentile, in milliseconds.
                  partial: {type: boolean, description: 'Some minute could not count all of its traffic, so the numbers are a floor.'}

    AppAlerts:
      type: object
      required: [memory_pct, cpu_pct, restarts]
      additionalProperties: false
      properties:
        memory_pct: {type: integer, description: '50 to 100, or 0 for off.'}
        cpu_pct: {type: integer, description: '50 to 100, or 0 for off.'}
        restarts: {type: integer, description: 'Restarts in ten minutes, 1 to 100, or 0 for off.'}
        server_errors_pct:
          type: integer
          description: >-
            The share of requests answered with a server error (5xx) every minute for three minutes, with
            at least 20 requests between them; 1 to 100, or 0 for off. 10 by default. Left out of a
            change, it keeps the value it had.
        firing:
          type: [array, 'null']
          readOnly: true
          description: Which thresholds are going off now.
          items: {type: string}

    AppLogs:
      type: object
      required: [app_id, lines, previous]
      properties:
        app_id: {type: string}
        lines: {type: array, items: {type: string}}
        previous: {type: boolean}

    RunLogs:
      type: object
      required: [run, lines, finished]
      properties:
        run: {type: string}
        lines: {type: array, items: {type: string}}
        finished: {type: boolean}
        exit_code: {type: integer, description: 'How it ended, once it has, when it was followed.'}

    AppJob:
      type: object
      required: [id, app_id, name, schedule, command, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        name: {type: string}
        schedule: {type: string, description: 'Five cron fields, in UTC.'}
        command: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    AppJobList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AppJob'}}
        total: {type: integer}

    AppJobRequest:
      type: object
      required: [name, schedule, command]
      additionalProperties: false
      properties:
        name: {type: string}
        schedule: {type: string, description: 'Five cron fields, in UTC, such as 0 3 * * *.'}
        command: {type: string}
        enabled: {type: boolean, default: true}

    Firewall:
      type: object
      required: [enabled, rules, installed, country_available, network_available, hostnames]
      properties:
        enabled: {type: boolean}
        rules: {$ref: '#/components/schemas/RuleSet'}
        installed: {type: boolean, description: 'Whether the component that enforces the rules is in the cluster.'}
        country_available: {type: boolean}
        network_available: {type: boolean}
        attribution: {type: string}
        attribution_url: {type: string}
        hostnames: {type: array, items: {type: string}}

    SetFirewallRequest:
      type: object
      required: [enabled, rules]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        rules: {$ref: '#/components/schemas/RuleSet'}

    RuleSet:
      type: object
      required: [rules, default]
      properties:
        rules:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Rule'}
        default: {type: string, enum: [allow, block, ''], description: 'What happens to a request no rule matched. Allow when empty.'}

    Rule:
      type: object
      required: [id, name, action, expr, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        action: {type: string, enum: [allow, block]}
        expr: {$ref: '#/components/schemas/RuleExpr'}
        enabled: {type: boolean}

    RuleExpr:
      type: object
      description: >-
        A condition: exactly one of all, any, not and test. A rule with none of
        them matches every request.
      properties:
        all:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RuleExpr'}
        any:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RuleExpr'}
        not: {$ref: '#/components/schemas/RuleExpr'}
        test:
          type: object
          required: [field, op, values]
          properties:
            field:
              type: string
              enum: [ip.src, ip.country, ip.asn, http.host, http.path, http.method, http.user_agent, http.header]
            key: {type: string, description: 'The header, for http.header.'}
            op: {type: string, enum: [in, not_in, contains, starts_with, ends_with, matches]}
            values: {type: array, items: {type: string}}

    AppPassword:
      type: object
      required: [enabled, hostnames, plain_http]
      properties:
        enabled: {type: boolean}
        username: {type: string}
        updated_at: {type: string}
        hostnames: {type: array, items: {type: string}}
        plain_http:
          type: array
          description: The hostnames without HTTPS, where the password would cross the network readable.
          items: {type: string}

    SetAppPasswordRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, format: password, minLength: 8}

    Maintenance:
      type: object
      required: [app_id, message, allow, started_by, started_at]
      properties:
        app_id: {type: string}
        message: {type: string, description: 'Shown to visitors as it is written.'}
        allow:
          type: [array, 'null']
          description: Addresses and ranges that still reach the app.
          items: {type: string}
        started_by: {type: string}
        started_at: {type: string}

    MaintenanceStatus:
      allOf:
        - $ref: '#/components/schemas/Maintenance'
        - type: object
          required: [active, hostnames]
          properties:
            active: {type: boolean}
            hostnames: {type: array, items: {type: string}}
            your_address: {type: string, description: 'The address this request came from, to allow yourself.'}

    MaintenanceRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: {type: string, maxLength: 1000}
        allow:
          type: array
          maxItems: 50
          description: Addresses or CIDR ranges that still reach the app.
          items: {type: string}

    AppTemplateStatus:
      type: object
      required: [from_template, app_id, template_id, service, installed_image, installed_at, update_available, changed_by_hand]
      properties:
        from_template: {type: boolean}
        app_id: {type: string}
        template_id: {type: string}
        service: {type: string, description: 'Which of the template''s services this app is.'}
        installed_image: {type: string}
        installed_at: {type: string}
        update_status: {type: string, enum: [backing_up, failed]}
        update_to: {type: string}
        update_error: {type: string}
        name: {type: string, description: 'The template''s name.'}
        current_image: {type: string}
        latest_image: {type: string}
        update_available: {type: boolean}
        changed_by_hand: {type: boolean, description: 'The image was changed since the template set it.'}

    TemplateUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, description: 'Update an app whose image was changed by hand.'}
        skip_backup: {type: boolean}

    UploadSummary:
      type: object
      required: [sha256, size, files, unpacked]
      properties:
        sha256: {type: string, description: 'The archive''s hash, which a deployment records as its commit.'}
        size: {type: integer}
        files: {type: integer}
        unpacked: {type: integer}

    # --- deployments ---

    Deployment:
      type: object
      required: [id, app_id, number, status, trigger, commit_sha, commit_message, commit_author, image,
                 build_fingerprint, runtime_spec, created_by, created_at, can_rollback]
      properties:
        id: {type: string}
        app_id: {type: string}
        number: {type: integer}
        status: {type: string, enum: [queued, building, deploying, succeeded, failed, cancelled, superseded]}
        trigger: {type: string, description: 'manual, create, template, push, preview, rollback or promote.'}
        rollback_of: {type: integer, description: 'The deployment number a rollback went back to.'}
        commit_sha: {type: string}
        commit_message: {type: string}
        commit_author: {type: string}
        image: {type: string}
        build_fingerprint: {type: string, description: 'What went into the image. Unchanged means no rebuild.'}
        runtime_spec: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        error_hint: {type: string}
        created_by: {type: string}
        accepted_vulnerabilities: {type: boolean, description: 'Deployed with critical vulnerabilities that have a fix accepted, past the check that stops those.'}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        can_rollback: {type: boolean, description: 'Its image is still kept, so it can be gone back to.'}

    DeploymentList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deployment'}}
        total: {type: integer}

    DeployRequest:
      type: object
      additionalProperties: false
      properties:
        commit_sha: {type: string, description: 'The branch''s latest commit when left out.'}
        force: {type: boolean, description: 'Rebuild even when nothing that goes into the image changed.'}
        accept_vulnerabilities:
          type: boolean
          description: >-
            Deploy even when the image has a critical vulnerability with a fix and the panel is set to stop
            those. Recorded on the deployment and in the activity log.

    ScanCounts:
      type: object
      required: [critical, high, medium, low, unknown]
      properties:
        critical: {type: integer}
        high: {type: integer}
        medium: {type: integer}
        low: {type: integer}
        unknown: {type: integer, description: 'Not rated by anybody yet.'}

    ScanFinding:
      type: object
      required: [id, package, installed, severity]
      properties:
        id: {type: string, description: 'The advisory: a CVE, a GHSA, or a distribution''s own.'}
        package: {type: string}
        installed: {type: string}
        fixed_in: {type: string, description: 'The version, or versions, that fix it. Missing when there is no fix yet.'}
        severity: {type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]}
        title: {type: string}
        url: {type: string, description: 'The advisory''s page. Always https.'}
        target: {type: string, description: 'Where in the image the package was found.'}

    ImageScan:
      type: object
      required: [id, app_id, image, trigger, status, counts, fixable, fixable_critical, findings, omitted, created_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        deployment_id: {type: string, description: 'The deployment whose image was scanned.'}
        image: {type: string}
        digest: {type: string, description: 'The image''s manifest digest, sha256:..., when the report named one.'}
        trigger: {type: string, enum: [deploy, schedule, manual]}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        counts: {$ref: '#/components/schemas/ScanCounts'}
        fixable: {type: integer, description: 'Findings, of any severity, with a fixed version.'}
        fixable_critical: {type: integer, description: 'Critical findings with a fixed version: what stops a deploy when the panel is set to.'}
        findings:
          type: [array, 'null']
          description: The most severe first, and those with a fix first among equals. At most 200.
          items: {$ref: '#/components/schemas/ScanFinding'}
        omitted: {type: integer, description: 'How many findings there were beyond those listed.'}
        scanner_version: {type: string, description: 'The Trivy version that wrote the report.'}
        os: {type: string, description: 'The image''s operating system, such as debian 12.7.'}
        error_code: {type: string}
        error_message: {type: string}
        error_hint: {type: string}
        requested_by: {type: string, description: 'The user who asked for it, or who deployed the image.'}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}

    VulnerabilityReport:
      type: object
      required: [enabled, blocking, scan, current, undeployed]
      properties:
        enabled: {type: boolean, description: 'Scanning is switched on for this panel.'}
        blocking: {type: boolean, description: 'A deploy is stopped by a critical vulnerability with a fix.'}
        image: {type: string, description: 'What the app runs now: its newest successful deployment''s image.'}
        scan:
          description: The newest report, or null when the app has never been scanned.
          oneOf:
            - {$ref: '#/components/schemas/ImageScan'}
            - {type: 'null'}
        current: {type: boolean, description: 'The report is of the image the app runs now.'}
        undeployed: {type: boolean, description: 'The report is of an image that has not gone out: its deploy is under way, or was stopped.'}
        latest:
          $ref: '#/components/schemas/ImageScan'
          description: The newest scan, when it is not the report above - queued, running, or failed and saying why.

    DeploymentLogs:
      type: object
      required: [deployment_id, status, finished, lines]
      properties:
        deployment_id: {type: string}
        status: {type: string}
        finished: {type: boolean}
        lines:
          type: [array, 'null']
          items:
            type: object
            required: [seq, stream, line, at]
            properties:
              seq: {type: integer}
              stream: {type: string}
              line: {type: string}
              at: {type: string, format: date-time}

    RollbackPlan:
      type: object
      required: [target, current, changes, can_rollback, unchanged]
      properties:
        target: {$ref: '#/components/schemas/RollbackVersion'}
        current:
          description: The version running now, when there is one.
          oneOf:
            - $ref: '#/components/schemas/RollbackVersion'
            - type: 'null'
        changes:
          type: array
          items:
            type: object
            required: [field, from, to]
            properties:
              field: {type: string}
              from: {type: string}
              to: {type: string}
        can_rollback: {type: boolean}
        unchanged:
          type: array
          description: What a rollback leaves as it is now.
          items: {type: string}

    RollbackVersion:
      type: object
      required: [number]
      properties:
        number: {type: integer}
        commit_sha: {type: string}
        commit_message: {type: string}
        image: {type: string}

    PromoteTargetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [app_id, app_name, environment_id, environment_name]
            properties:
              app_id: {type: string}
              app_name: {type: string}
              environment_id: {type: string}
              environment_name: {type: string}
        total: {type: integer}

    PromoteRequest:
      type: object
      required: [deployment_id]
      additionalProperties: false
      properties:
        deployment_id: {type: string, description: 'A successful deployment of the same app in another environment of the project.'}
        force: {type: boolean, description: 'Run it even though this app would have built it differently.'}

    # --- variables ---

    Variable:
      type: object
      required: [id, app_id, key, is_secret, build_time, created_at, updated_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        key: {type: string}
        value: {type: string, description: 'Never returned for a secret.'}
        is_secret: {type: boolean}
        build_time: {type: boolean, description: 'Read while building. Changing it rebuilds.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        preview_mode: {type: string, enum: [value, none], description: 'What a preview gets. Its own value when empty.'}
        preview_value: {type: string, description: 'Never returned for a secret.'}
        reference: {$ref: '#/components/schemas/SecretReference'}

    SecretReference:
      type: object
      description: >-
        Where a variable's value is read from, for one that is not stored in
        the panel. The value itself is never returned, and never stored.
      required: [connection_id, path]
      properties:
        connection_id: {type: string}
        path: {type: string, description: 'The secret: a Vault path under the mount, an Infisical /folder/NAME, a Doppler name, an AWS secret name or ARN.'}
        key: {type: string, description: 'The key inside the secret: a Vault field, or a key of a JSON value.'}
        connection: {type: string, description: 'The connection''s name.'}
        kind: {type: string, enum: [vault, infisical, doppler, aws]}

    VariableReferenceRequest:
      type: object
      required: [connection, path]
      additionalProperties: false
      properties:
        connection: {type: string, description: 'The connection''s name or id.'}
        path: {type: string}
        key: {type: string}

    VariablesRefresh:
      type: object
      required: [references, changed, build_time_changed, rolled_out]
      properties:
        references: {type: integer, description: 'How many of the app''s variables are read from a secret manager.'}
        changed: {type: array, items: {type: string}, description: 'The variables whose values changed.'}
        build_time_changed: {type: array, items: {type: string}, description: 'Those of them the build reads.'}
        rolled_out: {type: boolean, description: 'Rolled out with the image the app has.'}
        deployment: {$ref: '#/components/schemas/Deployment'}
        not_deployed: {type: boolean, description: 'Nothing is running yet, so nothing was rolled out.'}

    VariableList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Variable'}}
        total: {type: integer}

    SetVariableRequest:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key: {type: string}
        value: {type: string, description: 'The value; left out for one read from a secret manager.'}
        from:
          allOf:
            - $ref: '#/components/schemas/VariableReferenceRequest'
          description: >-
            Read the value from a secret manager instead: it is read once now,
            so a wrong path is refused here, and at every deploy and sync
            after. Never stored. The variable is a secret. A path or a project
            outside the connection's limits is refused with
            secrets.reference_not_allowed (403) before anything is read, and so
            is one already stored when the connection is narrowed later, at
            the next deploy, sync or refresh.
        is_secret:
          type: boolean
          description: >-
            Left out, a variable that was a secret stays one, and a new one is
            a secret when its name or value looks like one.
        build_time:
          type: boolean
          description: Read while building. Left out, it stays what it was. A shared variable cannot be.

    ChangeVariablesRequest:
      type: object
      additionalProperties: false
      description: At least one change, and at most 500. A key set and removed in the same request is refused.
      properties:
        set:
          type: array
          items: {$ref: '#/components/schemas/SetVariableRequest'}
        unset:
          type: array
          items: {type: string}

    VariablePreviewRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [same, value, none]}
        value: {type: string, description: 'For value.'}

    SharedVariable:
      type: object
      required: [id, project_id, key, is_secret, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        key: {type: string}
        value: {type: string, description: 'Never returned for a secret.'}
        is_secret: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        reference: {$ref: '#/components/schemas/SecretReference'}

    SharedVariableList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SharedVariable'}}
        total: {type: integer}

    # --- domains ---

    Domain:
      type: object
      required: [id, app_id, hostname, path, tls, auto, status, created_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        hostname: {type: string}
        path: {type: string}
        tls: {type: boolean}
        auto: {type: boolean, description: 'The address the panel gave the app. It cannot be removed.'}
        status: {type: string}
        status_detail: {type: string}
        created_at: {type: string, format: date-time}
        dns_target: {type: string, description: 'Where a domain of your own has to point.'}
        redirect_to: {type: string, description: 'Another of the app''s hostnames this one permanently redirects to. Absent when it serves the app.'}
        certificate:
          description: >-
            The team's own certificate this hostname is served with, when one
            covers it; absent for Let's Encrypt. Its status is then active,
            expiring or expired, from the certificate's dates.
          type: object
          required: [id, name, not_after, state]
          properties:
            id: {type: string}
            name: {type: string}
            not_after: {type: string, format: date-time}
            state: {type: string, enum: [valid, expiring, expired]}

    AddedDomain:
      allOf:
        - $ref: '#/components/schemas/Domain'
        - type: object
          properties:
            dns:
              $ref: '#/components/schemas/DNSCheck'
              description: What the domain's DNS said when it was added. Absent when the lookup did not finish.

    DNSCheck:
      type: object
      required: [hostname, status, points_here, found, expected, checked_at]
      properties:
        hostname: {type: string}
        status:
          type: string
          enum: [here, partly, elsewhere, missing, unknown]
          description: >-
            here is every address being the cluster's; partly is some of them; elsewhere is none; missing is no
            address at all yet; unknown is addresses found while the panel does not know its own.
        points_here: {type: boolean, description: 'status is here.'}
        found:
          type: array
          description: The records found, a CNAME first when there is one.
          items: {$ref: '#/components/schemas/DNSRecord'}
        expected:
          type: array
          description: Every address that counts as here, the one to use first.
          items: {type: string}
        checked_at: {type: string, format: date-time}

    DNSRecord:
      type: object
      required: [type, value, here]
      properties:
        type: {type: string, enum: [A, AAAA, CNAME]}
        value: {type: string}
        here: {type: boolean, description: 'The address is one of the cluster''s. Always false for a CNAME.'}

    DomainList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Domain'}}
        total: {type: integer}

    PreviewBranchRequest:
      type: object
      required: [branch]
      additionalProperties: false
      properties:
        branch: {type: string, description: 'The branch as Git writes it, such as feature/checkout.'}

    AddDomainRequest:
      type: object
      required: [hostname]
      additionalProperties: false
      properties:
        hostname: {type: string}
        tls: {type: boolean, default: true}
        path: {type: string, default: /}
        redirect_to: {type: string, description: 'Another of the app''s hostnames to send this one''s visitors to, permanently.'}

    # --- scaling and processes ---

    Scaling:
      type: object
      required: [replicas, autoscale, min_replicas, max_replicas, cpu_target, memory_target, scale_to_zero]
      properties:
        replicas: {type: integer}
        autoscale: {type: boolean}
        min_replicas: {type: integer}
        max_replicas: {type: integer}
        cpu_target: {type: integer, description: 'A percentage of the CPU reserved.'}
        memory_target: {type: integer}
        scale_to_zero: {type: boolean, description: 'Stop when idle; the next request starts it.'}

    SetScalingRequest:
      type: object
      additionalProperties: false
      description: Only the fields sent change.
      properties:
        replicas: {type: integer, minimum: 0, maximum: 100}
        autoscale: {type: boolean}
        min_replicas: {type: integer, minimum: 1}
        max_replicas: {type: integer, maximum: 100}
        cpu_target: {type: integer, minimum: 0, maximum: 100}
        memory_target: {type: integer, minimum: 0, maximum: 100}
        scale_to_zero: {type: boolean}

    ScalingFinding:
      type: object
      required: [code, severity, title, detail, fix]
      properties:
        code: {type: string}
        severity: {type: string}
        title: {type: string}
        detail: {type: string}
        fix: {type: string}
        args:
          type: object
          properties:
            title: {type: array, items: {type: string}}
            detail: {type: array, items: {type: string}}
            fix: {type: array, items: {type: string}}

    ScalingFindingList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScalingFinding'}}
        total: {type: integer}

    AppPortWithAddresses:
      type: object
      required: [id, app_id, port, protocol, public_port, created_at, addresses]
      properties:
        id: {type: string}
        app_id: {type: string}
        port: {type: integer, description: The port the container listens on.}
        protocol: {type: string, enum: [tcp, udp]}
        public_port: {type: integer, description: The port opened on every server.}
        created_at: {type: string}
        addresses:
          type: array
          items: {type: string}
          description: The team's servers' public addresses at this port. Empty when none are known.

    AppPortList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AppPortWithAddresses'}
        total: {type: integer}

    AddPortRequest:
      type: object
      required: [port]
      additionalProperties: false
      properties:
        port: {type: integer, minimum: 1, maximum: 65535}
        protocol: {type: string, enum: [tcp, udp], default: tcp}
        public_port: {type: integer, description: The port itself when left out.}

    AppFile:
      type: object
      required: [id, app_id, path, size, is_secret, executable, created_at, updated_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        path: {type: string}
        content: {type: string, description: Absent for a secret file.}
        size: {type: integer}
        is_secret: {type: boolean}
        executable: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}

    AppFileList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AppFile'}
        total: {type: integer}

    SetFileRequest:
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        path: {type: string, description: 'Absolute, such as /etc/nginx/nginx.conf.'}
        content: {type: string}
        is_secret: {type: boolean, description: 'Left out, a file keeps what it was; a new one is secret when its path or content looks like a credential.'}
        executable: {type: boolean, description: 'Left out, a file keeps what it was; a new one is not executable.'}

    RegistryCredential:
      type: object
      required: [id, team_id, name, host, username, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string}
        host: {type: string, description: 'As an image reference carries it, such as ghcr.io or docker.io.'}
        username: {type: string}
        created_at: {type: string}
        updated_at: {type: string}

    RegistryCredentialList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RegistryCredential'}
        total: {type: integer}

    Certificate:
      type: object
      required: [id, team_id, name, hostnames, subject, issuer, not_before, not_after, fingerprint, key_type,
        self_signed, chain_length, created_at, updated_at, state, domains]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string}
        hostnames:
          type: array
          items: {type: string}
          description: The DNS names it is for, wildcards as written, such as *.example.com.
        subject: {type: string}
        issuer: {type: string}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        fingerprint: {type: string, description: 'SHA-256 of the certificate, as openssl x509 -fingerprint -sha256 prints it.'}
        key_type: {type: string, description: 'RSA 2048, ECDSA P-256, Ed25519 and so on.'}
        self_signed: {type: boolean}
        chain_length: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        state: {type: string, enum: [valid, expiring, expired], description: Expiring is within 21 days.}
        domains:
          type: array
          description: The team's domains served with it.
          items:
            type: object
            required: [id, app_id, app_name, hostname]
            properties:
              id: {type: string}
              app_id: {type: string}
              app_name: {type: string}
              hostname: {type: string}

    CertificateList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Certificate'}
        total: {type: integer}

    SaveCertificateRequest:
      type: object
      required: [name, certificate, private_key]
      additionalProperties: false
      properties:
        name: {type: string, description: A name that exists is replaced.}
        certificate: {type: string, description: 'The certificate and its intermediates, PEM, in any order.'}
        private_key: {type: string, description: The unencrypted private key, PEM. Sealed at once and never sent back.}

    SavedCertificate:
      type: object
      required: [certificate, replaced, reordered, updating]
      properties:
        certificate: {$ref: '#/components/schemas/Certificate'}
        replaced: {type: boolean}
        reordered: {type: boolean, description: The chain was pasted in another order and was put leaf first.}
        updating: {type: integer, description: How many apps are being re-applied in the background.}

    SetRegistryRequest:
      type: object
      required: [host, username, password]
      additionalProperties: false
      properties:
        name: {type: string}
        host: {type: string}
        username: {type: string}
        password: {type: string, description: A password or, better, a token that can only read packages.}

    AppProcess:
      type: object
      required: [app_id, name, command, instances, created_at, updated_at]
      properties:
        app_id: {type: string}
        name: {type: string}
        command: {type: string}
        instances: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}

    ProcessList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AppProcess'
              - type: object
                properties:
                  ready: {type: integer, description: 'Instances ready, when the cluster said.'}
                  phase: {type: string}
        total: {type: integer}

    SetProcessRequest:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command: {type: string, maxLength: 4096, description: 'One line, as in a Procfile.'}
        instances: {type: integer, minimum: 0, maximum: 100, description: 'What it was, or 1 for a new process, when left out.'}

    # --- volumes ---

    Volume:
      type: object
      required: [id, app_id, name, mount_path, size_gb, storage_class, created_at]
      properties:
        id: {type: string}
        app_id: {type: string}
        name: {type: string}
        mount_path: {type: string}
        size_gb: {type: integer}
        storage_class: {type: string}
        created_at: {type: string, format: date-time}

    VolumeList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Volume'}}
        total: {type: integer}

    CreateVolumeRequest:
      type: object
      required: [mount_path]
      additionalProperties: false
      properties:
        name: {type: string, default: data}
        mount_path: {type: string, description: 'Absolute, such as /data.'}
        size_gb: {type: integer, minimum: 1, default: 1}

    # --- databases ---

    Database:
      type: object
      required: [id, environment_id, name, slug, engine, engine_version, status, instances, storage_gb,
                 cpu_request_m, mem_request_mb, created_at, updated_at]
      properties:
        id: {type: string}
        environment_id: {type: string}
        name: {type: string}
        slug: {type: string}
        engine: {type: string, enum: [postgres, mysql, mariadb, mongodb, redis, valkey, dragonfly, clickhouse, memcached]}
        engine_version: {type: string}
        status: {type: string}
        status_detail: {type: string}
        instances: {type: integer}
        storage_gb: {type: integer}
        cpu_request_m: {type: integer}
        mem_request_mb: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    DatabaseList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Database'}}
        total: {type: integer}

    CreateDatabaseRequest:
      type: object
      required: [name, engine]
      additionalProperties: false
      properties:
        name: {type: string}
        engine: {type: string, enum: [postgres, mysql, mariadb, mongodb, redis, valkey, dragonfly, clickhouse, memcached]}
        version: {type: string}
        storage_gb: {type: integer}
        instances: {type: integer}

    DatabaseLink:
      type: object
      required: [database_id, app_id, var_name, created_at]
      properties:
        database_id: {type: string}
        app_id: {type: string}
        var_name: {type: string}
        created_at: {type: string, format: date-time}

    LinkDatabaseRequest:
      type: object
      required: [app_id]
      additionalProperties: false
      properties:
        app_id: {type: string}
        var_name: {type: string, description: 'The engine''s own default when left out: DATABASE_URL for postgres, MYSQL_URL for mysql and mariadb, MONGODB_URI for mongodb, REDIS_URL for redis, valkey and dragonfly, CLICKHOUSE_URL for clickhouse and MEMCACHED_URL for memcached. GET /api/database-engines lists them.'}

    DatabaseCredentials:
      type: object
      required: [engine, host, port, database, username, password, url]
      properties:
        engine: {type: string}
        host: {type: string}
        port: {type: integer}
        database: {type: string}
        username: {type: string}
        password: {type: string, format: password, description: 'Empty for memcached, which has none.'}
        url: {type: string}
        native_url:
          type: string
          description: ClickHouse only. Its native-protocol address on port 9000, beside the HTTP one url names.

    DatabaseEngine:
      type: object
      required: [name, title, port, default_version, versions, backups, replicated, storage, password, variable, storage_gb]
      properties:
        name: {type: string, enum: [postgres, mysql, mariadb, mongodb, redis, valkey, dragonfly, clickhouse, memcached]}
        title: {type: string, description: 'The product''s own name, such as PostgreSQL.'}
        port: {type: integer, description: 'The port the connection string names and `skifity db connect` listens on.'}
        default_version: {type: string}
        versions: {type: array, items: {type: string}, description: 'The versions offered, newest first.'}
        backups: {type: boolean, description: 'False for an engine Skifity does not back up. docs/backups.md says why for each.'}
        replicated: {type: boolean, description: 'True when more than one instance can be asked for. Only PostgreSQL.'}
        storage: {type: boolean, description: 'False for a cache, which keeps nothing on a disk.'}
        password: {type: boolean, description: 'False for an engine with no authentication, which only its own environment can reach.'}
        variable: {type: string, description: 'The variable a linked app reads the connection string from, when none is named.'}
        storage_gb: {type: integer, description: 'The disk a new database gets when none is asked for.'}

    DatabaseEngineList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DatabaseEngine'}}
        total: {type: integer}

    # --- backups ---

    Backup:
      type: object
      required: [id, target_type, target_id, status, kind, location, size_bytes, created_at, encrypted]
      properties:
        id: {type: string}
        target_type: {type: string, enum: [database, volume, panel]}
        target_id: {type: string}
        status: {type: string}
        kind: {type: string, description: 'manual, scheduled, before_update and the like.'}
        location: {type: string}
        size_bytes: {type: integer}
        error_message: {type: string}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        encrypted: {type: boolean, description: 'Sealed with the backup passphrase.'}
        verified_at: {type: string, format: date-time, description: 'When it was last read back whole.'}
        verify_error: {type: string}

    BackupList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Backup'}}
        total: {type: integer}

    BackupPolicy:
      type: object
      required: [id, target_type, target_id, schedule, retention, destination, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        schedule: {type: string, description: 'Five cron fields, in UTC.'}
        retention: {type: integer, description: 'How many to keep.'}
        destination: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SetBackupPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        schedule: {type: string, default: '0 3 * * *'}
        retention: {type: integer, default: 7}
        enabled: {type: boolean}

    # --- templates ---

    Template:
      type: object
      required: [id, name, description, category, website, services, databases]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        website: {type: string}
        beta: {type: boolean}
        services:
          type: array
          items:
            type: object
            required: [name, image, port, public]
            properties:
              name: {type: string}
              image: {type: string}
              port: {type: integer}
              health_path: {type: string}
              variables: {type: object, additionalProperties: {type: string}}
              volumes:
                type: array
                items:
                  type: object
                  required: [name, mount_path, size_gb]
                  properties:
                    name: {type: string}
                    mount_path: {type: string}
                    size_gb: {type: integer}
              mem_request_mb: {type: integer}
              mem_limit_mb: {type: integer}
              cpu_request_m: {type: integer}
              cpu_limit_m: {type: integer}
              public: {type: boolean, description: 'Gets a domain. A worker does not.'}
        databases:
          type: [array, 'null']
          items:
            type: object
            required: [name, engine, storage_gb, link_to, var_name]
            properties:
              name: {type: string}
              engine: {type: string}
              storage_gb: {type: integer}
              link_to: {type: [array, 'null'], items: {type: string}}
              var_name: {type: string}
        inputs:
          type: array
          description: Asked for at install time.
          items:
            type: object
            required: [key, label]
            properties:
              key: {type: string}
              label: {type: string}
              help: {type: string}
              default: {type: string}
              secret: {type: boolean}
              required: {type: boolean}
              generate: {type: boolean, description: 'Filled with a random secret when left empty.'}
        notes: {type: string}
        icon: {type: string, description: 'The logo''s file name, when there is one.'}
        catalogue:
          type: object
          description: The team catalogue it came from. Absent for a built-in template.
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}

    TemplateList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Template'}}
        total: {type: integer}

    InstallTemplateRequest:
      type: object
      required: [environment_id]
      additionalProperties: false
      properties:
        environment_id: {type: string}
        catalogue_id: {type: string, description: 'The team catalogue the template is in. Left out for the built-in one.'}
        name: {type: string, description: 'Used in place of the template''s name.'}
        values:
          type: object
          description: The template's inputs, by key.
          additionalProperties: {type: string}

    TemplateCatalogue:
      type: object
      required: [id, team_id, name, url, fetched_at, attempted_at, templates, problems, created_at, updated_at]
      properties:
        id: {type: string}
        team_id: {type: string}
        name: {type: string, description: 'The badge on each of its templates.'}
        url: {type: string, description: 'An https address with no credential in it.'}
        auth_header_name: {type: string, description: 'The header it is fetched with. Its value is never answered.'}
        format: {type: string, enum: [index, tar.gz, zip]}
        fetched_at: {type: string, format: date-time, description: 'When the copy templates are installed from was downloaded.'}
        attempted_at: {type: string, format: date-time, description: 'The last refresh, whether or not it worked.'}
        last_error: {type: string, description: 'Why the last refresh did not work. Empty when it did.'}
        templates: {type: integer, description: 'How many of its templates can be installed.'}
        problems:
          type: array
          description: Its templates that cannot be installed, and why.
          items: {$ref: '#/components/schemas/TemplateCatalogueProblem'}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TemplateCatalogueProblem:
      type: object
      required: [file, errors]
      properties:
        file: {type: string, description: 'The file in an archive, or the place in an index''s list.'}
        id: {type: string}
        name: {type: string}
        errors: {type: array, items: {type: string}}

    TemplateCatalogueList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TemplateCatalogue'}}
        total: {type: integer}

    AddTemplateCatalogueRequest:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 40}
        url: {type: string, description: 'https, to a YAML or JSON index or to a .tar.gz or .zip of templates.'}
        auth_header_name: {type: string, description: 'Such as Authorization, or PRIVATE-TOKEN for GitLab.'}
        auth_header_value: {type: string, writeOnly: true, description: 'Sealed, and never answered.'}

    InstalledTemplate:
      type: object
      required: [apps, databases]
      properties:
        apps:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/App'}
        databases:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Database'}
        notes: {type: string, description: 'The steps that could not be done for you.'}

    # --- plugins ---

    Plugin:
      type: object
      required: [id, manifest, version, status, enabled, installed_at]
      properties:
        id: {type: string}
        manifest: {type: string, description: 'The manifest as installed, as JSON text.'}
        version: {type: string}
        source_url: {type: string}
        status: {type: string}
        status_detail: {type: string}
        enabled: {type: boolean}
        installed_at: {type: string, format: date-time}
        installed_by: {type: string}

    PluginManifest:
      type: object
      description: A plugin's manifest. The plugin standard is documented at /docs/plugins.
      required: [apiVersion, id, name, description, version, license, author, image]
      properties:
        apiVersion: {type: string}
        id: {type: string}
        name: {type: string}
        description: {type: string}
        version: {type: string}
        homepage: {type: string}
        license: {type: string}
        author: {type: object}
        image: {type: string, description: 'By digest, never by tag.'}
        requires: {type: object}
        permissions: {type: array, items: {type: string}}
        events: {type: array, items: {type: object}}
        provides: {type: array, items: {type: object}}
        settings: {type: array, items: {type: object}}
        runtime: {type: object}

    PluginView:
      allOf:
        - $ref: '#/components/schemas/Plugin'
        - type: object
          required: [decoded, settings]
          properties:
            decoded: {$ref: '#/components/schemas/PluginManifest'}
            settings:
              type: array
              items:
                type: object
                required: [key, configured, secret]
                properties:
                  key: {type: string}
                  value: {type: string, description: 'Never returned for a secret.'}
                  configured: {type: boolean}
                  secret: {type: boolean}

    PluginList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PluginView'}}
        total: {type: integer}

    InspectPluginRequest:
      type: object
      additionalProperties: false
      description: Where the manifest is, or the manifest itself.
      properties:
        url: {type: string}
        manifest: {type: string, description: 'The manifest''s text, for a cluster with no way out to the internet.'}
        sha256: {type: string, description: 'The digest a signed store listed. The file fetched has to match it.'}

    InstallPluginRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        url: {type: string}
        manifest: {type: string}
        sha256: {type: string}
        permissions:
          type: array
          description: What inspect showed and the administrator agreed to.
          items: {type: string}

    PluginInspection:
      type: object
      required: [manifest, permissions, blocks_deploys]
      properties:
        manifest: {$ref: '#/components/schemas/PluginManifest'}
        permissions:
          type: [array, 'null']
          items: {type: string}
        blocks_deploys: {type: boolean, description: 'It can stop everybody''s deploys, which is called out on its own.'}
        already_installed: {type: string, description: 'The version installed now, when there is one.'}

    UpdatePluginRequest:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        settings:
          type: object
          description: The values it declared. A secret left out keeps what is stored; an empty one is cleared.
          additionalProperties: {type: string}

    PluginStoreCatalogue:
      type: object
      required: [index, verified, unsigned, url, installed]
      properties:
        index:
          type: object
          required: [version, plugins]
          properties:
            version: {type: integer}
            generated_at: {type: string, format: date-time}
            plugins:
              type: [array, 'null']
              items:
                type: object
                required: [id, name, description, version, license, author, manifest_url, manifest_sha256]
                properties:
                  id: {type: string}
                  name: {type: string}
                  description: {type: string}
                  version: {type: string}
                  license: {type: string}
                  author: {type: string}
                  homepage: {type: string}
                  category: {type: string}
                  manifest_url: {type: string}
                  manifest_sha256: {type: string}
                  paid: {type: boolean}
                  purchase_url: {type: string}
        verified: {type: boolean, description: 'Its signature was checked against the configured key.'}
        unsigned: {type: boolean, description: 'No key is configured, so nobody vouched for it.'}
        url: {type: string}
        installed:
          type: object
          description: The installed version of each plugin, by id.
          additionalProperties: {type: string}

    # --- panel administration ---

    Setting:
      type: object
      required: [key, secret, configured, label, group, help, kind]
      properties:
        key: {type: string}
        value: {type: string, description: 'Never returned for a secret.'}
        secret: {type: boolean}
        configured: {type: boolean}
        label: {type: string}
        group: {type: string}
        help: {type: string}
        kind: {type: string, description: 'Which control to draw.'}
        options: {type: array, items: {type: string}}
        multiline: {type: boolean}
        placeholder: {type: string}

    SettingList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Setting'}}
        total: {type: integer}

    UpdateSettingsRequest:
      type: object
      required: [values]
      additionalProperties: false
      properties:
        values:
          type: object
          description: Settings by key. An empty value clears one.
          additionalProperties: {type: string}

    ClusterComponent:
      type: object
      required: [name, status, version]
      properties:
        name: {type: string}
        status: {type: string, description: 'installed, absent and the states between.'}
        version: {type: string}
        installed_at: {type: string, format: date-time}
        detail: {type: string}

    ComponentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ClusterComponent'
              - type: object
                required: [title, description, optional, beta, approximate_memory_mb, external, upgrade_available]
                properties:
                  title: {type: string}
                  description: {type: string}
                  optional: {type: boolean}
                  beta: {type: boolean}
                  approximate_memory_mb: {type: integer}
                  external: {type: boolean, description: 'Installed with Helm, not by the panel.'}
                  docs: {type: string}
                  wanted_version: {type: string, description: 'The version this panel would install now.'}
                  upgrade_available: {type: boolean}
        total: {type: integer}

    K3sUpgradeOverview:
      type: object
      required: [nodes, releases]
      properties:
        nodes:
          type: [array, 'null']
          items:
            type: object
            required: [name, control_plane, ready, version]
            properties:
              name: {type: string}
              control_plane: {type: boolean}
              ready: {type: boolean}
              version: {type: string}
        releases:
          type: [array, 'null']
          items:
            type: object
            required: [channel, version]
            properties:
              channel: {type: string}
              version: {type: string}
              stable: {type: boolean, description: 'The release k3s recommends.'}
        releases_error: {type: string, description: 'Why the list of releases could not be read.'}
        plan: {$ref: '#/components/schemas/K3sUpgradePlan'}

    K3sUpgradePlan:
      type: object
      required: [target, steps, blockers, warnings, nothing]
      properties:
        target: {type: string}
        steps:
          type: array
          description: Every server, in the order it is upgraded.
          items:
            type: object
            required: [node, role, from, to, upgrade]
            properties:
              node: {type: string}
              role: {type: string}
              from: {type: string}
              to: {type: string}
              upgrade: {type: boolean, description: 'False for a server already at the target.'}
        blockers:
          type: array
          items: {$ref: '#/components/schemas/UpgradeReason'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/UpgradeReason'}
        nothing: {type: boolean, description: 'Every server already runs the target.'}

    UpgradeReason:
      type: object
      required: [code, text]
      properties:
        code: {type: string}
        params: {type: object, additionalProperties: {type: string}}
        text: {type: string, description: 'In English.'}

    KeyRotation:
      type: object
      required: [new_key_id, rewrapped, failed, recovery_key]
      properties:
        new_key_id: {type: string}
        rewrapped: {type: integer}
        failed: {type: integer, description: 'Secrets that could not be moved. The old key is kept while there are any.'}
        recovery_key: {type: string, description: 'The new recovery key. The old one no longer opens anything rewrapped.'}

    UpgradeStatus:
      type: object
      required: [current_version, commit, built, update_check, note]
      properties:
        current_version: {type: string}
        commit: {type: string}
        built: {type: string}
        update_check: {type: string, const: disabled}
        note: {type: string}

    UpgradeStarted:
      type: object
      required: [status, previous_image, snapshot, note, if_it_goes_wrong]
      properties:
        status: {type: string, const: started}
        previous_image: {type: string}
        snapshot: {type: string, description: 'The copy of the panel''s database taken first.'}
        note: {type: string}
        if_it_goes_wrong: {type: string, description: 'The commands that go back.'}
        off_site_copy: {type: string, description: 'Where the copy was also stored, when backup storage is configured.'}
