id: imgcompress
name: ImgCompress
description: Offline image compression, conversion, and AI background removal for Docker homelabs.
category: media
website: https://imgcompress.karimzouine.com
services:
- name: imgcompress
  image: karimz1/imgcompress:0.6.0
  needs_root: true
  port: 5000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
notes: The image starts as root, so the environment needs the baseline pod security level.
