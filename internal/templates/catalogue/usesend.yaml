id: usesend
name: Usesend
description: Usesend is an open-source alternative to Resend, Sendgrid, Mailgun and Postmark etc.
category: communication
website: https://docs.usesend.com/self-hosting/overview
services:
- name: usesend
  image: usesend/usesend:v1.9.8
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    HOSTNAME: 0.0.0.0
databases:
- name: usesend-db
  engine: postgres
  storage_gb: 5
  link_to:
  - usesend
  var_name: DATABASE_URL
