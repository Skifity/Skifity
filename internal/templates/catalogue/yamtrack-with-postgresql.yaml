id: yamtrack-with-postgresql
name: Yamtrack With Postgresql
description: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and
  books.
category: productivity
website: https://github.com/FuzzyGrim/Yamtrack/wiki
services:
- name: yamtrack
  image: ghcr.io/fuzzygrim/yamtrack:0.26
  port: 8000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: yamtrack-with-postgresql-db
  engine: postgres
  storage_gb: 5
  link_to:
  - yamtrack
  var_name: DATABASE_URL
