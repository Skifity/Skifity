id: paperless
name: Paperless
description: Paperless-ngx is a community-supported open-source document management system that transforms
  your physical documents into a searchable online archive so you can keep, well, less paper.
category: productivity
website: https://docs.paperless-ngx.com/configuration/
services:
- name: paperless
  image: paperlessngx/paperless-ngx:3.1
  port: 8000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    PAPERLESS_REDIS: redis://redis:6379
  volumes:
  - name: paperless-data
    mount_path: /usr/src/paperless/data
    size_gb: 5
  - name: paperless-media
    mount_path: /usr/src/paperless/media
    size_gb: 5
databases:
- name: paperless-db
  engine: redis
  storage_gb: 5
  link_to:
  - paperless
  var_name: DATABASE_URL
