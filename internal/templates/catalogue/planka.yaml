id: planka
name: PLANKA
description: A real-time Kanban board for teams, an open source alternative to Trello.
category: productivity
website: https://planka.app
services:
- name: planka
  image: ghcr.io/plankanban/planka:2.2.1
  port: 1337
  public: true
  mem_request_mb: 192
  mem_limit_mb: 768
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    TRUST_PROXY: 'true'
  volumes:
  - name: planka-data
    mount_path: /app/data
    size_gb: 5
databases:
- name: planka-db
  engine: postgres
  storage_gb: 5
  link_to:
  - planka
  var_name: DATABASE_URL
inputs:
- key: BASE_URL
  label: Public URL
  help: The address PLANKA will be reached at, including https://.
  required: true
- key: SECRET_KEY
  label: Secret key
  secret: true
  generate: true
- key: DEFAULT_ADMIN_EMAIL
  label: Admin email
  required: true
- key: DEFAULT_ADMIN_PASSWORD
  label: Admin password
  secret: true
  generate: true
- key: DEFAULT_ADMIN_NAME
  label: Admin name
  default: Admin
- key: DEFAULT_ADMIN_USERNAME
  label: Admin username
  default: admin
notes: Sign in with the admin email and password. While DEFAULT_ADMIN_EMAIL is set, that account cannot
  be edited or deleted in PLANKA, which keeps you from locking yourself out.
