id: docmost
name: Docmost
description: Open-source collaborative wiki and documentation software.
category: productivity
website: https://docmost.com/docs/
services:
- name: docmost
  image: docmost/docmost:0.96
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: docmost
    mount_path: /app/data/storage
    size_gb: 5
databases:
- name: docmost-db
  engine: postgres
  storage_gb: 5
  link_to:
  - docmost
  var_name: DATABASE_URL
