id: documenso
name: Documenso
description: Document signing, finally open source.
category: productivity
website: https://docs.documenso.com/
services:
- name: documenso
  image: documenso/documenso:v1.12.10
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /app/certs/cert.p12
    NEXT_PRIVATE_SIGNING_TRANSPORT: local
databases:
- name: documenso-db
  engine: postgres
  storage_gb: 5
  link_to:
  - documenso
  var_name: DATABASE_URL
