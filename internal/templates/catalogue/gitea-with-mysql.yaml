id: gitea-with-mysql
name: Gitea With Mysql
description: Gitea is a self-hosted, lightweight Git service, offering version control, collaboration,
  and code hosting.
category: developer
website: https://docs.gitea.com
services:
- name: gitea
  image: gitea/gitea:1.27
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    USER_UID: '1000'
    USER_GID: '1000'
  volumes:
  - name: gitea-data
    mount_path: /data
    size_gb: 5
  - name: gitea-timezone
    mount_path: /etc/timezone
    size_gb: 5
databases:
- name: gitea-with-mysql-db
  engine: mysql
  storage_gb: 5
  link_to:
  - gitea
  var_name: DATABASE_URL
