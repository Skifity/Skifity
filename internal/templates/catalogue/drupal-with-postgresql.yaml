id: drupal-with-postgresql
name: Drupal with PostgreSQL
description: Drupal is a free and open-source web content management system written in PHP and distributed
  under the GNU General Public License.
category: cms
website: https://www.drupal.org/about
services:
- name: drupal
  image: drupal:10.6.18-apache
  needs_root: true
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: drupal-with-postgresql-db
  engine: postgres
  storage_gb: 5
  link_to:
  - drupal
  var_name: DATABASE_URL
notes: 'Open the app''s address and follow Drupal''s installer. It reads no database setting from its
  environment: on its database step, choose PostgreSQL and enter the host, database name, user and password
  from Connection details on the database''s page - only an owner or an admin of the team can see them.
  The image starts as root, so the environment needs the baseline pod security level.'
