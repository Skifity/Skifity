id: n8n-with-postgres-and-worker
name: N8N With Postgres And Worker
description: n8n is an extendable workflow automation tool with queue mode and workers.
category: automation
website: https://n8n.io
services:
- name: n8n
  image: n8nio/n8n:2.10.4
  port: 5678
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_SCHEMA: public
    EXECUTIONS_MODE: queue
    QUEUE_HEALTH_CHECK_ACTIVE: 'true'
    N8N_RUNNERS_ENABLED: 'true'
    N8N_RUNNERS_MODE: external
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: 'true'
  volumes:
  - name: n8n-data
    mount_path: /home/node/.n8n
    size_gb: 5
- name: n8n-worker
  image: n8nio/n8n:2.10.4
  port: 0
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_SCHEMA: public
    EXECUTIONS_MODE: queue
    QUEUE_HEALTH_CHECK_ACTIVE: 'true'
    N8N_RUNNERS_ENABLED: 'true'
    N8N_RUNNERS_MODE: external
  volumes:
  - name: n8n-data
    mount_path: /home/node/.n8n
    size_gb: 5
- name: task-runners
  image: n8nio/runners:2.10.4
  port: 0
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: n8n-with-postgres-and-worker-db
  engine: postgres
  storage_gb: 5
  link_to:
  - n8n
  - n8n-worker
  - task-runners
  var_name: DATABASE_URL
notes: In the original this stack shares /home/node/.n8n between n8n and n8n-worker. Skifity gives each
  app storage of its own, so those are separate directories here. If the apps need to see the same files,
  point them at object storage — MinIO is in this catalogue — rather than a path. This template installs
  3 apps. They reach each other by name inside the environment, so keep them together.
