id: pocket-id
name: Pocket Id
description: A simple and secure OIDC provider with passkey authentication.
category: security
website: https://pocket-id.org/docs/setup/installation
services:
- name: pocket-id
  image: ghcr.io/pocket-id/pocket-id:v1.13
  port: 1411
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: pocket-id-data
    mount_path: /app/data
    size_gb: 5
