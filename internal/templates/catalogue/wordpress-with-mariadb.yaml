id: wordpress-with-mariadb
name: WordPress with MariaDB
description: WordPress is open source software you can use to create a beautiful website, blog, or app.
category: cms
website: https://wordpress.org
services:
- name: wordpress
  image: wordpress:7.1.4-apache
  needs_root: true
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: wordpress-files
    mount_path: /var/www/html
    size_gb: 5
databases:
- name: wordpress-with-mariadb-db
  engine: mariadb
  storage_gb: 5
  link_to:
  - wordpress
  var_name: DATABASE_URL
  vars:
    host: WORDPRESS_DB_HOST
    name: WORDPRESS_DB_NAME
    user: WORDPRESS_DB_USER
    password: WORDPRESS_DB_PASSWORD
notes: The image starts as root, so the environment needs the baseline pod security level.
