id: next-image-transformation
name: Next Image Transformation
description: Drop-in replacement for Vercel's Nextjs image optimization service.
category: media
website: https://github.com/coollabsio/next-image-transformation
services:
- name: next-image-transformation
  image: ghcr.io/coollabsio/next-image-transformation:0.0.3
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    NODE_ENV: production
- name: imgproxy
  image: darthsim/imgproxy:v4.0
  port: 8080
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
    IMGPROXY_JPEG_PROGRESSIVE: 'true'
    IMGPROXY_USE_ETAG: 'true'
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
