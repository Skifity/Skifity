id: whoogle
name: Whoogle
description: Whoogle is a self-hosted, privacy-focused search engine front-end for accessing Google search
  results without tracking and data collection.
category: storage
website: https://github.com/benbusby/whoogle-search
services:
- name: whoogle
  image: benbusby/whoogle-search:1.2.4
  port: 5000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
