id: grocy
name: Grocy
description: Grocy is a web-based household management and grocery list application.
category: productivity
website: https://github.com/grocy/grocy
services:
- name: grocy
  image: linuxserver/grocy:4.6.0
  needs_root: true
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    PUID: '1000'
    PGID: '1000'
    TZ: Europe/Madrid
  volumes:
  - name: grocy-config
    mount_path: /config
    size_gb: 5
notes: The image starts as root, so the environment needs the baseline pod security level.
