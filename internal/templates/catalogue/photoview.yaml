id: photoview
name: Photoview
description: A simple, fast photo gallery for the photos you already have on disk.
category: media
website: https://photoview.github.io
services:
- name: photoview
  image: photoview/photoview:2.4.0
  port: 8080
  public: true
  mem_request_mb: 256
  mem_limit_mb: 1024
  cpu_request_m: 100
  cpu_limit_m: 2000
  variables:
    PHOTOVIEW_DATABASE_DRIVER: postgres
    PHOTOVIEW_LISTEN_IP: '0.0.0.0'
    PHOTOVIEW_LISTEN_PORT: '8080'
  volumes:
  - name: photoview-photos
    mount_path: /photos
    size_gb: 50
  - name: photoview-cache
    mount_path: /home/photoview/media-cache
    size_gb: 10
databases:
- name: photoview-db
  engine: postgres
  storage_gb: 5
  link_to:
  - photoview
  var_name: PHOTOVIEW_POSTGRES_URL
notes: The first visit asks for an administrator and a photo path; enter /photos, which is the photos
  disk. Photoview only reads photos, it does not upload them, so put them on that disk yourself and scan
  from the settings page.
