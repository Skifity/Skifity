id: fider
name: Fider
description: Fider is a feedback platform for collecting and managing user feedback.
category: productivity
website: https://fider.io
services:
- name: fider
  image: getfider/fider:v0.36.0
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: fider-db
  engine: postgres
  storage_gb: 5
  link_to:
  - fider
  var_name: DATABASE_URL
