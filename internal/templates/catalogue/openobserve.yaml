id: openobserve
name: Openobserve
description: Cloud-native observability platform for logs, metrics, traces, RUM, errors and session replays
  — a 140x cheaper alternative to Elasticsearch, Splunk and Datadog.
category: monitoring
website: https://openobserve.ai/docs/
services:
- name: openobserve
  image: public.ecr.aws/zinclabs/openobserve:v0.90.0
  port: 5080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    ZO_DATA_DIR: /data
  volumes:
  - name: openobserve-data
    mount_path: /data
    size_gb: 5
