id: linkwarden
name: Linkwarden
description: A collaborative bookmark manager that saves a screenshot, PDF and readable copy of every link.
category: media
website: https://linkwarden.app
services:
- name: linkwarden
  image: ghcr.io/linkwarden/linkwarden:v2.16.3
  port: 3000
  public: true
  volumes:
  - name: linkwarden-data
    mount_path: /data/data
    size_gb: 10
  mem_request_mb: 512
  mem_limit_mb: 2048
  cpu_request_m: 100
  cpu_limit_m: 2000
databases:
- name: linkwarden-db
  engine: postgres
  storage_gb: 5
  link_to:
  - linkwarden
  var_name: DATABASE_URL
inputs:
- key: NEXTAUTH_URL
  label: Authentication URL
  help: Your public address followed by /api/v1/auth, for example https://links.example.com/api/v1/auth.
  required: true
- key: NEXTAUTH_SECRET
  label: Session secret
  secret: true
  generate: true
notes: Register the first account on the sign-up page. Set NEXT_PUBLIC_DISABLE_REGISTRATION to true on the
  app afterwards if nobody else should. Search uses the database; the optional Meilisearch index is not
  part of this template. The image starts as root, so the environment needs the baseline pod security
  level.
