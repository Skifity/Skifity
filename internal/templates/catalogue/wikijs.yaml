id: wikijs
name: Wikijs
description: The most powerful and extensible open source Wiki software.
category: cms
website: https://docs.requarks.io
services:
- name: wikijs
  image: ghcr.io/requarks/wiki:2
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: wikijs-db
  engine: postgres
  storage_gb: 5
  link_to:
  - wikijs
  var_name: DATABASE_URL
