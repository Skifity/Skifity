id: searxng
name: Searxng
description: SearXNG is a free internet metasearch engine which aggregates results from more than 70 search
  services.
category: storage
website: https://docs.searxng.org
services:
- name: searxng
  image: searxng/searxng:2026.9.17-c49771992
  port: 8080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: searxng-db
  engine: redis
  storage_gb: 5
  link_to:
  - searxng
  var_name: DATABASE_URL
