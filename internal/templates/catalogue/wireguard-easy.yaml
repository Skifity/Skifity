id: wireguard-easy
name: WireGuard Easy
description: The easiest way to run WireGuard VPN + Web-based Admin UI.
category: security
website: https://github.com/wg-easy/wg-easy
services:
- name: wg-easy
  image: ghcr.io/wg-easy/wg-easy:15.4
  needs_root: true
  port: 8000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    WG_PORT: '51820'
  volumes:
  - name: wg-easy
    mount_path: /etc/wireguard
    size_gb: 5
notes: The image starts as root, so the environment needs the baseline pod security level.
