id: ollama-with-open-webui
name: Ollama With Open Webui
description: Ollama with Open Web UI integrates AI model deployment with a user-friendly interface.
category: ai
website: https://docs.openwebui.com
services:
- name: ollama-api
  image: ollama/ollama:0.34.1
  port: 11434
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: ollama
    mount_path: /root/.ollama
    size_gb: 5
- name: open-webui
  image: ghcr.io/open-webui/open-webui:0.1
  port: 8080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    OLLAMA_BASE_URL: http://ollama-api:11434
  volumes:
  - name: open-webui
    mount_path: /app/backend/data
    size_gb: 5
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
