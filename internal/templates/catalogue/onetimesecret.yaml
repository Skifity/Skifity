id: onetimesecret
name: Onetimesecret
description: Share sensitive information securely with self-destructing links that are only viewable once.
category: security
website: https://docs.onetimesecret.com
services:
- name: onetimesecret
  image: onetimesecret/onetimesecret:v0.26.12
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    RACK_ENV: production
databases:
- name: onetimesecret-db
  engine: redis
  storage_gb: 5
  link_to:
  - onetimesecret
  var_name: DATABASE_URL
