id: cockpit
name: Cockpit
description: Cockpit is a headless content platform that is lightweight, fast and ready for takeoff.
category: cms
website: https://getcockpit.com/documentation/
services:
- name: cockpit
  image: cockpithq/cockpit:core-2.14.1
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: cockpit-config
    mount_path: /var/www/html/config
    size_gb: 5
  - name: cockpit-spaces
    mount_path: /var/www/html/.spaces
    size_gb: 5
