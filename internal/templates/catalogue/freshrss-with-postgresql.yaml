id: freshrss-with-postgresql
name: FreshRSS with PostgreSQL
description: A free, self-hostable feed aggregator.
category: media
website: https://freshrss.org/index.html
services:
- name: freshrss
  image: freshrss/freshrss:1.30.0
  needs_root: true
  port: 80
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: freshrss-data
    mount_path: /var/www/FreshRSS/data
    size_gb: 5
  - name: freshrss-extensions
    mount_path: /var/www/FreshRSS/extensions
    size_gb: 5
databases:
- name: freshrss-with-postgresql-db
  engine: postgres
  storage_gb: 5
  link_to:
  - freshrss
  var_name: DATABASE_URL
notes: 'Open the app''s address and follow FreshRSS''s installer. It reads no database setting from its
  environment: on its database step, choose PostgreSQL and enter the host, database name, user and password
  from Connection details on the database''s page - only an owner or an admin of the team can see them.
  The image starts as root, so the environment needs the baseline pod security level.'
