id: n8n-with-postgresql
name: N8N With Postgresql
description: n8n is an extendable workflow automation tool.
category: automation
website: https://n8n.io
services:
- name: n8n
  image: n8nio/n8n:2.10.2
  port: 5678
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_SCHEMA: public
    N8N_RUNNERS_ENABLED: 'true'
    N8N_RUNNERS_MODE: external
  volumes:
  - name: n8n-data
    mount_path: /home/node/.n8n
    size_gb: 5
- name: task-runners
  image: n8nio/runners:2.10.2
  port: 0
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: n8n-with-postgresql-db
  engine: postgres
  storage_gb: 5
  link_to:
  - n8n
  - task-runners
  var_name: DATABASE_URL
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
