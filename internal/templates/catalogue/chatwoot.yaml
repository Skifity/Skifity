id: chatwoot
name: Chatwoot
description: Delightful customer relationships at scale.
category: productivity
website: https://www.chatwoot.com/docs/self-hosted/
services:
- name: chatwoot
  image: chatwoot/chatwoot:v4.17.1
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: rails-data
    mount_path: /app/storage
    size_gb: 5
- name: sidekiq
  image: chatwoot/chatwoot:v4.17.1
  port: 0
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: rails-data
    mount_path: /app/storage
    size_gb: 5
databases:
- name: chatwoot-db
  engine: postgres
  storage_gb: 5
  link_to:
  - chatwoot
  - sidekiq
  var_name: DATABASE_URL
notes: In the original this stack shares /app/storage between chatwoot and sidekiq. Skifity gives each
  app storage of its own, so those are separate directories here. If the apps need to see the same files,
  point them at object storage — MinIO is in this catalogue — rather than a path. This template installs
  2 apps. They reach each other by name inside the environment, so keep them together.
