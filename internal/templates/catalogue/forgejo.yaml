id: forgejo
name: Forgejo
description: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance,
  it just does the job.
category: developer
website: https://forgejo.org/docs
services:
- name: forgejo
  image: codeberg.org/forgejo/forgejo:15.0.9
  needs_root: true
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    USER_UID: '1000'
    USER_GID: '1000'
  volumes:
  - name: forgejo-data
    mount_path: /data
    size_gb: 5
notes: The image starts as root, so the environment needs the baseline pod security level.
