id: cap-captcha
name: Cap Captcha
description: The self-hosted CAPTCHA for the modern web.
category: security
website: https://capjs.js.org/guide/
services:
- name: cap
  image: tiago2/cap:3.0.4
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: cap-captcha-db
  engine: redis
  storage_gb: 5
  link_to:
  - cap
  var_name: DATABASE_URL
