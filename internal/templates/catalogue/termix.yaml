id: termix
name: Termix
description: All-in-One SSH & Remote Desktop management app.
category: other
website: https://docs.termix.site/install/server/docker
services:
- name: termix
  image: ghcr.io/lukegus/termix:2.6.1
  port: 8080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    PORT: '8080'
    GUACD_HOST: guacd
    GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole
  volumes:
  - name: termix-data
    mount_path: /app/data
    size_gb: 5
- name: guacd
  image: guacamole/guacd:1.6.0
  port: 4822
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
