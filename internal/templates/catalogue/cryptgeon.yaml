id: cryptgeon
name: Cryptgeon
description: Secure note / file sharing service inspired by PrivNote.
category: security
website: https://github.com/cupcakearmy/cryptgeon
services:
- name: app
  image: cupcakearmy/cryptgeon:2.9
  port: 8000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
databases:
- name: cryptgeon-db
  engine: redis
  storage_gb: 5
  link_to:
  - app
  var_name: DATABASE_URL
