id: minecraft
name: Minecraft
description: Minecraft Server that will automatically download selected version at startup.
category: productivity
website: https://github.com/itzg/docker-minecraft-server
services:
- name: mc
  image: itzg/minecraft-server:2026.9.1
  # Minecraft is not HTTP, so there is no domain: players join on port 25565
  # of any server.
  port: 0
  public: false
  ports:
  - port: 25565
    protocol: tcp
  mem_request_mb: 1024
  mem_limit_mb: 2048
  cpu_request_m: 500
  cpu_limit_m: 2000
  variables:
    EULA: 'true'
    # The JVM's heap, inside the container's limit with room for the rest.
    MEMORY: 1536M
  volumes:
  - name: mc-data
    mount_path: /data
    size_gb: 10
notes: Players join at the address of any of your servers, port 25565. The world, its settings and the
  server's jar are kept on the volume, so a restart keeps everything. Installing it accepts Mojang's EULA
  (https://aka.ms/MinecraftEULA) on your behalf. The image starts as root and hands the server to uid
  1000, so the environment needs the baseline pod security level.
