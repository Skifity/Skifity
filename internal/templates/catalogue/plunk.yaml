id: plunk
name: Plunk
description: Plunk, The Open-Source Email Platform for AWS.
category: communication
website: https://docs.useplunk.com/getting-started/introduction
services:
- name: plunk
  image: driaug/plunk:1.3.6
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    NODE_OPTIONS: --no-network-family-autoselection
databases:
- name: plunk-db
  engine: postgres
  storage_gb: 5
  link_to:
  - plunk
  var_name: DATABASE_URL
