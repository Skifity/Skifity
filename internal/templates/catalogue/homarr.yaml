id: homarr
name: Homarr
description: Homarr is a self-hosted homepage for your services.
category: productivity
website: https://homarr.dev
services:
- name: homarr
  image: ghcr.io/homarr-labs/homarr:v1.40.0
  port: 7575
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: homarr-appdata
    mount_path: /appdata
    size_gb: 1
inputs:
- key: SECRET_ENCRYPTION_KEY
  label: Encryption key
  help: 64 hexadecimal characters. Make one with `openssl rand -hex 32` and keep a copy — the integrations Homarr stores cannot be read without it.
  secret: true
  required: true
