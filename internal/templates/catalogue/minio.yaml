id: minio
name: MinIO
description: S3-compatible object storage, useful as a backup target for Skifity itself.
category: storage
website: https://min.io
services:
- name: minio
  # MinIO stopped publishing images: minio/minio is gone from Docker Hub and
  # quay.io/minio/minio asks for credentials. pgsty/minio is the maintained
  # community build of the same source that Dokploy's template uses too.
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  port: 9001
  # The image's own command is a bare `minio`, which prints its help and
  # exits: the server, its data and where the console listens are asked for.
  command: exec minio server /data --console-address :9001
  variables: {}
  volumes:
  - name: data
    mount_path: /data
    size_gb: 20
  mem_request_mb: 256
  mem_limit_mb: 1024
  cpu_request_m: 100
  cpu_limit_m: 1000
  public: true
inputs:
- key: MINIO_ROOT_USER
  label: Root user
  default: skifity
  required: true
- key: MINIO_ROOT_PASSWORD
  label: Root password
  secret: true
  generate: true
notes: The console is the address this app gets; the S3 API listens on port 9000 inside the environment. Create a bucket, then point Settings, then Storage at this MinIO to back up your databases. The image starts as root, so the environment needs the baseline pod security level.
