id: ghost
name: Ghost
description: A fast publishing platform for newsletters and blogs.
category: cms
website: https://ghost.org
services:
- name: ghost
  image: ghost:5.130.6-alpine
  needs_root: true
  port: 2368
  health_path: /
  health_start_seconds: 600
  health_timeout_seconds: 10
  variables:
    NODE_ENV: production
    database__client: mysql
  volumes:
  - name: content
    mount_path: /var/lib/ghost/content
    size_gb: 5
  mem_request_mb: 256
  mem_limit_mb: 1024
  cpu_request_m: 100
  cpu_limit_m: 1000
  public: true
databases:
- name: ghost-db
  engine: mysql
  storage_gb: 5
  link_to:
  - ghost
  var_name: DATABASE_URL
  vars:
    host: database__connection__host
    port: database__connection__port
    name: database__connection__database
    user: database__connection__user
    password: database__connection__password
notes: Set the mail settings in Ghost's admin area, or it cannot send member emails. The image starts
  as root, so the environment needs the baseline pod security level.
