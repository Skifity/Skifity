id: flowise-with-databases
name: Flowise With Databases
description: Flowise is an open source low-code tool for developers to build customized LLM orchestration
  flows & AI agents. Also deploys Redis, Postgres and other services.
category: ai
website: https://docs.flowiseai.com/
services:
- name: flowise
  image: flowiseai/flowise:3.1.4
  port: 3001
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DATABASE_PATH: /root/.flowise
    APIKEY_PATH: /root/.flowise
    SECRETKEY_PATH: /root/.flowise
    LOG_PATH: /root/.flowise/logs
    BLOB_STORAGE_PATH: /root/.flowise/storage
  volumes:
  - name: flowise-data
    mount_path: /root/.flowise
    size_gb: 5
- name: qdrant
  image: qdrant/qdrant:v1.19
  port: 6333
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: flowise-qdrant-data
    mount_path: /qdrant/storage
    size_gb: 5
databases:
- name: flowise-with-databases-db
  engine: postgres
  storage_gb: 5
  link_to:
  - flowise
  var_name: DATABASE_URL
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
