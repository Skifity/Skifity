id: convex
name: Convex
description: Convex is the open-source reactive database for app developers.
category: developer
website: https://github.com/get-convex/convex-backend/blob/main/self-hosted/README.md
services:
- name: backend
  image: ghcr.io/get-convex/convex-backend:a9a760ca10399ed42e1b4bb87c78539a235488c7
  port: 3210
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: data
    mount_path: /convex/data
    size_gb: 5
- name: dashboard
  image: ghcr.io/get-convex/convex-dashboard:a9a760ca10399ed42e1b4bb87c78539a235488c7
  port: 6791
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
