id: invoiceshelf
name: InvoiceShelf
description: Invoicing, estimates, expenses and payments for freelancers and small businesses.
category: finance
website: https://invoiceshelf.com
services:
- name: invoiceshelf
  image: invoiceshelf/invoiceshelf:2.4.6
  run_as_user: 82
  port: 8080
  public: true
  mem_request_mb: 192
  mem_limit_mb: 768
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    APP_NAME: InvoiceShelf
    APP_ENV: production
    APP_DEBUG: 'false'
    DB_DATABASE: /var/www/html/storage/app/database.sqlite
    CACHE_STORE: file
    SESSION_DRIVER: file
    SESSION_LIFETIME: '240'
  volumes:
  - name: invoiceshelf-storage
    mount_path: /var/www/html/storage
    size_gb: 5
inputs:
- key: APP_URL
  label: Public URL
  help: The address InvoiceShelf will be reached at, including https://.
  required: true
notes: InvoiceShelf keeps its data in SQLite on its own disk. The first visit opens the installation
  wizard; at the database step choose SQLite and keep the path /var/www/html/storage/app/database.sqlite,
  then create the administrator account.
