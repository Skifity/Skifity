id: nextcloud-with-mysql
name: Nextcloud with MySQL
description: NextCloud is a self-hosted, open-source platform that provides file storage, collaboration,
  and communication tools for seamless data management.
category: storage
website: https://docs.nextcloud.com
services:
- name: nextcloud
  image: nextcloud:35.0.2-apache
  needs_root: true
  port: 80
  public: true
  mem_request_mb: 256
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: nextcloud-html
    mount_path: /var/www/html
    size_gb: 10
databases:
- name: nextcloud-with-mysql-db
  engine: mysql
  storage_gb: 5
  link_to:
  - nextcloud
  var_name: DATABASE_URL
  vars:
    host: MYSQL_HOST
    name: MYSQL_DATABASE
    user: MYSQL_USER
    password: MYSQL_PASSWORD
notes: 'Open the app''s address and create the admin account: the database step is already filled in from
  the database this template created. Nextcloud and everything uploaded to it are on one disk, at /var/www/html.
  If its links come out as http://, set OVERWRITEPROTOCOL to https in the app''s variables - HTTPS ends
  at the ingress in front of it. The image starts as root, so the environment needs the baseline pod security
  level.'
