id: soketi
name: Soketi
description: Soketi is your simple, fast, and resilient open-source WebSockets server.
category: communication
website: https://docs.soketi.app
services:
- name: soketi
  image: quay.io/soketi/soketi:1.6-16-debian
  port: 6001
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
