id: opengist
name: Opengist
description: Self-hosted pastebin and gists powered by Git, with search, embeds and clone over HTTP.
category: developer
website: https://opengist.io
services:
- name: opengist
  image: ghcr.io/thomiceli/opengist:1.15.2
  port: 6157
  public: true
  health_path: /healthcheck
  variables:
    OG_SSH_GIT_ENABLED: 'false'
  volumes:
  - name: opengist-data
    mount_path: /opengist
    size_gb: 5
  mem_request_mb: 64
  mem_limit_mb: 512
  cpu_request_m: 25
  cpu_limit_m: 1000
notes: The first account registered becomes the admin; registration for everyone else can be turned off in
  the admin panel. Gists clone and push over HTTPS. Git over SSH is turned off, because only the web port
  is published. The image starts as root, so the environment needs the baseline pod security level.
