id: evolution-api
name: Evolution Api
description: Multi-platform messaging (whatsapp and more) integration API.
category: developer
website: https://doc.evolution-api.com/v2/en/get-started/introduction
services:
- name: api
  image: evoapicloud/evolution-api:v2.3.7
  port: 8080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: evolution-instances
    mount_path: /evolution/instances
    size_gb: 5
databases:
- name: evolution-api-db
  engine: redis
  storage_gb: 5
  link_to:
  - api
  var_name: DATABASE_URL
