id: calibre-web
name: Calibre Web
description: Calibre-web is a web app providing a clean interface for browsing, reading and downloading
  eBooks.
category: media
website: https://github.com/linuxserver/docker-calibre-web
services:
- name: calibre-web
  image: linuxserver/calibre-web:0.6.27
  port: 8083
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    PUID: '1000'
    PGID: '1000'
  volumes:
  - name: calibre-web-data
    mount_path: /config
    size_gb: 5
  - name: calibre-library
    mount_path: /books
    size_gb: 5
