id: listmonk
name: Listmonk
description: Self-hosted newsletter and mailing list manager.
category: communication
website: https://listmonk.app/
services:
- name: listmonk
  image: listmonk/listmonk:v6.0.0
  port: 9000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    LISTMONK_app__address: 0.0.0.0:9000
    LISTMONK_db__database: listmonk
    TZ: Etc/UTC
  volumes:
  - name: listmonk-data
    mount_path: /listmonk/uploads
    size_gb: 5
databases:
- name: listmonk-db
  engine: postgres
  storage_gb: 5
  link_to:
  - listmonk
  var_name: DATABASE_URL
notes: 'This stack has a set-up step that runs once and exits — listmonk-initial-database-setup. Skifity
  runs apps, not one-shot containers, so that step is not installed: do it yourself from the app''s Commands
  tab, or follow the project''s own instructions, before expecting everything to work.'
