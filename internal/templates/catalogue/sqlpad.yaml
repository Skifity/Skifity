id: sqlpad
name: SQLPad
description: Write and run SQL in the browser against Postgres, MySQL, SQL Server, ClickHouse and more,
  and chart the results.
category: developer
website: https://getsqlpad.com
beta: true
services:
- name: sqlpad
  image: sqlpad/sqlpad:7.5.7
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 512
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    SQLPAD_DB_PATH: /var/lib/sqlpad
  volumes:
  - name: sqlpad-data
    mount_path: /var/lib/sqlpad
    size_gb: 2
inputs:
- key: SQLPAD_ADMIN
  label: Admin email
  required: true
- key: SQLPAD_ADMIN_PASSWORD
  label: Admin password
  secret: true
  generate: true
notes: SQLPad has been archived by its author and no longer receives fixes, so keep it away from anything
  you would not want exposed. Add connections to your databases in the interface, using the host and
  credentials from a managed database's page in Skifity. The image starts as root, so the environment
  needs the baseline pod security level.
