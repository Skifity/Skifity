id: rocketchat
name: Rocketchat
description: Self-hosted, secure and highly customizable open-source communication platform for organizations
  with sophisticated security and privacy concerns.
category: communication
website: https://github.com/RocketChat/Rocket.Chat
services:
- name: rocketchat
  image: registry.rocket.chat/rocketchat/rocket.chat:8.0.1
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DEPLOY_METHOD: docker
- name: mongodb
  image: mongo:7
  port: 27017
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: mongodb-data
    mount_path: /data/db
    size_gb: 5
notes: This template installs 2 apps. They reach each other by name inside the environment, so keep them
  together.
