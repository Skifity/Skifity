id: rocketchat
name: Rocketchat
description: Self-hosted, secure and highly customizable open-source communication platform for organizations
  with sophisticated security and privacy concerns.
category: communication
website: https://github.com/RocketChat/Rocket.Chat
beta: true
services:
- name: rocketchat
  image: registry.rocket.chat/rocketchat/rocket.chat:8.0.1
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DEPLOY_METHOD: docker
- name: mongodb
  image: mongo:7.0.43
  port: 27017
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: mongodb-data
    mount_path: /data/db
    size_gb: 5
notes: Rocket.Chat will not start until it is told where its MongoDB is, and this template does not do
  that for you yet. After installing, set the start command of the mongodb app to docker-entrypoint.sh
  mongod --replSet rs0 --bind_ip_all, because Rocket.Chat only runs against a replica set, and once it
  is up run the one-off command
  mongosh --host mongodb --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})" in
  it. Then add MONGO_URL=mongodb://mongodb:27017/rocketchat?replicaSet=rs0 to the rocketchat app and
  redeploy it. This template installs 2 apps. They reach each other by name inside the environment, so
  keep them together.
