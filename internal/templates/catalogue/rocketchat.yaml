id: rocketchat
name: Rocket.Chat
description: Self-hosted, secure and highly customizable open-source communication platform for organizations
  with sophisticated security and privacy concerns.
category: communication
website: https://github.com/RocketChat/Rocket.Chat
beta: true
services:
- name: rocketchat
  image: registry.rocket.chat/rocketchat/rocket.chat:8.0.1
  # The image's USER is rocketchat; the number lets the strict level check it.
  run_as_user: 65533
  port: 3000
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    DEPLOY_METHOD: docker
    MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
    MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
- name: mongodb
  image: mongo:7.0.43
  port: 27017
  public: false
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  # Rocket.Chat only runs against a replica set. The set is started here and
  # initiated once, by a loop that stops as soon as it has one.
  command: (until mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
    >/dev/null 2>&1; do sleep 2; done) & exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all
  volumes:
  - name: mongodb-data
    mount_path: /data/db
    size_gb: 5
notes: Rocket.Chat reaches its MongoDB by name, and the MongoDB app starts itself as a one-member
  replica set, which Rocket.Chat needs. Set ROOT_URL on the rocketchat app to the address it is reached
  at, or links in its emails point at localhost. This template installs 2 apps. They reach each other
  by name inside the environment, so keep them together.
