id: spacebot
name: Spacebot
description: An agentic AI system with specialized processes for thinking, working, and remembering.
category: ai
website: https://docs.spacebot.sh/docker
services:
- name: spacebot
  image: ghcr.io/spacedriveapp/spacebot:v0.5.0
  port: 19898
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  volumes:
  - name: spacebot-data
    mount_path: /data
    size_gb: 5
