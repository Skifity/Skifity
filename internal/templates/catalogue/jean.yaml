id: jean
name: Jean
description: Open-source desktop and server client for orchestrating AI coding agents.
category: developer
website: https://github.com/coollabsio/jean/blob/main/docs/headless-server.md
services:
- name: jean
  image: ghcr.io/coollabsio/jean-server:v0.1.73
  port: 3456
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    JEAN_DATA_DIR: /home/jean/.local/share/com.jean.desktop
  volumes:
  - name: jean-data
    mount_path: /home/jean/.local/share/com.jean.desktop
    size_gb: 5
