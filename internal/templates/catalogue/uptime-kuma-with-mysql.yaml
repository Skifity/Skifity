id: uptime-kuma-with-mysql
name: Uptime Kuma with MySQL
description: Uptime Kuma is a monitoring tool for tracking the status and performance of your applications
  in real-time.
category: monitoring
website: https://github.com/louislam/uptime-kuma
services:
- name: uptime-kuma
  image: louislam/uptime-kuma:2.5.5
  needs_root: true
  port: 3001
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    UPTIME_KUMA_DB_TYPE: mariadb
  volumes:
  - name: uptime-kuma-data
    mount_path: /app/data
    size_gb: 5
databases:
- name: uptime-kuma-with-mysql-db
  engine: mysql
  storage_gb: 5
  link_to:
  - uptime-kuma
  var_name: DATABASE_URL
  vars:
    host: UPTIME_KUMA_DB_HOSTNAME
    port: UPTIME_KUMA_DB_PORT
    name: UPTIME_KUMA_DB_NAME
    user: UPTIME_KUMA_DB_USERNAME
    password: UPTIME_KUMA_DB_PASSWORD
notes: The image starts as root, so the environment needs the baseline pod security level.
