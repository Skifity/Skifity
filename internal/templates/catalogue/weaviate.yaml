id: weaviate
name: Weaviate
description: Weaviate is an open-source vector database that stores both objects and vectors, allowing
  for combining vector search with structured filtering.
category: ai
website: https://weaviate.io/developers/weaviate
services:
- name: weaviate
  image: cr.weaviate.io/semitechnologies/weaviate:1.26.4
  port: 8080
  public: true
  mem_request_mb: 128
  mem_limit_mb: 1024
  cpu_request_m: 50
  cpu_limit_m: 1000
  variables:
    PERSISTENCE_DATA_PATH: /var/lib/weaviate
  volumes:
  - name: weaviate-data
    mount_path: /var/lib/weaviate
    size_gb: 5
