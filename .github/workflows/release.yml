name: Release

on:
  push:
    tags: ["v*"]
  # Started by tag.yml on the tag it has just made: a tag pushed with a
  # workflow's own token starts no workflow by itself. Started on anything
  # but a tag, the release job below does not run.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the commits since the last
          # tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io wants a lowercase path and GITHUB_REPOSITORY keeps the owner's
      # capitalisation, so it is lowered here rather than assumed.
      - name: Where this release publishes to
        run: |
          {
            echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}"
          } >> "$GITHUB_ENV"

      # The installer downloaded from this tag has to know which release it is.
      # It reads RELEASED_VERSION from its own source, so a tag whose installer
      # still says something else would install the wrong image — or, while the
      # line is empty, refuse to install at all. Caught here, before anything is
      # published, rather than by the first person to run it.
      - name: The installer agrees with the tag
        run: |
          set -eu
          declared=$(SKIFITY_INSTALLER_LIB=1 sh -c '. ./installer/install.sh; printf "%s" "$RELEASED_VERSION"')
          if [ "$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "installer/install.sh says RELEASED_VERSION=\"${declared}\", but this tag is ${GITHUB_REF_NAME}." >&2
            echo "Set it in the release commit and tag that commit. See docs/releasing.md." >&2
            exit 1
          fi
          echo "installer/install.sh installs ${declared}"

      # The k3s a fresh install of this release gets: K3S_VERSION in the
      # installer, which Cluster and Two servers installed and passed on
      # before tag.yml tagged the commit. A release that cannot say which k3s
      # it was tested with is not published; the release notes name it.
      - name: The k3s this release was tested with
        run: |
          set -eu
          k3s=$(SKIFITY_INSTALLER_LIB=1 sh -c '. ./installer/install.sh; printf "%s" "$K3S_VERSION"')
          if ! printf '%s' "$k3s" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+[+]k3s[0-9]+$'; then
            echo "installer/install.sh says K3S_VERSION=\"${k3s}\", which is not a k3s release such as v1.37.2+k3s1." >&2
            echo "Set it to the k3s the Cluster workflow passed on. See docs/releasing.md." >&2
            exit 1
          fi
          echo "K3S_VERSION=${k3s}" >> "$GITHUB_ENV"
          echo "A fresh install of ${GITHUB_REF_NAME} gets k3s ${k3s}"

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The installer people download names the panel's image by digest as
      # well as by tag: a tag can be moved by anybody who can push to the
      # registry, a digest cannot. The digest exists only now, after the push,
      # so the attached copy is pinned here, its line in checksums.txt is
      # replaced, and both go up over what GoReleaser attached; the provenance
      # below signs the pinned one. For the seconds before this finishes, the
      # attached installer pulls by tag, as every installer did before it.
      - name: Pin the attached installer to the image's digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          ref="${IMAGE_REPO}:${GITHUB_REF_NAME}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          mkdir -p dist/pinned
          sh scripts/pin-installer-image.sh "${ref}@${digest}" installer/install.sh dist/pinned/install.sh
          checksums=$(printf '%s' "$ARTIFACTS" | jq -r '.[] | select(.type == "Checksum") | .path')
          sum=$(sha256sum dist/pinned/install.sh | cut -d' ' -f1)
          awk -v sum="$sum" '$2 == "install.sh" { print sum "  install.sh"; n++; next } { print } END { exit n != 1 }' \
            "$checksums" > dist/pinned/checksums.txt
          cp dist/pinned/checksums.txt "$checksums"
          gh release upload "$GITHUB_REF_NAME" dist/pinned/install.sh "$checksums" --clobber
          echo "The attached installer installs ${ref}@${digest}"

      # What the provenance below vouches for: every file in checksums.txt,
      # which is every binary the release published, and the installers.
      - name: The digests to sign
        id: hashes
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksums=$(printf '%s' "$ARTIFACTS" | jq -r '.[] | select(.type == "Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$checksums")" >> "$GITHUB_OUTPUT"

  # SLSA level 3 provenance for the binaries, signed by GitHub's OIDC identity
  # and attached to the release as skifity.intoto.jsonl, so anybody can check
  # that a binary was built by this workflow from this tag:
  #
  #   slsa-verifier verify-artifact skifity-linux-amd64 \
  #     --provenance-path skifity.intoto.jsonl \
  #     --source-uri github.com/Skifity/Skifity --source-tag v0.1.0
  #
  # The generator verifies its own reference, so it is pinned to a tag rather
  # than a commit, as its documentation requires.
  provenance:
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      provenance-name: skifity.intoto.jsonl
