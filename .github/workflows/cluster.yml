name: Cluster

# The crosscheck, test/cluster/verify.sh, on a real k3s cluster.
#
# Everything in CI checks Skifity against fakes, golden files and an in-process
# SSH server. This is the other half. A GitHub-hosted runner is a fresh Ubuntu
# server with systemd that nobody minds throwing away, which is exactly what
# verify.sh asks for: it installs Skifity with the real installer, from the
# image built from this commit, and works through the checklist in
# docs/checklist.md against the cluster it made.
#
# Its own workflow rather than a job in CI: it takes long and needs the
# internet, so it must not hold up the fast checks, and what it says is a
# report from a real cluster to act on.

on:
  push:
    branches: [main]
    # A change to the documentation alone changes nothing a cluster can see,
    # and a push cancels the run in progress.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      phases:
        description: "Which phases of verify.sh to run"
        required: false
        default: "1 2 3 4 5"
      from:
        description: "The release the upgrade starts from (the newest when empty)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Real cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Without the cross-compiled CLIs: they are for the panel's download
      # page, and building five of them costs minutes that nothing here uses.
      # The panel still serves its own binary for this machine's platform.
      - name: Build the panel image from this commit
        run: |
          docker build \
            --build-arg VERSION="cluster-${GITHUB_SHA::7}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg CLI_PLATFORMS="" \
            -t skifity:local .

      # k3s imports every tarball in this directory when it first starts, so
      # the image is there before the cluster is and nothing is pushed anywhere.
      - name: Hand the image to k3s before k3s exists
        run: |
          sudo mkdir -p /var/lib/rancher/k3s/agent/images
          docker save skifity:local | sudo tee /var/lib/rancher/k3s/agent/images/skifity.tar >/dev/null

      # A server somebody installs Skifity on does not run Docker, and Docker
      # sets the FORWARD chain to DROP: that is a different machine from the
      # one the installer is written for.
      - name: Make the runner a fresh server
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo iptables -P FORWARD ACCEPT
          free -m
          df -h /

      # A bucket for phase 2's backup and restore, on this server's own
      # address: S3 that nothing outside can reach, which is the case the
      # backup jobs' network policy exists for. moto is a stand-in for S3 that
      # answers presigned URLs as S3 does and keeps what it is given in memory.
      - name: Start a bucket on this server
        run: |
          python3 -m venv /tmp/moto
          /tmp/moto/bin/pip install --quiet 'moto[server]>=5.1,<6'
          nohup /tmp/moto/bin/moto_server -H 0.0.0.0 -p 9000 >/tmp/moto.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          curl -fsS -X PUT http://127.0.0.1:9000/skifity-backups >/dev/null
          address=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          echo "BUCKET_ENDPOINT=http://${address}:9000" >>"$GITHUB_ENV"

      # An ACME server on this server's address, for phase 1's certificate.
      # Nothing on the internet can reach this runner, so Let's Encrypt cannot
      # validate a domain here; Pebble, Let's Encrypt's own test server, can,
      # from here and through the same ingress. Its address is signed by an
      # authority made for this run, which the crosscheck gives the panel the
      # way an ACME server of one's own is given to it.
      - name: Start an ACME server on this server
        run: |
          address=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          mkdir -p /tmp/pebble
          cd /tmp/pebble
          curl -fsSL -o pebble.tar.gz \
            https://github.com/letsencrypt/pebble/releases/download/v2.10.1/pebble-linux-amd64.tar.gz
          tar -xzf pebble.tar.gz
          pebble=$(find "$PWD" -type f -name pebble | head -1)
          # The archive does not keep the binary's execute bit.
          chmod +x "$pebble"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Crosscheck ACME authority" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=pebble" -keyout key.pem -out server.csr
          printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=IP:%s,IP:127.0.0.1,DNS:localhost\n' \
            "$address" >server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out cert.pem
          cat >config.json <<'JSON'
          {"pebble": {
            "listenAddress": "0.0.0.0:14000", "managementListenAddress": "127.0.0.1:15000",
            "certificate": "/tmp/pebble/cert.pem", "privateKey": "/tmp/pebble/key.pem",
            "httpPort": 80, "tlsPort": 443, "ocspResponderURL": "", "externalAccountBindingRequired": false,
            "profiles": {"default": {"description": "The crosscheck's", "validityPeriod": 7776000}}
          }}
          JSON
          PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 nohup "$pebble" -config config.json >/tmp/pebble.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS --cacert ca.pem -o /dev/null "https://${address}:14000/dir" && break
            sleep 1
          done
          curl -fsS --cacert ca.pem "https://${address}:14000/dir" || {
            cat /tmp/pebble.log
            exit 1
          }
          {
            echo "ACME_DIRECTORY=https://${address}:14000/dir"
            echo "ACME_ADDRESS=${address}"
          } >>"$GITHUB_ENV"

      # A Git host on this server's own address, as a Gitea at home or a
      # GitLab on the office network is: builds are kept off such addresses
      # until an administrator lists the host. Its certificate is signed by an
      # authority made for the run, which the panel is given the way one's own
      # is. It holds the sample app phase 1 also builds from GitHub. Gitea will
      # not run as root, and this step is not.
      - name: Start a Git host on this server
        run: |
          address=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          mkdir -p /tmp/gitea/data /tmp/gitea/sample
          cd /tmp/gitea
          curl -fsSL -o gitea https://dl.gitea.com/gitea/28.2.0/gitea-28.2.0-linux-amd64
          curl -fsSL -o gitea.sha256 https://dl.gitea.com/gitea/28.2.0/gitea-28.2.0-linux-amd64.sha256
          echo "$(cut -d' ' -f1 gitea.sha256)  gitea" | sha256sum -c -
          chmod +x gitea
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Crosscheck Git authority" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=gitea" -keyout key.pem -out server.csr
          printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=IP:%s,IP:127.0.0.1\n' \
            "$address" >server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
            -extfile server.ext -out cert.pem
          cat >app.ini <<EOF
          APP_NAME = Crosscheck
          WORK_PATH = /tmp/gitea/data
          [server]
          PROTOCOL = https
          HTTP_ADDR = 0.0.0.0
          HTTP_PORT = 3443
          ROOT_URL = https://${address}:3443/
          CERT_FILE = /tmp/gitea/cert.pem
          KEY_FILE = /tmp/gitea/key.pem
          DISABLE_SSH = true
          OFFLINE_MODE = true
          [database]
          DB_TYPE = sqlite3
          PATH = /tmp/gitea/data/gitea.db
          [security]
          INSTALL_LOCK = true
          [service]
          DISABLE_REGISTRATION = true
          EOF
          nohup ./gitea web --config /tmp/gitea/app.ini >/tmp/gitea.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs --cacert ca.pem -o /dev/null "https://${address}:3443/api/healthz" && break
            sleep 1
          done
          curl -fsS --cacert ca.pem -o /dev/null "https://${address}:3443/api/healthz" || {
            cat /tmp/gitea.log
            exit 1
          }
          ./gitea admin user create --config /tmp/gitea/app.ini --admin --username crosscheck \
            --password not-a-real-password --email crosscheck@example.test --must-change-password=false
          curl -fsS --cacert ca.pem -u crosscheck:not-a-real-password -X POST "https://${address}:3443/api/v1/user/repos" \
            -H 'Content-Type: application/json' -d '{"name":"sample","default_branch":"main"}' >/dev/null
          cp "$GITHUB_WORKSPACE"/test/cluster/sample-app/* sample/
          cd sample
          git init -q -b main
          git add -A
          git -c user.name=Crosscheck -c user.email=crosscheck@example.test commit -q -m "The sample app"
          GIT_SSL_CAINFO=/tmp/gitea/ca.pem git push -q "https://crosscheck:not-a-real-password@${address}:3443/crosscheck/sample.git" main
          echo "GIT_HOST_REPO=https://${address}:3443/crosscheck/sample.git" >>"$GITHUB_ENV"

      # Somewhere for phase 5's notifications to arrive besides a webhook, on
      # this server's address as a team's own servers would be, each read
      # back through its own API: Mailpit, a mail server that keeps what it
      # is sent; ntfy, refusing anybody without a token; and Gotify, which
      # takes an application's token and is read with a client's.
      - name: Start the services notifications go to
        run: |
          address=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          mkdir -p /tmp/notify
          cd /tmp/notify
          healthy() {
            for _ in $(seq 1 30); do
              curl -fs -o /dev/null "$1" && return 0
              sleep 1
            done
            cat "$2"
            return 1
          }

          curl -fsSL -o mailpit.tar.gz \
            https://github.com/axllent/mailpit/releases/download/v1.31.6/mailpit-linux-amd64.tar.gz
          tar -xzf mailpit.tar.gz mailpit
          nohup ./mailpit --smtp 0.0.0.0:1025 --listen 0.0.0.0:8025 --disable-version-check \
            >/tmp/mailpit.log 2>&1 &
          healthy http://127.0.0.1:8025/api/v1/messages /tmp/mailpit.log

          curl -fsSL -o ntfy.tar.gz \
            https://github.com/binwiederhier/ntfy/releases/download/v2.32.0/ntfy_2.32.0_linux_amd64.tar.gz
          tar -xzf ntfy.tar.gz --strip-components=1 ntfy_2.32.0_linux_amd64/ntfy
          export NTFY_AUTH_FILE=/tmp/notify/ntfy-users.db NTFY_AUTH_DEFAULT_ACCESS=deny-all
          nohup ./ntfy serve --listen-http :8090 --cache-file /tmp/notify/ntfy-cache.db >/tmp/ntfy.log 2>&1 &
          healthy http://127.0.0.1:8090/v1/health /tmp/ntfy.log
          NTFY_PASSWORD=not-a-real-password ./ntfy user add --role=admin crosscheck
          ntfy_token=$(./ntfy token add crosscheck | grep -oE 'tk_[A-Za-z0-9]+')

          curl -fsSL -o gotify.zip https://github.com/gotify/server/releases/download/v3.1.1/gotify-linux-amd64.zip
          unzip -q gotify.zip gotify-linux-amd64
          GOTIFY_SERVER_PORT=8070 GOTIFY_DATABASE_DIALECT=sqlite3 GOTIFY_DATABASE_CONNECTION=/tmp/notify/gotify.db \
            GOTIFY_DEFAULTUSER_NAME=admin GOTIFY_DEFAULTUSER_PASS=not-a-real-password \
            GOTIFY_UPLOADEDIMAGESDIR=/tmp/notify/gotify-images GOTIFY_PLUGINSDIR=/tmp/notify/gotify-plugins \
            nohup ./gotify-linux-amd64 serve >/tmp/gotify.log 2>&1 &
          healthy http://127.0.0.1:8070/health /tmp/gotify.log
          gotify() {
            curl -fsS -u admin:not-a-real-password -X POST "http://127.0.0.1:8070/$1" \
              -H 'Content-Type: application/json' -d "{\"name\":\"$2\"}" | jq -r '.token // empty'
          }
          gotify_app=$(gotify application Skifity)
          gotify_client=$(gotify client "The crosscheck")

          if [ -z "$ntfy_token" ] || [ -z "$gotify_app" ] || [ -z "$gotify_client" ]; then
            echo "ntfy or Gotify did not hand out a token" >&2
            exit 1
          fi
          {
            echo "SMTP_SERVER=${address}:1025"
            echo "MAILPIT=http://127.0.0.1:8025"
            echo "NTFY_SERVER=http://${address}:8090"
            echo "NTFY_TOKEN=${ntfy_token}"
            echo "GOTIFY_SERVER=http://${address}:8070"
            echo "GOTIFY_TOKEN=${gotify_app}"
            echo "GOTIFY_CLIENT_TOKEN=${gotify_client}"
          } >>"$GITHUB_ENV"

      # Let's Encrypt's staging server for the panel's own address: nothing on
      # the internet can reach this runner, so no certificate will be issued
      # for it, and the production server is not the place to fail a challenge
      # on every push. The installer says so and carries on, which is part of
      # what is being checked.
      - name: Install Skifity and run the crosscheck
        env:
          PHASES: ${{ inputs.phases || '1 2 3 4 5' }}
        run: |
          sudo env \
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
            SKIFITY_IMAGE=skifity:local \
            SKIFITY_ASSUME_YES=1 \
            SKIFITY_ACME_STAGING=1 \
            SKIFITY_PHASES="$PHASES" \
            VERIFY_GIT_REPO="https://github.com/${GITHUB_REPOSITORY}" \
            VERIFY_GIT_BRANCH="${GITHUB_REF_NAME}" \
            VERIFY_S3_ENDPOINT="$BUCKET_ENDPOINT" \
            VERIFY_S3_BUCKET=skifity-backups \
            VERIFY_S3_ACCESS_KEY=not-a-real-key \
            VERIFY_S3_SECRET_KEY=not-a-real-secret \
            VERIFY_ACME_DIRECTORY="$ACME_DIRECTORY" \
            VERIFY_ACME_CA=/tmp/pebble/ca.pem \
            VERIFY_ACME_ADDRESS="$ACME_ADDRESS" \
            VERIFY_ACME_ROOT=https://127.0.0.1:15000/roots/0 \
            VERIFY_SMTP_SERVER="$SMTP_SERVER" \
            VERIFY_MAILPIT="$MAILPIT" \
            VERIFY_NTFY_SERVER="$NTFY_SERVER" \
            VERIFY_NTFY_TOKEN="$NTFY_TOKEN" \
            VERIFY_GOTIFY_SERVER="$GOTIFY_SERVER" \
            VERIFY_GOTIFY_TOKEN="$GOTIFY_TOKEN" \
            VERIFY_GOTIFY_CLIENT_TOKEN="$GOTIFY_CLIENT_TOKEN" \
            VERIFY_GIT_HOST_REPO="$GIT_HOST_REPO" \
            VERIFY_GIT_HOST_CA=/tmp/gitea/ca.pem \
            bash test/cluster/verify.sh

      - name: Collect what the cluster says
        if: always()
        run: sudo bash test/cluster/collect.sh "$RUNNER_TEMP/cluster-report"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cluster-report
          path: ${{ runner.temp }}/cluster-report
          retention-days: 14

  # Most servers are not fresh installs: an earlier release installed them, and
  # they get this commit by running the newer installer over the top.
  # upgrade.sh installs the newest published release with that release's own
  # installer, keeps an app serving, upgrades to the image built from this
  # commit, and goes back with the commands the installer printed.
  upgrade:
    name: Upgrade from the last release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the panel image from this commit, and the app kept serving
        run: |
          docker build \
            --build-arg VERSION="cluster-${GITHUB_SHA::7}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg CLI_PLATFORMS="" \
            -t skifity:local .
          docker build -t skifity-sample:upgrade test/cluster/sample-app

      - name: Hand both images to k3s before k3s exists
        run: |
          sudo mkdir -p /var/lib/rancher/k3s/agent/images
          docker save skifity:local skifity-sample:upgrade | sudo tee /var/lib/rancher/k3s/agent/images/skifity.tar >/dev/null

      - name: Make the runner a fresh server
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo iptables -P FORWARD ACCEPT

      - name: Find the newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >>"$GITHUB_OUTPUT"

      - name: Install it, upgrade it to this commit, and go back
        env:
          UPGRADE_FROM: ${{ inputs.from || steps.release.outputs.tag }}
        run: |
          sudo env \
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
            SKIFITY_IMAGE=skifity:local \
            SKIFITY_ASSUME_YES=1 \
            UPGRADE_FROM="$UPGRADE_FROM" \
            bash test/cluster/upgrade.sh

      - name: Collect what the cluster says
        if: always()
        run: sudo bash test/cluster/collect.sh "$RUNNER_TEMP/upgrade-report"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-report
          path: ${{ runner.temp }}/upgrade-report
          retention-days: 14
